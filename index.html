const S = {
  students: () => DB.state.students.filter(s => !s.archived),
  allStudents: () => DB.state.students,
  student: id => DB.get("students", id),
  subject: id => DB.get("subjects", id),
  subjectsFor(studentId) {
    const subs = DB.state.subjects;
    if (!studentId || studentId === "all") return subs;
    return subs.filter(s => !s.studentIds || !s.studentIds.length || s.studentIds.includes(studentId));
  },
  scope() { return DB.state.ui.scope || "all"; },
  scopeStudents() {
    const sc = S.scope();
    return sc === "all" ? S.students() : S.students().filter(s => s.id === sc);
  },
  inScope(studentId) {
    const sc = S.scope();
    return sc === "all" || studentId === sc || !studentId;
  },
  studentName: id => (S.student(id) || {}).name || "Unassigned",
  studentColor: id => (S.student(id) || {}).color || "var(--brand)",
  subjectName: id => (S.subject(id) || {}).name || "General",
  subjectColor: id => (S.subject(id) || {}).color || "var(--brand)",
  subjectIcon: id => (S.subject(id) || {}).icon || "book-open",

  lessonsOn(dateISO, scope) {
    const sc = scope || S.scope();
    return DB.state.lessons.filter(l => l.date === dateISO && (sc === "all" || l.studentId === sc));
  },
  lessonsBetween(a, b, scope) {
    const sc = scope || S.scope();
    return DB.state.lessons.filter(l => l.date >= a && l.date <= b && (sc === "all" || l.studentId === sc));
  },
  assignmentsOpen(scope) {
    const sc = scope || S.scope();
    return DB.state.assignments.filter(a => a.status !== "done" && a.status !== "skipped" && (sc === "all" || a.studentId === sc));
  },
  overdue(scope) {
    const t = todayISO();
    return S.assignmentsOpen(scope).filter(a => a.due && a.due < t);
  },
  dueToday(scope) {
    const t = todayISO();
    return S.assignmentsOpen(scope).filter(a => a.due === t);
  },
  isSchoolDay(dateISO) {
    const sy = DB.state.schoolYear;
    const d = parseISO(dateISO);
    if (!d) return false;
    if (dateISO < sy.start || dateISO > sy.end) return false;
    if (!sy.schoolDays.includes(d.getDay())) return false;
    return !S.breakOn(dateISO);
  },
  breakOn(dateISO) {
    return (DB.state.schoolYear.breaks || []).find(b => dateISO >= b.start && dateISO <= b.end) || null;
  },
  attendanceFor(studentId, dateISO) {
    return DB.state.attendance.find(a => a.studentId === studentId && a.date === dateISO) || null;
  },
  attendanceStats(studentId, from, to) {
    const sy = DB.state.schoolYear;
    const a0 = from || sy.start, a1 = to || sy.end;
    const rows = DB.state.attendance.filter(a => a.studentId === studentId && a.date >= a0 && a.date <= a1);
    const counting = rows.filter(r => (ATT_STATUS.find(s => s.id === r.status) || {}).counts);
    const days = counting.length;
    const mins = sum(counting, r => (r.hours ? r.hours * 60 : DB.state.settings.hoursPerDay * 60));
    return { days, hours: mins / 60, rows, absent: rows.filter(r => r.status === "absent").length };
  },
  eventsOn(dateISO, scope) {
    const sc = scope || S.scope();
    const out = [];
    for (const e of DB.state.events) {
      if (e.date !== dateISO) continue;
      if (sc !== "all" && e.studentIds && e.studentIds.length && !e.studentIds.includes(sc)) continue;
      out.push(e);
    }
    for (const t of DB.state.trips) {
      if (t.date !== dateISO) continue;
      if (sc !== "all" && t.studentIds && t.studentIds.length && !t.studentIds.includes(sc)) continue;
      out.push({ ...t, _trip: true, title: t.title });
    }
    return out;
  },
  gradeLetter(p) {
    if (p === null || p === undefined || isNaN(p)) return "—";
    const row = DB.state.gradeScale.find(g => p >= g.min);
    return row ? row.letter : "F";
  },
  subjectGrade(studentId, subjectId) {
    const rows = DB.state.grades.filter(g => g.studentId === studentId && g.subjectId === subjectId && g.score !== "" && g.score !== null);
    if (!rows.length) return null;
    const cats = DB.state.gradeCategories;
    const byCat = groupBy(rows, r => r.category || "Assignments");
    let wsum = 0, wtot = 0, plain = [];
    for (const [cat, list] of byCat) {
      const earned = sum(list, r => Number(r.score));
      const possible = sum(list, r => Number(r.max) || 100);
      if (!possible) continue;
      const p = (earned / possible) * 100;
      plain.push(p);
      const w = (cats.find(c => c.name === cat) || {}).weight;
      if (w) { wsum += p * w; wtot += w; }
    }
    if (wtot > 0) return Math.round(wsum / wtot);
    return Math.round(plain.reduce((a, b) => a + b, 0) / plain.length);
  },
  studentAverage(studentId) {
    const subs = DB.state.subjects.map(s => S.subjectGrade(studentId, s.id)).filter(v => v !== null);
    if (!subs.length) return null;
    return Math.round(subs.reduce((a, b) => a + b, 0) / subs.length);
  },
  progressFor(studentId, subjectId) {
    const ls = DB.state.lessons.filter(l => l.studentId === studentId && (!subjectId || l.subjectId === subjectId));
    const done = ls.filter(l => l.status === "complete").length;
    return { done, total: ls.length, pct: pct(done, ls.length) };
  },
  daysSinceBackup() {
    const last = DB.state.settings.lastBackupAt;
    if (!last) return null;
    return Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
  },
  needsBackup() {
    const every = DB.state.settings.backupEveryDays;
    if (!every) return false;
    if (!hasAnyData()) return false;
    const d = S.daysSinceBackup();
    return d === null || d >= every;
  },
};

function hasAnyData() {
  const s = DB.state;
  return s.students.length + s.lessons.length + s.assignments.length + s.reading.length + s.portfolio.length > 0;
}

/* ---------- Recurrence materialisation ---------- */
function buildRecurrence(rec, template) {
  // rec: { type:'daily'|'weekly'|'everyN', days:[0-6], interval:n, start, end }
  const out = [];
  const start = parseISO(rec.start), end = parseISO(rec.end);
  if (!start || !end || end < start) return { rows: [], recurId: null };
  const recurId = uid("r");
  let cursor = new Date(start);
  let guard = 0;
  const weekAnchor = startOfWeek(start, DB.state.settings.weekStart);
  while (cursor <= end && guard++ < 800) {
    const dow = cursor.getDay();
    let hit = false;
    if (rec.type === "daily") hit = true;
    else if (rec.type === "weekly") hit = (rec.days || []).includes(dow);
    else if (rec.type === "everyN") {
      const weeks = Math.floor((startOfWeek(cursor, DB.state.settings.weekStart) - weekAnchor) / (7 * 86400000));
      hit = (rec.days || []).includes(dow) && weeks % (rec.interval || 2) === 0;
    }
    if (hit && !(rec.skipBreaks && S.breakOn(iso(cursor)))) {
      out.push(Object.assign({}, template, { date: iso(cursor), recurId, status: "planned" }));
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return { rows: out, recurId };
}


/* ===== 32-blobs.js ===== */
/* ============================================================
   Blobs — IndexedDB store for portfolio images & attachments.
   Keeps big files out of localStorage so the planner never
   runs out of room. Thumbnails are cached in memory for
   instant, synchronous rendering.
   ============================================================ */
const Blobs = {
  db: null,
  thumbs: new Map(),      // id -> dataURL (small)
  _ready: null,

  open() {
    if (this._ready) return this._ready;
    this._ready = new Promise(resolve => {
      let req;
      try { req = indexedDB.open("hcc-files", 1); }
      catch (e) { resolve(null); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("files")) db.createObjectStore("files");
        if (!db.objectStoreNames.contains("thumbs")) db.createObjectStore("thumbs");
      };
      req.onsuccess = () => { this.db = req.result; resolve(this.db); };
      req.onerror = () => resolve(null);
    });
    return this._ready;
  },

  async _tx(store, mode) {
    const db = await this.open();
    if (!db) return null;
    try { return db.transaction(store, mode).objectStore(store); }
    catch (e) { return null; }
  },

  /* Fallback for browsers that block IndexedDB on local files
     (some Firefox/Safari configurations). Smaller capacity, same API. */
  _fbKey: id => "hcc.file." + id,
  _fbThumbKey: id => "hcc.thumb." + id,

  async put(id, full, thumb) {
    const s1 = await this._tx("files", "readwrite");
    if (!s1) {
      try {
        localStorage.setItem(this._fbKey(id), full);
        localStorage.setItem(this._fbThumbKey(id), thumb || full);
        this.thumbs.set(id, thumb || full);
        return true;
      } catch (e) {
        toast("This browser is low on space for images — try a smaller photo, or open the planner in Chrome or Edge.", { icon: "alert", ms: 8000 });
        return false;
      }
    }
    s1.put(full, id);
    const s2 = await this._tx("thumbs", "readwrite");
    if (s2) s2.put(thumb || full, id);
    this.thumbs.set(id, thumb || full);
    return true;
  },

  async get(id) {
    const s = await this._tx("files", "readonly");
    if (!s) { try { return localStorage.getItem(this._fbKey(id)); } catch (e) { return null; } }
    return new Promise(res => { const r = s.get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); });
  },

  async del(id) {
    const s1 = await this._tx("files", "readwrite");
    if (!s1) { try { localStorage.removeItem(this._fbKey(id)); localStorage.removeItem(this._fbThumbKey(id)); } catch (e) {} }
    else {
      s1.delete(id);
      const s2 = await this._tx("thumbs", "readwrite"); if (s2) s2.delete(id);
    }
    this.thumbs.delete(id);
  },

  async loadThumbs() {
    const s = await this._tx("thumbs", "readonly");
    if (!s) {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("hcc.thumb.")) this.thumbs.set(k.slice(10), localStorage.getItem(k));
        }
      } catch (e) {}
      return;
    }
    await new Promise(res => {
      const req = s.openCursor();
      req.onsuccess = e => {
        const c = e.target.result;
        if (c) { this.thumbs.set(c.key, c.value); c.continue(); } else res();
      };
      req.onerror = () => res();
    });
  },

  async exportAll() {
    const s = await this._tx("files", "readonly");
    if (!s) {
      const out = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("hcc.file.")) out[k.slice(9)] = localStorage.getItem(k);
        }
      } catch (e) {}
      return out;
    }
    return new Promise(res => {
      const out = {};
      const req = s.openCursor();
      req.onsuccess = e => {
        const c = e.target.result;
        if (c) { out[c.key] = c.value; c.continue(); } else res(out);
      };
      req.onerror = () => res(out);
    });
  },

  async importAll(map) {
    for (const [id, data] of Object.entries(map || {})) {
      const thumb = await makeThumb(data);
      await this.put(id, data, thumb);
    }
  },

  async clear() {
    const s1 = await this._tx("files", "readwrite");
    if (s1) s1.clear(); else {
      try {
        Object.keys(localStorage).filter(k => k.startsWith("hcc.file.") || k.startsWith("hcc.thumb.")).forEach(k => localStorage.removeItem(k));
      } catch (e) {}
    }
    const s2 = await this._tx("thumbs", "readwrite"); if (s2) s2.clear();
    this.thumbs.clear();
  },

  thumb(id) { return this.thumbs.get(id) || null; },
};

function makeThumb(dataUrl, max = 320) {
  return new Promise(res => {
    if (!/^data:image\//.test(dataUrl || "")) return res(null);
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      try { res(c.toDataURL("image/jpeg", 0.7)); } catch (e) { res(null); }
    };
    img.onerror = () => res(null);
    img.src = dataUrl;
  });
}

async function storageEstimate() {
  let localBytes = 0;
  try { localBytes = new Blob([localStorage.getItem(STORAGE_KEY) || ""]).size; } catch (e) {}
  let usage = null, quota = null;
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      usage = est.usage; quota = est.quota;
    }
  } catch (e) {}
  return { localBytes, usage, quota };
}
function fmtBytes(b) {
  if (b === null || b === undefined) return "—";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(0) + " KB";
  return (b / 1048576).toFixed(1) + " MB";
}

/* ---------- Toast ---------- */
function toast(msg, opts = {}) {
  const wrap = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role", "status");
  el.innerHTML = `${opts.icon ? icon(opts.icon) : ""}<span>${esc(msg)}</span>` +
    (opts.action ? `<button type="button" data-toast-action>${esc(opts.action)}</button>` : "");
  wrap.appendChild(el);
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 220); };
  const timer = setTimeout(close, opts.ms || 3600);
  if (opts.action) {
    el.querySelector("[data-toast-action]").onclick = () => { clearTimeout(timer); close(); opts.onAction && opts.onAction(); };
  }
  return close;
}

/* ---------- Modal plumbing ---------- */
const ModalStack = [];
function openModal({ title, subtitle, body, footer, size = "", onMount, className = "", scrimClass = "", closeOnScrim = true, labelledBy }) {
  const scrim = document.createElement("div");
  scrim.className = "scrim " + scrimClass;
  const id = uid("m");
  scrim.innerHTML = `
    <div class="modal ${size} ${className}" role="dialog" aria-modal="true" aria-labelledby="${id}-t">
      ${title !== undefined ? `<div class="modal-hd">
        <div style="min-width:0">
          <h2 id="${id}-t">${esc(title)}</h2>
          ${subtitle ? `<div class="sub">${esc(subtitle)}</div>` : ""}
        </div>
        <div class="spacer"></div>
        <button class="btn btn-ghost btn-icon btn-sm" data-close aria-label="Close">${icon("x")}</button>
      </div>` : ""}
      <div class="modal-bd">${body || ""}</div>
      ${footer ? `<div class="modal-ft">${footer}</div>` : ""}
    </div>`;
  document.body.appendChild(scrim);
  document.body.style.overflow = "hidden";
  const modal = scrim.querySelector(".modal");
  const close = () => {
    scrim.remove();
    const i = ModalStack.indexOf(ctl); if (i >= 0) ModalStack.splice(i, 1);
    if (!ModalStack.length) document.body.style.overflow = "";
    if (ctl._prevFocus && document.contains(ctl._prevFocus)) ctl._prevFocus.focus();
  };
  const ctl = { scrim, modal, close, _prevFocus: document.activeElement };
  ModalStack.push(ctl);
  scrim.addEventListener("mousedown", e => { if (e.target === scrim && closeOnScrim) close(); });
  scrim.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
  // focus trap
  scrim.addEventListener("keydown", e => {
    if (e.key !== "Tab") return;
    const f = $$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', modal)
      .filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  onMount && onMount(ctl);
  setTimeout(() => {
    const auto = modal.querySelector("[data-autofocus]") || modal.querySelector("input:not([type=hidden]),textarea,select,button");
    auto && auto.focus();
  }, 40);
  return ctl;
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ModalStack.length) {
    e.stopPropagation();
    ModalStack[ModalStack.length - 1].close();
  }
});

/* ---------- Confirm ---------- */
function confirmDialog({ title, body = "", confirmLabel = "Confirm", cancelLabel = "Cancel", danger = false, onConfirm }) {
  const ctl = openModal({
    title, size: "modal-sm",
    body: `<p class="muted" style="margin:0">${body}</p>`,
    footer: `<div class="spacer"></div>
      <button class="btn btn-ghost" data-close>${esc(cancelLabel)}</button>
      <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-ok>${esc(confirmLabel)}</button>`,
    onMount(c) {
      c.modal.querySelector("[data-ok]").onclick = () => { c.close(); onConfirm && onConfirm(); };
      setTimeout(() => c.modal.querySelector("[data-ok]").focus(), 50);
    }
  });
  return ctl;
}

/* ---------- Choice dialog (this / all future) ---------- */
function choiceDialog({ title, body, choices }) {
  openModal({
    title, size: "modal-sm",
    body: `${body ? `<p class="muted">${body}</p>` : ""}
      <div class="col" style="gap:8px">
        ${choices.map((c, i) => `<button class="btn ${c.danger ? "btn-danger" : ""} btn-block" style="justify-content:flex-start" data-choice="${i}">${c.icon ? icon(c.icon) : ""}${esc(c.label)}</button>`).join("")}
      </div>`,
    footer: `<div class="spacer"></div><button class="btn btn-ghost" data-close>Cancel</button>`,
    onMount(c) {
      $$("[data-choice]", c.modal).forEach(b => b.onclick = () => {
        c.close(); choices[+b.dataset.choice].run();
      });

/* ---------- Context menu ---------- */
function contextMenu(anchor, items) {
  $$(".menu").forEach(m => m.remove());
  const m = document.createElement("div");
  m.className = "menu";
  m.setAttribute("role", "menu");
  m.innerHTML = items.map((it, i) =>
    it.sep ? `<div class="menu-sep"></div>`
      : it.label && it.header ? `<div class="menu-label">${esc(it.label)}</div>`
        : `<button role="menuitem" data-i="${i}" class="${it.danger ? "danger" : ""}">${it.icon ? icon(it.icon) : ""}${esc(it.label)}</button>`
  ).join("");
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - mw - 10);
  let top = r.bottom + 6;
  if (top + mh > window.innerHeight - 10) top = Math.max(10, r.top - mh - 6);
  m.style.left = Math.max(10, left) + "px";
  m.style.top = top + "px";
  const close = () => { m.remove(); document.removeEventListener("mousedown", away, true); document.removeEventListener("keydown", esckey, true); };
  const away = e => { if (!m.contains(e.target)) close(); };
  const esckey = e => { if (e.key === "Escape") { close(); anchor.focus(); } };
  setTimeout(() => { document.addEventListener("mousedown", away, true); document.addEventListener("keydown", esckey, true); }, 0);
  $$("button[data-i]", m).forEach(b => b.onclick = () => { close(); items[+b.dataset.i].run && items[+b.dataset.i].run(); });
  const f = m.querySelector("button"); f && f.focus();
  return close;
}

/* ============================================================
   Declarative form builder
   ============================================================ */
function fieldHTML(f, vals) {
  const v = vals[f.key];
  const id = "f_" + f.key;
  const cls = f.half ? "" : "full";
  const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : "";
  const lbl = f.label ? `<label for="${id}">${esc(f.label)}${f.required ? ' <span aria-hidden="true" style="color:var(--bad-ink)">*</span>' : ""}</label>` : "";

  switch (f.type) {
    case "static":
      return `<div class="${cls}">${f.html}</div>`;

    case "textarea":
      return `<div class="field ${cls}">${lbl}<textarea class="inp" id="${id}" data-key="${f.key}" rows="${f.rows || 3}" placeholder="${attr(f.placeholder || "")}">${esc(v || "")}</textarea>${hint}</div>`;

    case "select": {
      const opts = (typeof f.options === "function" ? f.options() : f.options) || [];
      return `<div class="field ${cls}">${lbl}<select class="sel" id="${id}" data-key="${f.key}">
        ${f.placeholder ? `<option value="">${esc(f.placeholder)}</option>` : ""}
        ${opts.map(o => `<option value="${attr(o.value)}" ${String(v) === String(o.value) ? "selected" : ""}>${esc(o.label)}</option>`).join("")}
      </select>${hint}</div>`;
    }

    case "toggle":
      return `<div class="field ${cls}"><label class="switch"><input type="checkbox" data-key="${f.key}" ${v ? "checked" : ""}><span class="track"></span><span>${esc(f.label)}</span></label>${hint}</div>`;

    case "chips": {
      const opts = (typeof f.options === "function" ? f.options() : f.options) || [];
      return `<div class="field ${cls}">${lbl}<div class="opt-grid" data-chips="${f.key}">
        ${opts.map(o => `<button type="button" class="opt ${String(v) === String(o.value) ? "is-on" : ""}" data-val="${attr(o.value)}">${o.icon ? icon(o.icon) : ""}${esc(o.label)}</button>`).join("")}
      </div>${hint}</div>`;
    }

    case "multi": {
      const opts = (typeof f.options === "function" ? f.options() : f.options) || [];
      const arr = Array.isArray(v) ? v : [];
      return `<div class="field ${cls}">${lbl}<div class="opt-grid" data-multi="${f.key}">
        ${opts.map(o => `<button type="button" class="opt ${arr.includes(o.value) ? "is-on" : ""}" data-val="${attr(o.value)}">${esc(o.label)}</button>`).join("")}
      </div>${hint}</div>`;
    }

    case "duration": {
      const isCustom = v !== null && v !== "" && v !== undefined && !DURATIONS.includes(Number(v));
      return `<div class="field ${cls}">${lbl}<div class="opt-grid" data-duration="${f.key}">
        ${DURATIONS.map(d => `<button type="button" class="opt ${Number(v) === d ? "is-on" : ""}" data-val="${d}">${d}m</button>`).join("")}
        <button type="button" class="opt ${isCustom ? "is-on" : ""}" data-val="custom">Custom…</button>
        <button type="button" class="opt ${v === null || v === "" ? "is-on" : ""}" data-val="none">No set time</button>
      </div>
      <input class="inp" type="number" min="1" max="600" data-duration-custom="${f.key}" placeholder="Minutes" value="${isCustom ? attr(v) : ""}" style="${isCustom ? "" : "display:none"};margin-top:8px;max-width:160px">
      ${hint}</div>`;
    }

    case "color":
      return `<div class="field ${cls}">${lbl}<div class="color-grid" data-color="${f.key}">
        ${PALETTE.map(c => `<button type="button" class="color-dot ${v === c ? "is-on" : ""}" style="--c:${c}" data-val="${c}" aria-label="Colour ${c}"></button>`).join("")}
      </div>${hint}</div>`;

    case "rating": {
      const n = Number(v) || 0;
      return `<div class="field ${cls}">${lbl}<div class="row" style="gap:2px" data-rating="${f.key}">
        ${[1, 2, 3, 4, 5].map(i => `<button type="button" class="btn btn-ghost btn-icon btn-sm" data-val="${i}" aria-label="${i} star${i > 1 ? "s" : ""}" style="color:${i <= n ? "var(--warn)" : "var(--line-strong)"}">${icon(i <= n ? "star-fill" : "star")}</button>`).join("")}
        <button type="button" class="btn btn-ghost btn-sm" data-val="0">Clear</button>
      </div>${hint}</div>`;
    }

    case "checklist": {
      const arr = Array.isArray(v) ? v : [];
      return `<div class="field ${cls}">${lbl}
        <div data-checklist="${f.key}">
          <div class="cl-list">${arr.map((it, i) => `
            <div class="cl-item ${it.done ? "done" : ""}">
              <input type="checkbox" data-cl-toggle="${i}" ${it.done ? "checked" : ""} aria-label="Done">
              <span style="flex:1 1 auto">${esc(it.text)}</span>
              <button type="button" class="btn btn-ghost btn-icon btn-sm" data-cl-del="${i}" aria-label="Remove">${icon("x")}</button>
            </div>`).join("")}</div>
          <div class="row" style="margin-top:8px">
            <input class="inp" data-cl-input placeholder="${attr(f.placeholder || "Add an item…")}">
            <button type="button" class="btn btn-sm" data-cl-add>${icon("plus")}Add</button>
          </div>
        </div>${hint}</div>`;
    }

    case "tags":
      return `<div class="field ${cls}">${lbl}<input class="inp" id="${id}" data-key="${f.key}" data-tags value="${attr(Array.isArray(v) ? v.join(", ") : (v || ""))}" placeholder="${attr(f.placeholder || "Comma separated")}">${hint}</div>`;

    case "advanced":
      return `<div class="${cls}">
        <button type="button" class="adv-toggle" aria-expanded="false" data-adv>${icon("chev-r")}More options</button>
        <div class="adv-body form-grid" data-adv-body>${f.fields.map(sf => fieldHTML(sf, vals)).join("")}</div>
      </div>`;

    case "heading":
      return `<div class="${cls}" style="margin-top:4px"><div class="eyebrow">${esc(f.label)}</div></div>`;

    default: {
      const t = f.type || "text";
      const extra = t === "number" ? `min="${f.min ?? ""}" max="${f.max ?? ""}" step="${f.step || "any"}"` : "";
      return `<div class="field ${cls}">${lbl}<input class="inp" type="${t}" id="${id}" data-key="${f.key}" value="${attr(v ?? "")}" placeholder="${attr(f.placeholder || "")}" ${extra} ${f.required ? "required" : ""} ${f.autofocus ? "data-autofocus" : ""}>${hint}</div>`;
    }
  }
}

function openForm({ title, subtitle, fields, values = {}, submitLabel = "Save", size = "", onSubmit, onDelete, onDuplicate, deleteLabel = "Delete", note }) {
  const vals = Object.assign({}, values);
  const flat = [];
  const walk = fs => fs.forEach(f => { if (f.type === "advanced") { flat.push(f); walk(f.fields); } else flat.push(f); });
  walk(fields);

  const body = `<form class="form-grid" data-form novalidate>${fields.map(f => fieldHTML(f, vals)).join("")}</form>
    ${note ? `<div class="callout" style="margin-top:16px">${icon("info")}<div>${note}</div></div>` : ""}`;

  const ctl = openModal({
    title, subtitle, size,
    body,
    footer: `${onDelete ? `<button class="btn btn-danger btn-sm" data-del>${icon("trash")}${esc(deleteLabel)}</button>` : ""}
      ${onDuplicate ? `<button class="btn btn-ghost btn-sm" data-dup>${icon("copy")}Duplicate</button>` : ""}
      <div class="spacer"></div>
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" data-submit>${esc(submitLabel)}</button>`,
    onMount(c) {
      const root = c.modal;
      const formEl = root.querySelector("[data-form]");

      // Map each field to its wrapper element so showIf can toggle it
      const wrapperFor = f => {
        const sel = `[data-key="${f.key}"],[data-chips="${f.key}"],[data-multi="${f.key}"],[data-duration="${f.key}"],[data-color="${f.key}"],[data-rating="${f.key}"],[data-checklist="${f.key}"]`;
        const inner = f.key ? formEl.querySelector(sel) : null;
        if (!inner) return null;
        let n = inner;
        while (n && n.parentElement !== formEl && !n.parentElement.hasAttribute("data-adv-body")) n = n.parentElement;
        return n;
      };
      flat.forEach(f => { if (f.showIf) f._el = wrapperFor(f); });
      const refreshShowIf = () => {
        flat.forEach(f => { if (f.showIf && f._el) f._el.style.display = f.showIf(vals) ? "" : "none"; });
      };
      formEl.addEventListener("input", refreshShowIf);
      formEl.addEventListener("change", refreshShowIf);
      formEl.addEventListener("click", () => setTimeout(refreshShowIf, 0));

      // basic inputs
      $$("[data-key]", root).forEach(inp => {
        const key = inp.dataset.key;
        const read = () => {
          if (inp.type === "checkbox") return inp.checked;
          if (inp.hasAttribute("data-tags")) return inp.value.split(",").map(s => s.trim()).filter(Boolean);
          if (inp.type === "number") return inp.value === "" ? "" : Number(inp.value);
          return inp.value;
        };
        inp.addEventListener("input", () => { vals[key] = read(); });
        inp.addEventListener("change", () => { vals[key] = read(); });
      });
      // chips (single)
      $$("[data-chips]", root).forEach(g => {
        const key = g.dataset.chips;
        g.addEventListener("click", e => {
          const b = e.target.closest("[data-val]"); if (!b) return;
          $$(".opt", g).forEach(x => x.classList.remove("is-on"));
          b.classList.add("is-on");
          vals[key] = b.dataset.val;
          const fdef = flat.find(f => f.key === key);
          fdef && fdef.onChange && fdef.onChange(vals[key], root, vals);
        });
      });
      // multi
      $$("[data-multi]", root).forEach(g => {
        const key = g.dataset.multi;
        g.addEventListener("click", e => {
          const b = e.target.closest("[data-val]"); if (!b) return;
          const cur = new Set(Array.isArray(vals[key]) ? vals[key] : []);
          cur.has(b.dataset.val) ? cur.delete(b.dataset.val) : cur.add(b.dataset.val);
          vals[key] = [...cur];
          b.classList.toggle("is-on");
        });
      });
      // duration
      $$("[data-duration]", root).forEach(g => {
        const key = g.dataset.duration;
        const custom = root.querySelector(`[data-duration-custom="${key}"]`);
        g.addEventListener("click", e => {
          const b = e.target.closest("[data-val]"); if (!b) return;
          $$(".opt", g).forEach(x => x.classList.remove("is-on"));
          b.classList.add("is-on");
          const val = b.dataset.val;
          if (val === "custom") { custom.style.display = ""; custom.focus(); vals[key] = Number(custom.value) || 30; }
          else if (val === "none") { custom.style.display = "none"; vals[key] = null; }
          else { custom.style.display = "none"; vals[key] = Number(val); }
        });
        custom && custom.addEventListener("input", () => { vals[key] = Number(custom.value) || null; });
      });
      // color
      $$("[data-color]", root).forEach(g => {
        const key = g.dataset.color;
        g.addEventListener("click", e => {
          const b = e.target.closest("[data-val]"); if (!b) return;
          $$(".color-dot", g).forEach(x => x.classList.remove("is-on"));
          b.classList.add("is-on"); vals[key] = b.dataset.val;
        });
      });
      // rating
      $$("[data-rating]", root).forEach(g => {
        const key = g.dataset.rating;
        g.addEventListener("click", e => {
          const b = e.target.closest("[data-val]"); if (!b) return;
          vals[key] = Number(b.dataset.val);
          const n = vals[key];
          $$("[data-val]", g).forEach(x => {
            const i = Number(x.dataset.val);
            if (!i) return;
            x.style.color = i <= n ? "var(--warn)" : "var(--line-strong)";
            x.innerHTML = icon(i <= n ? "star-fill" : "star");
          });
        });
      });
      // checklist
      $$("[data-checklist]", root).forEach(g => {
        const key = g.dataset.checklist;
        const redraw = () => {
          const arr = vals[key] || [];
          g.querySelector(".cl-list").innerHTML = arr.map((it, i) => `
            <div class="cl-item ${it.done ? "done" : ""}">
              <input type="checkbox" data-cl-toggle="${i}" ${it.done ? "checked" : ""} aria-label="Done">
              <span style="flex:1 1 auto">${esc(it.text)}</span>
              <button type="button" class="btn btn-ghost btn-icon btn-sm" data-cl-del="${i}" aria-label="Remove">${icon("x")}</button>
            </div>`).join("");
        };
        const inp = g.querySelector("[data-cl-input]");
        const addIt = () => {
          const t = inp.value.trim(); if (!t) return;
          vals[key] = [...(vals[key] || []), { id: uid("c"), text: t, done: false }];
          inp.value = ""; redraw(); inp.focus();
        };
        g.querySelector("[data-cl-add]").onclick = addIt;
        inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addIt(); } });
        g.addEventListener("click", e => {
          const d = e.target.closest("[data-cl-del]");
          if (d) { vals[key] = (vals[key] || []).filter((_, i) => i !== +d.dataset.clDel); redraw(); }
        });
        g.addEventListener("change", e => {
          const t = e.target.closest("[data-cl-toggle]");
          if (t) { const i = +t.dataset.clToggle; vals[key][i].done = t.checked; redraw(); }
        });
      });
      // advanced
      $$("[data-adv]", root).forEach(b => {
        b.onclick = () => {
          const open = b.getAttribute("aria-expanded") === "true";
          b.setAttribute("aria-expanded", String(!open));
          b.parentElement.querySelector("[data-adv-body]").classList.toggle("is-open", !open);
        };
      });

      const submit = () => {
        const req = flat.filter(f => f.required);
        for (const f of req) {
          const val = vals[f.key];
          if (val === undefined || val === null || String(val).trim() === "") {
            const el = root.querySelector(`[data-key="${f.key}"]`);
            if (el) { el.focus(); el.style.borderColor = "var(--bad)"; }
            toast(`${f.label} is required`, { icon: "alert" });
            return;
          }
        }
        const res = onSubmit(vals, c);
        if (res !== false) c.close();
      };
      root.querySelector("[data-submit]").onclick = submit;
      root.querySelector("[data-form]").addEventListener("keydown", e => {
        if (e.key === "Enter" && e.target.tagName !== "TEXTAREA" && !e.target.hasAttribute("data-cl-input")) { e.preventDefault(); submit(); }
      });
      if (onDelete) root.querySelector("[data-del]").onclick = () => { c.close(); onDelete(); };
      if (onDuplicate) root.querySelector("[data-dup]").onclick = () => { c.close(); onDuplicate(vals); };
      refreshShowIf();
    }
  });
  return ctl;
}

/* ---------- Keeping the user's place across re-renders ----------
   Every save re-renders the current view. Without this, the button you
   just pressed vanishes from under the keyboard and the page jumps. */
function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.id) return `#${el.id.replace(/"/g, '\\"')}`;
  const q = [];
  for (const a of ["data-act", "data-id", "data-key", "data-set", "data-student", "data-date", "data-status", "data-v", "data-k", "data-path", "data-i"]) {
    if (el.hasAttribute(a)) q.push(`[${a}="${el.getAttribute(a).replace(/["\\]/g, "\\$&")}"]`);
  }
  if (!q.length) return null;
  return el.tagName.toLowerCase() + q.join("");
}
function captureFocus(root) {
  const el = document.activeElement;
  if (!el || !root.contains(el)) return null;
  const key = focusKey(el);
  if (!key) return null;
  const cap = { key };
  if (typeof el.selectionStart === "number") { cap.start = el.selectionStart; cap.end = el.selectionEnd; }
  return cap;
}
function restoreFocus(cap, root) {
  if (!cap) return;
  let el = null;
  try { el = root.querySelector(cap.key); } catch (e) { return; }
  if (!el) return;
  el.focus({ preventScroll: true });
  if (cap.start != null && el.setSelectionRange) {
    try { el.setSelectionRange(cap.start, cap.end); } catch (e) {}
  }
}

  }
  $("#tb-title").textContent = title;

  $("#mt-title").textContent = title;
  document.title = `${title} · ${APP.name}`;

  syncNavActive();
  renderScopeSwitch();
  renderNav();

  const routeKey = `${ROUTE.section}/${ROUTE.sub}/${ROUTE.id}`;
  const sameView = routeKey === LAST_ROUTE_KEY;
  const cap = sameView ? captureFocus(view) : null;
  const scrollY = window.scrollY;

  const fn = VIEWS[ROUTE.section] || VIEWS.home;
  view.classList.toggle("page-wide", ROUTE.section === "calendar");
  view.innerHTML = fn(ROUTE);
  afterRender(view);

  if (sameView) {
    window.scrollTo({ top: scrollY });
    restoreFocus(cap, view);
  } else {
    window.scrollTo({ top: 0 });
  }
  LAST_ROUTE_KEY = routeKey;
}

/* ---------- Global search ---------- */
function searchAll(q) {
  const t = q.trim().toLowerCase();
  if (!t) return [];
  const out = [];
  const push = (kind, title, sub, path, ic, run) => out.push({ kind, title, sub, path, icon: ic, run });
  const m = s => String(s || "").toLowerCase().includes(t);

  S.students().forEach(s => m(s.name) && push("Student", s.name, s.grade || "", `students/${s.id}`, "user"));
  DB.state.lessons.forEach(l => (m(l.title) || m(S.subjectName(l.subjectId))) &&
    push("Lesson", l.title, `${fmtDate(l.date, "short")} · ${S.studentName(l.studentId)}`, "", "book-open", () => Forms.lesson(l)));
  DB.state.assignments.forEach(a => m(a.title) &&
    push("Assignment", a.title, `${a.due ? "Due " + fmtDate(a.due, "short") : "No due date"} · ${S.studentName(a.studentId)}`, "", "clipboard", () => Forms.assignment(a)));
  DB.state.subjects.forEach(s => m(s.name) && push("Subject", s.name, "", "academics/subjects", "layers"));
  DB.state.reading.forEach(b => (m(b.title) || m(b.author)) &&
    push("Book", b.title, b.author || "", "", "book", () => Forms.reading(b)));
  DB.state.resources.forEach(r => (m(r.title) || m(r.description) || m((r.tags || []).join(" "))) &&
    push("Resource", r.title, r.type || "", "", "link", () => Forms.resource(r)));
  DB.state.portfolio.forEach(p => (m(p.title) || m(p.description) || m((p.tags || []).join(" "))) &&
    push("Portfolio", p.title, fmtDate(p.date, "short"), "", "image", () => Forms.portfolio(p)));
  DB.state.projects.forEach(p => m(p.title) && push("Project", p.title, S.studentName(p.studentId), "", "puzzle", () => Forms.project(p)));
  DB.state.goals.forEach(g => m(g.title) && push("Goal", g.title, g.scope || "", "", "target", () => Forms.goal(g)));

    push("Journal", fmtDate(j.date, "med"), (j.wentWell || j.next || "").slice(0, 60), "", "note", () => Forms.note(j)));
  DB.state.trips.forEach(x => m(x.title) && push("Field trip", x.title, fmtDate(x.date, "short"), "", "bus", () => Forms.trip(x)));

  DB.state.activities.forEach(a => m(a.name) && push("Activity", a.name, a.category || "", "", "run", () => Forms.activity(a)));

  return out.slice(0, 40);
}

ACT.search = () => {
  let sel = 0, results = [];
  const ctl = openModal({
    title: undefined, closeOnScrim: true, scrimClass: "palette-scrim", className: "palette", size: "",
    body: "",
    onMount(c) {
      c.modal.classList.remove("modal");
      c.modal.classList.add("palette");
      c.modal.innerHTML = `
        <div class="palette-inp">${icon("search")}<input id="pal-inp" placeholder="Search lessons, students, books, resources…" aria-label="Search" autocomplete="off"></div>
        <div class="palette-res" id="pal-res"></div>
        <div class="palette-ft"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>`;
      const inp = $("#pal-inp", c.modal), res = $("#pal-res", c.modal);
      const draw = () => {
        if (!results.length) {
          res.innerHTML = inp.value.trim()
            ? `<div class="empty" style="padding:32px 16px"><div class="ill">${icon("search")}</div><h3>Nothing found</h3><p>Try a different word.</p></div>`
            : `<div style="padding:14px 16px" class="tiny dim">Search across lessons, assignments, students, books, resources, portfolio items, goals, projects and journal entries.</div>`;
          return;
        }
        res.innerHTML = results.map((r, i) => `
          <button class="pres ${i === sel ? "is-sel" : ""}" data-i="${i}">
            <span class="pi">${icon(r.icon)}</span>
            <span style="min-width:0"><span class="pt ellip">${esc(r.title)}</span><span class="ps ellip">${esc(r.sub)}</span></span>
            <span class="pk">${esc(r.kind)}</span>
          </button>`).join("");
        $$("[data-i]", res).forEach(b => b.onclick = () => pick(+b.dataset.i));
      };
      const pick = i => {
        const r = results[i]; if (!r) return;
        c.close();
        if (r.run) r.run(); else if (r.path) go(r.path);
      };
      inp.addEventListener("input", () => { results = searchAll(inp.value); sel = 0; draw(); });
      inp.addEventListener("keydown", e => {
        if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, results.length - 1); draw(); $$(".pres", res)[sel] && $$(".pres", res)[sel].scrollIntoView({ block: "nearest" }); }
        else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); draw(); $$(".pres", res)[sel] && $$(".pres", res)[sel].scrollIntoView({ block: "nearest" }); }
        else if (e.key === "Enter") { e.preventDefault(); pick(sel); }
      });
      draw();
      setTimeout(() => inp.focus(), 40);
    }
  });
  return ctl;
};

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); ACT.search(); return; }
  if (typing || ModalStack.length) return;
  if (e.key === "/") { e.preventDefault(); ACT.search(); }
  else if (e.key === "n" || e.key === "N") { e.preventDefault(); ACT.quickadd(); }
  else if (e.key === "t" || e.key === "T") { go("today"); }
  else if (e.key === "h" || e.key === "H") { go("home"); }
  else if (e.key === "c" || e.key === "C") { go("calendar"); }
  else if (e.key === "?") { showShortcuts(); }
});
function showShortcuts() {
  openModal({
    title: "Keyboard shortcuts", size: "modal-sm",
    body: `<div class="list">
      ${[["⌘ / Ctrl + K", "Search anything"], ["N", "Quick add"], ["T", "Today"], ["H", "Home"], ["C", "Calendar"], ["?", "This list"], ["Esc", "Close dialog"]]
        .map(([k, v]) => `<div class="list-row" style="padding:8px 0"><span class="lr-main">${esc(v)}</span><kbd>${esc(k)}</kbd></div>`).join("")}
    </div>`
  });
}

function saveEntity(coll, existing, vals, label) {
  if (existing && existing.id) { DB.update(coll, existing.id, vals); toast(`${label} updated`, { icon: "check" }); }
  else { DB.add(coll, vals); toast(`${label} added`, { icon: "check" }); }
}
function delEntity(coll, row, label, extra) {
  confirmDialog({
    title: `Delete this ${label.toLowerCase()}?`,
    body: extra || "You can undo this straight away if it was a mistake.",
    danger: true, confirmLabel: "Delete",
    onConfirm() {
      DB.remove(coll, row.id);
      toast(`${label} deleted`, { action: "Undo", onAction: () => { DB.restore(coll, row); toast(`${label} restored`); } , ms: 6000 });
    }
  });
}
function dupEntity(coll, vals, label) {
  const row = Object.assign({}, vals);
  ["id", "createdAt", "updatedAt", "recurId", "completedAt"].forEach(k => delete row[k]);
  DB.add(coll, row);
  toast(`${label} duplicated`, { icon: "copy" });
}
const STUDENT_LINKED = ["lessons", "assignments", "curricula", "grades", "goals", "attendance",
  "reading", "portfolio", "journal", "activities", "projects", "expenses", "resources"];

function studentRecordCount(id) {
  return STUDENT_LINKED.reduce((n, c) => n + DB.state[c].filter(r => r.studentId === id).length, 0);
}

/* Removing a child is the one genuinely destructive action here, so it
   asks what you actually mean rather than assuming. */
function removeStudent(row) {
  const n = studentRecordCount(row.id);
  const choices = [];
  if (!row.archived) choices.push({
    label: "Archive — hide them, keep every record", icon: "archive",
    run() {
      DB.update("students", row.id, { archived: true });
      if (DB.state.ui.scope === row.id) DB.state.ui.scope = "all";
      toast(`${row.name} archived`, { action: "Undo", onAction: () => DB.update("students", row.id, { archived: false }), ms: 6000 });
    }
  });
  choices.push({
    label: `Delete ${row.name} and their ${plural(n, "record")}`, icon: "trash", danger: true,
    run() {
      confirmDialog({
        title: `Delete ${row.name} permanently?`, danger: true, confirmLabel: "Delete everything",
        body: `This removes ${plural(n, "record")} — lessons, grades, attendance, books, work samples and notes. It cannot be undone. Export a backup first if you might want them back.`,
        onConfirm() { deleteStudentCascade(row); }
      });
    }
  });
  choiceDialog({
    title: `Remove ${row.name}?`,
    body: `They have ${plural(n, "record")} in the planner. Archiving keeps everything and simply takes them out of the way.`,
    choices,
  });
}

function deleteStudentCascade(row) {
  const id = row.id;
  DB.state.portfolio.filter(p => p.studentId === id).forEach(p => (p.files || []).forEach(f => Blobs.del(f.id)));
  if (row.photo) Blobs.del(row.photo);
  STUDENT_LINKED.forEach(c => { DB.state[c] = DB.state[c].filter(r => r.studentId !== id); });
  // Shared records: drop the child, and drop the record if nobody is left on it
  ["trips", "events"].forEach(c => {
    DB.state[c] = DB.state[c].filter(r => {
      if (!Array.isArray(r.studentIds) || !r.studentIds.includes(id)) return true;
      r.studentIds = r.studentIds.filter(x => x !== id);
      return r.studentIds.length > 0;
    });
  });
  DB.state.subjects.forEach(s => {
    if (Array.isArray(s.studentIds)) s.studentIds = s.studentIds.filter(x => x !== id);
  });
  DB.state.students = DB.state.students.filter(s => s.id !== id);
  if (DB.state.ui.scope === id) DB.state.ui.scope = "all";
  DB.touch();
  go("students");
  toast(`${row.name} and their records were deleted`, { icon: "check", ms: 5000 });
}

const SUBJECT_LINKED = ["lessons", "assignments", "curricula", "grades", "goals", "portfolio", "projects", "resources", "trips"];

function deleteSubject(row) {
  const linked = SUBJECT_LINKED.reduce((n, c) => n + DB.state[c].filter(r => r.subjectId === row.id).length, 0);
  confirmDialog({
    title: `Delete ${row.name}?`, danger: true, confirmLabel: "Delete subject",
    body: linked
      ? `${plural(linked, "record")} use this subject. They'll be kept and simply lose the subject label — nothing is lost.`
      : "Nothing is using this subject yet.",
    onConfirm() {
      const touched = [];
      SUBJECT_LINKED.forEach(c => DB.state[c].forEach(r => {
        if (r.subjectId === row.id) { touched.push([c, r.id]); r.subjectId = ""; }
      }));
      DB.remove("subjects", row.id);
      toast("Subject deleted", {
        action: "Undo", ms: 7000,
        onAction() {
          DB.state.subjects.push(row);
          touched.forEach(([c, id]) => { const r = DB.get(c, id); if (r) r.subjectId = row.id; });
          DB.touch();
          toast("Subject restored");
        }
      });
    }
  });
}

  openForm({

      { type: "duration", key: "duration", label: "How long?" },

        ]},

        { type: "date", key: "repeatUntil", label: "Repeat until", half: true, showIf: v => v.repeat !== "none" },
        { type: "toggle", key: "skipBreaks", label: "Skip holidays and breaks", showIf: v => v.repeat !== "none" },
      ] : [F.status()]),
      { type: "advanced", fields: [
        { type: "select", key: "curriculumId", label: "Part of curriculum", placeholder: "None", half: true,
          options: () => DB.state.curricula.map(c => ({ value: c.id, label: c.name })) },
        { type: "textarea", key: "notes", label: "Lesson notes & materials", rows: 3, placeholder: "Pages, materials, links, what to prepare…" },
      ]},
    ],
    submitLabel: isNew ? "Add lesson" : "Save changes",
    onDelete: row ? () => deleteLesson(row) : null,
    onDuplicate: row ? v => dupEntity("lessons", Object.assign({}, v, { status: "planned" }), "Lesson") : null,
    onSubmit(v) {
      const base = {
        title: v.title, studentId: v.studentId, subjectId: v.subjectId, date: v.date, time: v.time,
        duration: v.duration === "" ? null : v.duration, notes: v.notes, curriculumId: v.curriculumId,
        status: v.status || "planned",
      };
      if (!isNew) {
        const siblings = row.recurId ? DB.state.lessons.filter(l => l.recurId === row.recurId && l.date > row.date) : [];
        if (siblings.length) {
          choiceDialog({
            title: "Save this repeating lesson",
            body: `This lesson repeats ${siblings.length} more time${siblings.length === 1 ? "" : "s"}. What should change?`,
            choices: [
              { label: "This occurrence only", icon: "check", run() { DB.update("lessons", row.id, base); toast("Lesson updated", { icon: "check" }); } },
              { label: `This and ${siblings.length} future lesson${siblings.length === 1 ? "" : "s"}`, icon: "repeat", run() {
                const patch = Object.assign({}, base); delete patch.date; delete patch.status;
                DB.update("lessons", row.id, base);
                siblings.forEach(l => Object.assign(l, patch));
                DB.touch();
                toast(`${siblings.length + 1} lessons updated`, { icon: "check" });
              } },
            ]
          });
          return;
        }
        DB.update("lessons", row.id, base); toast("Lesson updated", { icon: "check" }); return;
      }
      if (v.repeat && v.repeat !== "none") {
        const days = v.repeat === "daily" ? DB.state.schoolYear.schoolDays : (v.repeatDays || []).map(Number);
        if (v.repeat !== "daily" && !days.length) { toast("Pick at least one day to repeat on", { icon: "alert" }); return false; }
        const { rows } = buildRecurrence(
          { type: v.repeat, days, interval: 2, start: v.date, end: v.repeatUntil, skipBreaks: v.skipBreaks },
          base
        );
        if (!rows.length) { toast("That repeat pattern produced no lessons", { icon: "alert" }); return false; }
        rows.forEach(r => DB.state.lessons.push(Object.assign({ id: uid("l"), createdAt: Date.now() }, r)));
        DB.touch();
        toast(`${rows.length} lessons added`, { icon: "check" });
      } else {
        DB.add("lessons", base);
        toast("Lesson added", { icon: "check" });
      }
    }
  });
};

function deleteLesson(row) {
  const siblings = row.recurId ? DB.state.lessons.filter(l => l.recurId === row.recurId && l.date >= row.date) : [];
  if (siblings.length > 1) {
    choiceDialog({
      title: "Delete repeating lesson", body: `“${esc(row.title)}” repeats. What would you like to remove?`,
      choices: [
        { label: "Just this one", icon: "trash", run() { const r = DB.remove("lessons", row.id); toast("Lesson deleted", { action: "Undo", onAction: () => DB.restore("lessons", r), ms: 6000 }); } },
        { label: `This and ${siblings.length - 1} future lesson${siblings.length - 1 === 1 ? "" : "s"}`, icon: "repeat", danger: true, run() {
          const removed = siblings.slice();
          DB.state.lessons = DB.state.lessons.filter(l => !(l.recurId === row.recurId && l.date >= row.date));
          DB.touch();
          toast(`${removed.length} lessons deleted`, { action: "Undo", onAction: () => { removed.forEach(r => DB.state.lessons.push(r)); DB.touch(); }, ms: 7000 });
        } },
      ]
    });
  } else {
    delEntity("lessons", row, "Lesson");
  }
}

Forms.portfolio = (row) => {
  let pendingFiles = [];
  const ctl = openForm({
    title: row ? "Edit work sample" : "Add work sample",
    values: Object.assign({ date: todayISO(), studentId: defaultStudent(), tags: [], files: [] }, row || {}),
    fields: [
      { type: "text", key: "title", label: "Title", required: true, autofocus: true, placeholder: "e.g. Watercolour of the pond" },
      F.student(), F.subject(),
      F.date("date", "Date"),
      { type: "static", html: `<div class="field"><label>Attachments</label>
        <div class="row row-wrap"><button type="button" class="btn btn-sm" data-file-pick>${icon("paperclip")}Add photos or files</button>
        <span class="tiny dim" data-file-note>Images are resized to keep your planner fast.</span></div>
        <div id="file-list" class="row row-wrap" style="margin-top:8px"></div></div>` },
      { type: "textarea", key: "description", label: "Description", rows: 2 },
      { type: "tags", key: "tags", label: "Tags", placeholder: "e.g. writing, grade 4, best work" },
    ],
    submitLabel: row ? "Save changes" : "Add to portfolio",
    onDelete: row ? () => {
      confirmDialog({
        title: "Delete this work sample?", danger: true, confirmLabel: "Delete",
        body: "The attached files will be removed from this device too.",
        onConfirm() { (row.files || []).forEach(f => Blobs.del(f.id)); DB.remove("portfolio", row.id); toast("Work sample deleted"); }
      });
    } : null,
    onSubmit(v) {
      const files = [...(v.files || []), ...pendingFiles];
      saveEntity("portfolio", row, Object.assign({}, v, { files }), "Work sample");
    }
  });
  // file handling
  const list = $("#file-list", ctl.modal);
  const drawFiles = () => {
    const all = [...((row && row.files) || []), ...pendingFiles];
    list.innerHTML = all.map(f => {
      const th = Blobs.thumb(f.id);
      return `<span class="chip">${th ? `<img src="${th}" alt="" style="width:20px;height:20px;border-radius:4px;object-fit:cover">` : icon("paperclip")}${esc(f.name)}</span>`;
    }).join("");
  };
  drawFiles();
  $("[data-file-pick]", ctl.modal).onclick = () => {
    pickFile("image/*,.pdf,.doc,.docx,.txt", async files => {
      for (const file of files) {
        const isImg = /^image\//.test(file.type);
        const data = isImg ? await compressImage(file, 1600, 0.82) : await readFileDataURL(file);
        const id = uid("f");
        await Blobs.put(id, data, isImg ? (await makeThumb(data)) : null);
        pendingFiles.push({ id, name: file.name, type: file.type || "file" });
      }
      drawFiles();
      toast(`${plural(files.length, "file")} attached`, { icon: "check" });
    }, true);
  };
};

function greeting() {
  const h = new Date().getHours();
  if (h < 5) return "Good night";
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}

function backupBanner() {
  if (!S.needsBackup()) return "";
  const d = S.daysSinceBackup();
  return `<div class="callout warn no-print" style="margin-bottom:var(--s5)">
    ${icon("shield")}
    <div style="flex:1 1 auto">
      <strong>${d === null ? "You haven't backed up yet." : `Last backup: ${plural(d, "day")} ago.`}</strong>
      <div class="tiny" style="margin-top:2px">Your homeschool records live on this device only. A backup takes two seconds.</div>
    </div>
    <button class="btn btn-sm" data-act="backup-now">${icon("download")}Back up now</button>
  </div>`;
}

VIEWS.home = () => {
  const t = todayISO();
  const studs = S.scopeStudents();
  if (!DB.state.students.length) return welcomeView();

  const lessons = sortBy(S.lessonsOn(t), "time", "createdAt");
  const done = lessons.filter(l => l.status === "complete").length;
  const remaining = lessons.filter(l => l.status === "planned" || l.status === "progress");
  const overdue = S.overdue();
  const dueToday = S.dueToday();
  const weekStart = iso(startOfWeek(t, DB.state.settings.weekStart));
  const weekEnd = addDaysISO(weekStart, 6);
  const weekLessons = S.lessonsBetween(weekStart, weekEnd);
  const weekDone = weekLessons.filter(l => l.status === "complete").length;

  const summaryBits = [];
  if (lessons.length) summaryBits.push(`${remaining.length ? `${plural(remaining.length, "lesson")} left today` : "every lesson is done today"}`);
  else summaryBits.push(S.isSchoolDay(t) ? "nothing scheduled today yet" : (S.breakOn(t) ? `${S.breakOn(t).name} — enjoy the break` : "no school scheduled today"));
  if (dueToday.length) summaryBits.push(`${plural(dueToday.length, "assignment")} due`);
  if (overdue.length) summaryBits.push(`${overdue.length} overdue`);

      <button class="qa a2" data-act="add-assignment"><span class="ic">${icon("clipboard")}</span>Add assignment</button>

          ${lessons.length > 5 ? `<div class="card-ft tiny dim">+ ${lessons.length - 5} more today</div>` : ""}`
      : emptyState("sun", S.isSchoolDay(t) ? "Nothing planned today" : "A day off", S.isSchoolDay(t) ? "Add your first lesson and it will appear here." : "No school day scheduled — enjoy it.", "Add lesson", 'data-act="add-lesson"')}

      : emptyState("calendar", "Nothing on the horizon", "Assignments, field trips and events in the next two weeks will show up here.")}
    </div>
  `;
};

function upcomingItems(days) {
  const t = todayISO(), end = addDaysISO(t, days);
  const out = [];
  S.assignmentsOpen().forEach(a => {
    if (!a.due || a.due < t || a.due > end) return;
    out.push({ date: a.due, title: a.title, sub: `${S.studentName(a.studentId)} · ${S.subjectName(a.subjectId)}`, color: S.subjectColor(a.subjectId), act: `data-act="edit-assignment" data-id="${a.id}"` });
  });
  S.overdue().forEach(a => out.push({
    date: a.due, title: a.title, sub: `Overdue · ${S.studentName(a.studentId)}`, color: "var(--bad)",
    chipCls: "bad", act: `data-act="edit-assignment" data-id="${a.id}"`
  }));
  DB.state.trips.forEach(x => {
    if (x.date < t || x.date > end) return;
    if (S.scope() !== "all" && x.studentIds && x.studentIds.length && !x.studentIds.includes(S.scope())) return;
    out.push({ date: x.date, title: x.title, sub: "Field trip", color: "var(--info)", act: `data-act="edit-trip" data-id="${x.id}"` });
  });
  DB.state.events.forEach(e => {
    if (e.date < t || e.date > end) return;
    if (S.scope() !== "all" && e.studentIds && e.studentIds.length && !e.studentIds.includes(S.scope())) return;
    out.push({ date: e.date, title: e.title, sub: e.time ? fmtTime(e.time) : (e.type || "Event"), color: "var(--accent)", act: `data-act="edit-event" data-id="${e.id}"` });
  });
  DB.state.goals.forEach(g => {
    if (!g.due || g.due < t || g.due > end) return;
    if (!S.inScope(g.studentId)) return;
    out.push({ date: g.due, title: g.title, sub: "Goal target date", color: "var(--warm)", act: `data-act="edit-goal" data-id="${g.id}"` });
  });
  return sortBy(out, "date");
}

function lessonRow(l, opts = {}) {
  const s = S.student(l.studentId);
  const isDone = l.status === "complete";
  const cls = isDone ? "is-done" : l.status === "skipped" ? "is-skipped" : "";
  return `<div class="lrow ${cls}" data-lesson="${l.id}">
    <button class="done-btn ${isDone ? "is-on" : ""}" data-act="lesson-done" data-id="${l.id}"
      aria-pressed="${isDone}" aria-label="${isDone ? "Mark not complete" : "Mark complete"}: ${attr(l.title)}">${icon("check")}</button>
    <div class="l-time">${l.time ? esc(fmtTime(l.time)) : `<span class="dim">—</span>`}${l.duration ? `<small>${esc(fmtDuration(l.duration))}</small>` : ""}</div>
    <div class="l-main" data-act="edit-lesson" data-id="${l.id}" style="cursor:pointer">
      <div class="l-title">${esc(l.title)}</div>
      <div class="l-meta">
        ${subjectChip(l.subjectId)}
        ${opts.compact && s ? `<span>${esc(s.name)}</span>` : ""}
        ${l.recurId ? `<span title="Repeats">${icon("repeat")}</span>` : ""}
        ${l.notes ? `<span title="Has notes">${icon("note")}</span>` : ""}
        ${l.status !== "planned" && l.status !== "complete" ? statusChip(l.status) : ""}

      <button class="btn btn-ghost btn-icon btn-sm" data-act="lesson-menu" data-id="${l.id}" aria-label="More actions">${icon("more-v")}</button>

function assignmentRow(a) {
  const isDone = a.status === "done";
  const over = a.due && a.due < todayISO() && !isDone && a.status !== "skipped";
  return `<div class="list-row ${isDone ? "done" : ""}">
    <button class="done-btn ${isDone ? "is-on" : ""}" data-act="assign-done" data-id="${a.id}" aria-pressed="${isDone}" aria-label="Mark complete: ${attr(a.title)}">${icon("check")}</button>
    <div class="lr-main" data-act="edit-assignment" data-id="${a.id}" style="cursor:pointer">
      <div class="lr-title">${esc(a.title)}</div>
      <div class="lr-sub">${esc(S.studentName(a.studentId))} · ${esc(S.subjectName(a.subjectId))}${a.due ? ` · ${over ? "Overdue " : "Due "}${fmtDate(a.due, "short")}` : ""}</div>
    </div>
    ${a.priority === "high" ? `<span class="chip warn">High</span>` : ""}
    ${over ? `<span class="chip bad">Overdue</span>` : ""}

}

/* ---------- Today actions ---------- */
ACT["today-shift"] = (el, d) => {
  const n = Number(d.n);
  TODAY_DATE = n === 0 ? todayISO() : addDaysISO(TODAY_DATE, n);
  scheduleRender();
};
ACT["lesson-done"] = (el, d) => {
  const l = DB.get("lessons", d.id);
  if (!l) return;
  const next = l.status === "complete" ? "planned" : "complete";
  DB.update("lessons", l.id, { status: next, completedAt: next === "complete" ? Date.now() : null });
  if (next === "complete") {
    const day = S.lessonsOn(l.date);
    if (day.length && day.every(x => x.status === "complete")) {
      toast("That's the whole day done — nice work.", { icon: "sparkle", ms: 4200 });
    }
  }
};
ACT["assign-done"] = (el, d) => {
  const a = DB.get("assignments", d.id);
  if (!a) return;
  DB.update("assignments", a.id, { status: a.status === "done" ? "todo" : "done" });
};
ACT["lesson-menu"] = (el, d) => {
  const l = DB.get("lessons", d.id);
  if (!l) return;
  contextMenu(el, [
    { label: "Edit", icon: "edit", run: () => Forms.lesson(l) },
    { label: "Duplicate", icon: "copy", run: () => dupEntity("lessons", Object.assign({}, l, { status: "planned", completedAt: null }), "Lesson") },
    { label: "Move to tomorrow", icon: "arrow-r", run: () => {
      const was = l.date;
      DB.update("lessons", l.id, { date: addDaysISO(was, 1) });
      toast("Moved to tomorrow", { action: "Undo", onAction: () => DB.update("lessons", l.id, { date: was }) });
    } },
    { sep: true },
    { label: "Status", header: true },
    ...LESSON_STATUS.map(s => ({ label: (l.status === s.id ? "✓ " : "") + s.label, run: () => DB.update("lessons", l.id, { status: s.id }) })),
    { sep: true },
    { label: "Delete", icon: "trash", danger: true, run: () => deleteLesson(l) },
  ]);
};
ACT["att-set"] = (el, d) => {
  const existing = S.attendanceFor(d.student, d.date);
  if (existing && existing.status === d.status) { DB.remove("attendance", existing.id); return; }
  if (existing) DB.update("attendance", existing.id, { status: d.status });
  else DB.add("attendance", { studentId: d.student, date: d.date, status: d.status, hours: DB.state.settings.hoursPerDay });
};
ACT["att-all"] = (el, d) => {
  let n = 0;
  S.scopeStudents().forEach(s => {
    if (!S.attendanceFor(s.id, d.date)) { DB.state.attendance.push({ id: uid("a"), studentId: s.id, date: d.date, status: "present", hours: DB.state.settings.hoursPerDay }); n++; }
  });
  DB.touch();
  toast(n ? `${plural(n, "student")} marked present` : "Everyone was already logged", { icon: "check" });
};
ACT["complete-all"] = (el, d) => {
  const rows = S.lessonsOn(d.date).filter(l => l.status !== "complete");
  if (!rows.length) { toast("Everything is already complete"); return; }
  const before = rows.map(r => ({ id: r.id, status: r.status }));
  rows.forEach(r => { r.status = "complete"; r.completedAt = Date.now(); });
  DB.touch();
  toast(`${plural(rows.length, "lesson")} marked complete`, { action: "Undo", onAction: () => { before.forEach(b => { const l = DB.get("lessons", b.id); if (l) l.status = b.status; }); DB.touch(); }, ms: 6000 });
};
ACT["copy-day"] = (el, d) => {
  const from = addDaysISO(d.date, -1);
  const rows = S.lessonsOn(from, "all");
  if (!rows.length) { toast(`No lessons on ${fmtDate(from, "short")} to copy`, { icon: "info" }); return; }
  confirmDialog({
    title: `Copy ${plural(rows.length, "lesson")}?`,
    body: `This will copy every lesson from ${fmtDate(from, "long")} to ${fmtDate(d.date, "long")}.`,
    confirmLabel: "Copy them",
    onConfirm() {
      const added = [];
      rows.forEach(r => {
        const row = Object.assign({}, r, { id: uid("l"), date: d.date, status: "planned", recurId: null, completedAt: null, createdAt: Date.now() });
        DB.state.lessons.push(row); added.push(row.id);
      });
      DB.touch();
      toast(`${plural(added.length, "lesson")} copied`, { action: "Undo", onAction: () => { DB.state.lessons = DB.state.lessons.filter(l => !added.includes(l.id)); DB.touch(); }, ms: 6000 });
    }
  });
};

/* ============================================================
   Calendar / Lesson planner — day, week, month, agenda
   ============================================================ */
const CAL = { view: "week", anchor: todayISO() };

function calItemsOn(dateISO) {
  const out = [];
  S.lessonsOn(dateISO).forEach(l => out.push({
    kind: "lesson", id: l.id, title: l.title, time: l.time || "",
    color: S.subjectColor(l.subjectId),
    meta: [l.time ? fmtTime(l.time) : "", S.scope() === "all" ? S.studentName(l.studentId).split(" ")[0] : S.subjectName(l.subjectId), fmtDuration(l.duration)].filter(Boolean).join(" · "),
    done: l.status === "complete", skipped: l.status === "skipped", drag: true,
  }));
  DB.state.assignments.forEach(a => {
    if (a.due !== dateISO || !S.inScope(a.studentId)) return;
    out.push({ kind: "assignment", id: a.id, title: a.title, time: "zz1", color: "var(--warm)",
      meta: `Due · ${S.studentName(a.studentId).split(" ")[0]}`, done: a.status === "done" });
  });
  S.eventsOn(dateISO).forEach(e => out.push({
    kind: e._trip ? "trip" : "event", id: e.id, title: e.title, time: e.time || "zz2",
    color: e._trip ? "var(--info)" : "var(--accent)",
    meta: e._trip ? "Field trip" : (e.time ? fmtTime(e.time) : (e.location || "Event")),
  }));
  return sortBy(out, "time");
}

function evHTML(it) {
  return `<div class="ev ${it.done ? "is-done" : ""}" style="--c:${it.color}"
    ${it.drag ? `draggable="true" data-drag-lesson="${it.id}"` : ""}
    data-act="cal-open" data-kind="${it.kind}" data-id="${it.id}" role="button" tabindex="0">
    <div class="ev-t">${esc(it.title)}</div>
    ${it.meta ? `<div class="ev-m">${esc(it.meta)}</div>` : ""}
  </div>`;
}

VIEWS.calendar = () => {
  const v = CAL.view;
  const head = `
    <div class="cal-toolbar no-print">
      <div class="cal-nav">
        <button class="btn btn-icon" data-act="cal-shift" data-n="-1" aria-label="Previous">${icon("chev-l")}</button>
        <button class="btn" data-act="cal-shift" data-n="0">Today</button>
        <button class="btn btn-icon" data-act="cal-shift" data-n="1" aria-label="Next">${icon("chev-r")}</button>
      </div>
      <div class="cal-title">${esc(calTitle())}</div>
      <div class="spacer"></div>
      <div class="seg" role="tablist">
        ${["day", "week", "month", "agenda"].map(x => `<button role="tab" aria-selected="${v === x}" class="${v === x ? "is-active" : ""}" data-act="cal-view" data-v="${x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join("")}
      </div>
      <button class="btn btn-primary" data-act="add-lesson">${icon("plus")}Lesson</button>
    </div>`;

  let bodyHTML = "";
  if (v === "week") bodyHTML = weekHTML();
  else if (v === "month") bodyHTML = monthHTML();
  else if (v === "agenda") bodyHTML = agendaHTML();
  else bodyHTML = dayHTML();

  return head + bodyHTML + `
    <div class="row row-wrap tiny dim no-print" style="margin-top:var(--s4);gap:var(--s4)">
      <span class="row" style="gap:6px"><span class="chip-dot" style="background:var(--brand)"></span>Lessons use their subject colour</span>
      <span class="row" style="gap:6px"><span class="chip-dot" style="background:var(--warm)"></span>Assignment due</span>
      <span class="row" style="gap:6px"><span class="chip-dot" style="background:var(--accent)"></span>Event</span>
      <span class="row" style="gap:6px"><span class="chip-dot" style="background:var(--info)"></span>Field trip</span>
      <span>·  Drag a lesson to another day to reschedule.</span>
    </div>`;
};

function calTitle() {
  const a = parseISO(CAL.anchor);
  if (CAL.view === "day") return fmtDate(CAL.anchor, "long");
  if (CAL.view === "month") return `${MON_LONG[a.getMonth()]} ${a.getFullYear()}`;
  if (CAL.view === "agenda") return "Next 30 days";
  const s = startOfWeek(CAL.anchor, DB.state.settings.weekStart);
  const e = addDays(s, 6);
  const sameMonth = s.getMonth() === e.getMonth();
  return `${MON_SHORT[s.getMonth()]} ${s.getDate()} – ${sameMonth ? "" : MON_SHORT[e.getMonth()] + " "}${e.getDate()}, ${e.getFullYear()}`;
}

function weekHTML() {
  const start = startOfWeek(CAL.anchor, DB.state.settings.weekStart);
  const t = todayISO();
  const cols = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i), dISO = iso(d);
    const items = calItemsOn(dISO);
    const off = !S.isSchoolDay(dISO);
    const brk = S.breakOn(dISO);
    cols.push(`<div class="week-col ${off ? "is-off" : ""} ${dISO === t ? "is-today" : ""}" data-day="${dISO}">
      <div class="wk-hd">
        <div class="dow">${DOW_SHORT[d.getDay()]}</div>
        <div class="dnum">${d.getDate()}</div>
        ${brk ? `<div class="off-tag">${esc(brk.name)}</div>` : ""}
      </div>
      <div class="wk-body">
        ${items.map(evHTML).join("")}
        <button class="wk-add" data-act="add-lesson" data-date="${dISO}" aria-label="Add lesson on ${fmtDate(dISO, "med")}">+ Add</button>
      </div>
    </div>`);
  }
  return `<div class="week">${cols.join("")}</div>`;
}

function monthHTML() {
  const a = parseISO(CAL.anchor);
  const first = new Date(a.getFullYear(), a.getMonth(), 1);
  const start = startOfWeek(first, DB.state.settings.weekStart);
  const t = todayISO();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), dISO = iso(d);
    const items = calItemsOn(dISO);
    const out = d.getMonth() !== a.getMonth();
    const off = !S.isSchoolDay(dISO);
    cells.push(`<div class="mo-cell ${out ? "is-out" : ""} ${off ? "is-off" : ""} ${dISO === t ? "is-today" : ""}" data-act="cal-day" data-date="${dISO}">
      <div class="mo-n">${d.getDate()}</div>
      ${items.slice(0, 3).map(it => `<div class="mo-ev" style="--c:${it.color}" title="${attr(it.title)}">${esc(it.title)}</div>`).join("")}
      ${items.length > 3 ? `<div class="mo-more">+${items.length - 3} more</div>` : ""}
    </div>`);
  }
  const dows = [];
  for (let i = 0; i < 7; i++) dows.push(`<div class="mo-dow">${DOW_SHORT[(i + DB.state.settings.weekStart) % 7]}</div>`);
  return `<div class="month">${dows.join("")}${cells.join("")}</div>`;
}

function agendaHTML() {
  const start = todayISO();
  const days = [];
  for (let i = 0; i < 30; i++) {
    const dISO = addDaysISO(start, i);
    const items = calItemsOn(dISO);
    if (!items.length) continue;
    days.push(`<div class="agenda-day">
      <div class="ag-date ${dISO === start ? "is-today" : ""}">
        <div class="d">${parseISO(dISO).getDate()}</div>
        <div class="w">${DOW_SHORT[parseISO(dISO).getDay()]} ${MON_SHORT[parseISO(dISO).getMonth()]}</div>
      </div>
      <div class="ag-items">${items.map(evHTML).join("")}</div>
    </div>`);
  }
  return `<div class="card"><div class="card-bd">${days.length ? days.join("") :
    emptyState("calendar", "Nothing scheduled in the next 30 days", "Add lessons, assignments or events and they'll appear here in order.", "Add lesson", 'data-act="add-lesson"')}</div></div>`;
}

function dayHTML() {
  const dISO = CAL.anchor;
  const items = calItemsOn(dISO);
  const brk = S.breakOn(dISO);
  return `<div class="card">
    <div class="card-hd"><h3>${esc(fmtDate(dISO, "long"))}</h3>
      ${brk ? `<span class="chip info">${esc(brk.name)}</span>` : ""}
      <div class="hd-actions"><button class="btn btn-sm" data-act="add-lesson" data-date="${dISO}">${icon("plus")}Lesson</button></div>
    </div>
    ${items.length ? `<div class="card-bd col" style="gap:8px">${items.map(evHTML).join("")}</div>`
      : emptyState("sun", "Nothing on this day", "A clear day. Add something if you'd like to plan ahead.", "Add lesson", `data-act="add-lesson" data-date="${dISO}"`)}
  </div>`;
}

/* ---------- Calendar actions ---------- */
ACT["cal-view"] = (el, d) => { CAL.view = d.v; scheduleRender(); };
ACT["cal-shift"] = (el, d) => {
  const n = Number(d.n);
  if (n === 0) { CAL.anchor = todayISO(); }
  else if (CAL.view === "day") CAL.anchor = addDaysISO(CAL.anchor, n);
  else if (CAL.view === "week") CAL.anchor = addDaysISO(CAL.anchor, n * 7);
  else if (CAL.view === "month") CAL.anchor = iso(addMonths(parseISO(CAL.anchor), n));
  scheduleRender();
};
ACT["cal-day"] = (el, d) => { CAL.anchor = d.date; CAL.view = "day"; scheduleRender(); };
ACT["cal-open"] = (el, d) => {
  if (d.kind === "lesson") Forms.lesson(DB.get("lessons", d.id));
  else if (d.kind === "assignment") Forms.assignment(DB.get("assignments", d.id));
  else if (d.kind === "trip") Forms.trip(DB.get("trips", d.id));
  else Forms.event(DB.get("events", d.id));
};

/* ---------- Drag & drop rescheduling ---------- */
AFTER_RENDER.push(root => {
  let dragId = null;
  $$("[data-drag-lesson]", root).forEach(el => {
    el.addEventListener("dragstart", e => {
      dragId = el.dataset.dragLesson;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", dragId); } catch (err) {}
    });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); dragId = null; $$(".drag-over").forEach(c => c.classList.remove("drag-over")); });
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
    });
  });
  $$("[data-day]", root).forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("drag-over"); });
    col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("drag-over");
      const id = dragId || e.dataTransfer.getData("text/plain");
      const l = DB.get("lessons", id);
      if (!l || l.date === col.dataset.day) return;
      const was = l.date;
      DB.update("lessons", id, { date: col.dataset.day });
      toast(`Moved to ${fmtDate(col.dataset.day, "short")}`, { action: "Undo", onAction: () => DB.update("lessons", id, { date: was }) });
    });
  });
});

  if (!c) return;
  const next = clamp((Number(c.completedUnits) || 0) + Number(d.n), 0, Number(c.totalUnits) || 999);
  DB.update("curricula", c.id, { completedUnits: next });
  if (next === Number(c.totalUnits) && Number(d.n) > 0) toast(`${c.name} complete — well done!`, { icon: "sparkle", ms: 4500 });
};

/* ---------- Assignments ---------- */
function acAssignments() {
  const t = todayISO();
  let rows = DB.state.assignments.filter(a => S.inScope(a.studentId));
  if (FILTER.subject) rows = rows.filter(a => a.subjectId === FILTER.subject);
  const open = rows.filter(a => a.status !== "done" && a.status !== "skipped");
  const overdue = open.filter(a => a.due && a.due < t);
  if (FILTER.assign === "open") rows = open;
  else if (FILTER.assign === "overdue") rows = overdue;
  else if (FILTER.assign === "done") rows = rows.filter(a => a.status === "done");
  rows = sortBy(rows, "due", "createdAt");

  return `
    <div class="section-head"><h2>Assignments</h2>
      <div class="sh-actions"><button class="btn btn-primary" data-act="add-assignment">${icon("plus")}New assignment</button></div></div>

    ${overdue.length ? `<div class="callout warn" style="margin-bottom:var(--s4)">${icon("alert")}
      <div><strong>${plural(overdue.length, "assignment")} overdue.</strong> <button class="btn btn-sm" style="margin-left:8px" data-act="filter-assign" data-v="overdue">Show them</button></div></div>` : ""}

    ${filterBar(`
      ${selectFilter("filter-assign-sel", FILTER.assign, [
        { value: "open", label: "Open work" }, { value: "overdue", label: "Overdue" },
        { value: "done", label: "Completed" }, { value: "all", label: "Everything" }], "Filter by status")}
      ${selectFilter("filter-subject", FILTER.subject, [{ value: "", label: "All subjects" },
        ...DB.state.subjects.map(s => ({ value: s.id, label: s.name }))], "Filter by subject")}
      <div class="spacer"></div>
      <span class="tiny dim">${plural(rows.length, "assignment")}</span>
    `)}

    <div class="card">
      ${rows.length ? `<div class="list">${rows.map(a => assignmentRow(a)).join("")}</div>`
        : emptyState("clipboard", FILTER.assign === "open" ? "No open assignments" : "Nothing here",
          FILTER.assign === "open" ? "Everything assigned has been finished. Add the next one when you're ready." : "Try a different filter.",
          "Add assignment", 'data-act="add-assignment"')}
    </div>`;
}
ACT["filter-assign"] = (el, d) => { FILTER.assign = d.v; scheduleRender(); };
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName !== "SELECT") return;
  const a = el.dataset.act;
  if (a === "filter-assign-sel") { FILTER.assign = el.value; scheduleRender(); }
  else if (a === "filter-subject") { FILTER.subject = el.value; scheduleRender(); }
  else if (a === "filter-gb-student") { FILTER.gbStudent = el.value; scheduleRender(); }
  else if (a === "filter-goal-scope") { FILTER.goalScope = el.value; scheduleRender(); }
  else if (a === "filter-generic") { FILTERS[el.dataset.k] = el.value; scheduleRender(); }
});

/* ---------- Gradebook ---------- */

      ${emptyState("chart", "Grading is switched off", "Many homeschools never need letter grades — and that's fine. Turn grading on in Settings whenever you want it.", "Open settings", 'data-act="goto" data-path="settings/grading"')}
    </div>`;
  }
  const studs = S.scopeStudents().filter(s => !FILTER.gbStudent || s.id === FILTER.gbStudent);
  return `
    <div class="section-head"><h2>Gradebook</h2>
      <div class="sh-actions">
        <button class="btn btn-ghost btn-sm" data-act="goto" data-path="settings/grading">${icon("sliders")}Weighting</button>
        <button class="btn btn-primary" data-act="add-grade">${icon("plus")}Record grade</button>
      </div></div>
    ${filterBar(selectFilter("filter-gb-student", FILTER.gbStudent,
      [{ value: "", label: "All students" }, ...S.students().map(s => ({ value: s.id, label: s.name }))], "Filter by student"))}

    ${studs.length ? studs.map(s => {
      const subs = DB.state.subjects.filter(sub => DB.state.grades.some(g => g.studentId === s.id && g.subjectId === sub.id));
      const avg = S.studentAverage(s.id);
      return `<div class="card" style="margin-bottom:var(--s4)">
        <div class="card-hd">${avatar(s, "avatar-sm")}<h3>${esc(s.name)}</h3>
          <div class="hd-actions">
            ${avg !== null ? `<span class="grade-badge">${avg}% · ${S.gradeLetter(avg)}</span>` : `<span class="tiny dim">No grades yet</span>`}
            <button class="btn btn-ghost btn-sm btn-icon" data-act="add-grade-for" data-id="${s.id}" aria-label="Record grade for ${attr(s.name)}">${icon("plus")}</button>
          </div>
        </div>
        ${subs.length ? `<div class="card-bd" style="padding:var(--s3) var(--s4)">
          ${subs.map(sub => {
            const rows = sortBy(DB.state.grades.filter(g => g.studentId === s.id && g.subjectId === sub.id), "-date");
            const g = S.subjectGrade(s.id, sub.id);
            return `<div class="gb-subject">
              <div class="gb-hd" data-act="toggle-gb" data-id="${s.id}-${sub.id}">
                <span class="chip-dot" style="background:${sub.color}"></span>
                <span style="font-weight:650">${esc(sub.name)}</span>
                <span class="tiny dim">${plural(rows.length, "entry", "entries")}</span>
                <span class="g">${g === null ? "—" : `${g}% <span class="grade-badge">${S.gradeLetter(g)}</span>`}</span>
              </div>
              <div class="tbl-wrap" id="gb-${s.id}-${sub.id}">
                <table class="tbl"><thead><tr><th>Item</th><th>Category</th><th>Date</th><th class="num">Score</th><th class="num">%</th><th></th></tr></thead>
                <tbody>${rows.map(r => {
                  const p = r.max ? Math.round((r.score / r.max) * 100) : null;
