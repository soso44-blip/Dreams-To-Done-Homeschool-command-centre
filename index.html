/* ===== 10-theme.css ===== */
/* ============================================================
   HOMESCHOOL COMMAND CENTER — Design tokens
   3 palettes x light/dark. Offline-safe (system fonts only).
   ============================================================ */

:root {
  /* Typography */
  --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* Type scale */
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-base: 0.9375rem;
  --fs-md: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;
  --fs-3xl: 2.25rem;

  /* Spacing */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px;
  --s9: 56px; --s10: 72px;

  /* Radii */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-full: 999px;

  /* Motion */
  --ease: cubic-bezier(.32, .72, 0, 1);
  --dur: 200ms;

  /* Layout */
  --sidebar-w: 244px;
  --header-h: 64px;
  --maxw: 1180px;
}

/* ---------- Palette 1: Quiet Academia (default) ---------- */
:root,
[data-theme="academia"] {
  --bg: #F7F4ED;
  --bg-sunken: #F1EDE3;
  --surface: #FFFDF8;
  --surface-2: #F6F2E9;
  --surface-hover: #F0EBDF;
  --line: #E3DCCC;
  --line-strong: #D2C8B2;

  --text: #302C25;
  --text-2: #6A6255;
  --text-3: #756D5F;
  --text-inv: #FFFDF8;

  --brand: #5E7358;          /* muted sage */
  --brand-hover: #4E6149;
  --brand-soft: #E7EBE1;
  --brand-softer: #F0F3EC;
  --brand-text: #3E4F3A;

  --accent: #7189A3;         /* soft dusty blue */
  --accent-soft: #E4EAF0;
  --accent-text: #405B77;

  --warm: #B4714F;           /* subtle terracotta */
  --warm-soft: #F4E5DB;
  --warm-text: #8E5334;

  --good: #4E8464;  --good-soft: #E1EDE5;
  --warn: #B48226;  --warn-soft: #F7EBD3;
  --bad:  #B15544;  --bad-soft:  #F6E2DD;
  --info: #56789B;  --info-soft: #E3EAF1;
  --good-ink: #3F6B52; --warn-ink: #8A6316; --bad-ink: #93412F; --info-ink: #3F5D7D;

  --shadow-1: 0 1px 2px rgba(48,44,37,.05), 0 1px 3px rgba(48,44,37,.04);
  --shadow-2: 0 2px 4px rgba(48,44,37,.05), 0 8px 20px -6px rgba(48,44,37,.10);
  --shadow-3: 0 12px 32px -8px rgba(48,44,37,.20), 0 2px 8px rgba(48,44,37,.08);
  --ring: 0 0 0 3px rgba(94,115,88,.28);
}

/* ===== 11-base.css ===== */
/* ============================================================
   Base + app shell
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--fs-base);
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
h1 { font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -0.015em; }
h2 { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 600; }
h3 { font-size: var(--fs-md); }
p { margin: 0 0 var(--s3); }
p:last-child { margin-bottom: 0; }
a { color: var(--brand-text); text-decoration-color: color-mix(in srgb, var(--brand) 45%, transparent); text-underline-offset: 2px; }
a:hover { color: var(--brand-hover); }
img { max-width: 100%; display: block; }
svg { width: 18px; height: 18px; flex: 0 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
ul, ol { margin: 0; padding-left: 1.15em; }
hr { border: 0; border-top: 1px solid var(--line); margin: var(--s5) 0; }
small { font-size: var(--fs-xs); }
::selection { background: var(--brand-soft); color: var(--brand-text); }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 4px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: fixed; top: 8px; left: 8px; z-index: 999;
  transform: translateY(-160%);
  background: var(--surface); color: var(--text); padding: 10px 16px;
  border-radius: var(--r-sm); box-shadow: var(--shadow-3); border: 1px solid var(--line);
}
.skip-link:focus { transform: none; }

/* Scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
[data-motion="reduced"] *, [data-motion="reduced"] *::before, [data-motion="reduced"] *::after {
  animation-duration: .001ms !important; transition-duration: .001ms !important;
}

/* ---------- App layout ---------- */
#app { min-height: 100%; }

.app-shell { display: flex; min-height: 100vh; min-height: 100dvh; }

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--bg-sunken);
  border-right: 1px solid var(--line);
  padding: var(--s5) var(--s3) var(--s5);
  display: flex; flex-direction: column; gap: var(--s2);
  position: sticky; top: 0; height: 100vh; height: 100dvh;
  overflow-y: auto;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: var(--s2) var(--s3) var(--s5);
  text-decoration: none; color: var(--text);
}
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(160deg, var(--brand), color-mix(in srgb, var(--brand) 62%, var(--accent)));
  display: grid; place-items: center; color: var(--text-inv);
  flex: 0 0 auto; box-shadow: var(--shadow-1);
}
.brand-mark svg { width: 19px; height: 19px; }
.brand-text { display: block; min-width: 0; }
.brand-name { display: block; font-family: var(--font-display); font-size: 1rem; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.brand-sub { display: block; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); font-weight: 700; white-space: nowrap; }

.nav-group + .nav-group { margin-top: var(--s4); }
.nav-label {
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-3); font-weight: 700; padding: 0 var(--s3) var(--s2);
}
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px var(--s3); border-radius: var(--r-sm);
  color: var(--text-2); text-decoration: none; font-size: var(--fs-base); font-weight: 500;
  border: 1px solid transparent; cursor: pointer; width: 100%; text-align: left; background: none;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; opacity: .8; }
.nav-item:hover { background: var(--surface-hover); color: var(--text); }
.nav-item.is-active {
  background: var(--surface); color: var(--text); font-weight: 600;
  border-color: var(--line); box-shadow: var(--shadow-1);
}
.nav-item.is-active svg { color: var(--brand); opacity: 1; }
.nav-badge {
  margin-left: auto; font-size: 11px; font-weight: 700; min-width: 20px; text-align: center;
  padding: 1px 6px; border-radius: var(--r-full); background: var(--bad-soft); color: var(--bad);
}
.sidebar-foot { margin-top: auto; padding-top: var(--s4); }

.main-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--header-h);
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s6);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-title { display: flex; flex-direction: column; min-width: 0; }
.topbar-title .t { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title .s { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-spacer { flex: 1 1 auto; }
.topbar-actions { display: flex; align-items: center; gap: var(--s2); }

.savepill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-xs); color: var(--text-3); padding: 4px 10px;
  border-radius: var(--r-full); white-space: nowrap;
  transition: opacity var(--dur) var(--ease);
}
.savepill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.savepill svg { width: 13px; height: 13px; color: var(--good); }
.savepill[data-state="saving"] svg { color: var(--warn); }
.savepill[data-state="error"] svg { color: var(--bad); }
.savepill[data-state="saving"] .dot { background: var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.page {
  flex: 1 1 auto;
  padding: var(--s7) var(--s6) var(--s10);
  max-width: var(--maxw); width: 100%; margin: 0 auto;
  animation: fadeup var(--dur) var(--ease);
}
@keyframes fadeup { from { opacity: 0; transform: translateY(4px); } }
.page-wide { max-width: 1400px; }

.page-head { display: flex; align-items: flex-start; gap: var(--s4); margin-bottom: var(--s6); flex-wrap: wrap; }
.page-head .ph-text { min-width: 0; flex: 1 1 260px; }
.page-head h1 { margin-bottom: 4px; }
.page-head .lede { color: var(--text-2); font-size: var(--fs-base); max-width: 62ch; }
.page-head .ph-actions { display: flex; gap: var(--s2); flex-wrap: wrap; }

.section-head {
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  margin: var(--s7) 0 var(--s4);
}
.section-head:first-child { margin-top: 0; }
.section-head h2 { font-size: var(--fs-lg); min-width: 0; }
.section-head .sh-actions { margin-left: auto; display: flex; gap: var(--s2); flex-wrap: wrap; }
.eyebrow { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--text-3); font-weight: 700; }

/* mobile chrome hidden on desktop */
.mobile-nav, .mobile-topbar, .fab { display: none; }


/* ===== 12-components.css ===== */
/* ============================================================
   Components
   ============================================================ */

/* ---------- Buttons ---------- */
.btn {
  --btn-bg: var(--surface);
  --btn-fg: var(--text);
  --btn-bd: var(--line-strong);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 15px; min-height: 38px;
  border-radius: var(--r-sm);
  background: var(--btn-bg); color: var(--btn-fg);
  border: 1px solid var(--btn-bd);
  font-size: var(--fs-base); font-weight: 550; line-height: 1;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform 90ms var(--ease), box-shadow var(--dur) var(--ease);
  box-shadow: var(--shadow-1);
}
.btn svg { width: 17px; height: 17px; flex: 0 0 auto; }
.btn:hover { background: var(--surface-hover); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }

.btn-primary {
  --btn-bg: var(--brand); --btn-fg: var(--text-inv); --btn-bd: transparent;
  box-shadow: var(--shadow-2);
}
.btn-primary:hover { --btn-bg: var(--brand-hover); }
.btn-ghost { --btn-bg: transparent; --btn-bd: transparent; box-shadow: none; color: var(--text-2); }
.btn-ghost:hover { --btn-bg: var(--surface-hover); color: var(--text); }
.btn-soft { --btn-bg: var(--brand-soft); --btn-fg: var(--brand-text); --btn-bd: transparent; box-shadow: none; }
.btn-soft:hover { --btn-bg: color-mix(in srgb, var(--brand-soft) 80%, var(--brand)); }
.btn-danger { --btn-bg: var(--bad-soft); --btn-fg: var(--bad-ink); --btn-bd: transparent; box-shadow: none; }
.btn-danger:hover { --btn-bg: color-mix(in srgb, var(--bad-soft) 82%, var(--bad)); }
.btn-sm { padding: 6px 11px; min-height: 31px; font-size: var(--fs-sm); border-radius: 7px; }
.btn-sm svg { width: 15px; height: 15px; }
.btn-lg { padding: 13px 22px; min-height: 48px; font-size: var(--fs-md); border-radius: var(--r-md); }
.btn-icon { padding: 0; width: 38px; min-height: 38px; }
.btn-icon.btn-sm { width: 31px; }
.btn-block { width: 100%; }

/* ---------- Card ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
}
.card-pad { padding: var(--s5); }
.card-hd {
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line);
}
.card-hd h3 { font-size: var(--fs-md); min-width: 0; }
.card-hd .hd-actions { margin-left: auto; display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.card-bd { padding: var(--s5); }
.card-bd-flush { padding: 0; }
.card-ft { padding: var(--s3) var(--s5); border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.card-int { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s4); }

.grid { display: grid; gap: var(--s4); }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.g-auto-sm { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.g-auto-lg { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.row { display: flex; gap: var(--s3); align-items: center; }
.row-wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: var(--s3); }
.spacer { flex: 1 1 auto; }
.stack > * + * { margin-top: var(--s4); }

/* ---------- Chips / badges ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: 600; line-height: 1.6;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line);
  white-space: nowrap;
}
.chip svg { width: 13px; height: 13px; }
.chip-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.chip.good { background: var(--good-soft); color: var(--good-ink); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn-ink); border-color: transparent; }
.chip.bad  { background: var(--bad-soft);  color: var(--bad-ink);  border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info-ink); border-color: transparent; }
.chip.brand{ background: var(--brand-soft);color: var(--brand-text); border-color: transparent; }
.chip.plain{ background: transparent; }
.chip-btn { cursor: pointer; }
.chip-btn:hover { background: var(--surface-hover); }

.pill-tabs {
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--bg-sunken); border: 1px solid var(--line);
  border-radius: var(--r-full); flex-wrap: wrap;
}
.pill-tab {
  border: 0; background: none; cursor: pointer;
  padding: 6px 14px; border-radius: var(--r-full);
  font-size: var(--fs-sm); font-weight: 550; color: var(--text-2);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  white-space: nowrap;
}
.pill-tab:hover { color: var(--text); }
.pill-tab.is-active { background: var(--surface); color: var(--text); font-weight: 650; box-shadow: var(--shadow-1); }

.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); box-shadow: var(--shadow-1); }
.seg button { border: 0; background: none; padding: 7px 13px; font-size: var(--fs-sm); font-weight: 550; color: var(--text-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.is-active { background: var(--brand-soft); color: var(--brand-text); font-weight: 650; }
.seg button:hover:not(.is-active) { background: var(--surface-hover); }

/* ---------- Avatar ---------- */
.avatar {
  --sz: 36px;
  width: var(--sz); height: var(--sz); border-radius: 50%;
  display: grid; place-items: center; flex: 0 0 auto;
  font-weight: 650; font-size: calc(var(--sz) * .38); letter-spacing: .01em;
  background: var(--tint, var(--brand-soft)); color: var(--tint-fg, var(--brand-text));
  overflow: hidden; position: relative;
  border: 1.5px solid color-mix(in srgb, var(--tint, var(--brand)) 60%, transparent);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-xs { --sz: 24px; }
.avatar-sm { --sz: 30px; }
.avatar-lg { --sz: 52px; }
.avatar-xl { --sz: 78px; }
.avatar-stack { display: flex; }
.avatar-stack .avatar + .avatar { margin-left: -9px; }

/* ---------- Progress ---------- */
.bar { height: 7px; border-radius: 99px; background: var(--bg-sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--brand)); transition: width 400ms var(--ease); }
.bar-lg { height: 10px; }
.bar-row { display: flex; align-items: center; gap: var(--s3); }
.bar-row .bar { flex: 1 1 auto; }
.bar-row .val { font-size: var(--fs-sm); font-variant-numeric: tabular-nums; color: var(--text-2); font-weight: 600; min-width: 42px; text-align: right; }

.ring { --p: 0; --c: var(--brand); width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; position: relative; flex: 0 0 auto;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--bg-sunken) 0); }
.ring::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--surface); }
.ring span { position: relative; z-index: 1; font-size: var(--fs-sm); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Stat tiles ---------- */
.stat {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: var(--s4); display: flex; flex-direction: column; gap: 2px; min-width: 0;
  box-shadow: var(--shadow-1);
}
.stat .k { font-size: var(--fs-xs); color: var(--text-3); font-weight: 600; letter-spacing: .01em; }
.stat .v { font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .m { font-size: var(--fs-xs); color: var(--text-2); }
.stat.tap { cursor: pointer; transition: border-color var(--dur) var(--ease), transform 120ms var(--ease); }
.stat.tap:hover { border-color: var(--line-strong); transform: translateY(-1px); }

/* ---------- Lists ---------- */
.list { display: flex; flex-direction: column; }
.list-row {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s5); border-bottom: 1px solid var(--line);
  min-width: 0; position: relative;
}
.list-row:last-child { border-bottom: 0; }
.list-row.tap { cursor: pointer; }
.list-row.tap:hover { background: var(--surface-hover); }
.list-row .lr-main { min-width: 0; flex: 1 1 auto; }
.list-row .lr-title { font-weight: 600; font-size: var(--fs-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .lr-sub { font-size: var(--fs-xs); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .lr-actions { display: flex; gap: 4px; align-items: center; flex: 0 0 auto; }
.list-row.done .lr-title { text-decoration: line-through; color: var(--text-3); }

.swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; background: var(--c, var(--brand)); }
.rail { width: 3px; align-self: stretch; border-radius: 99px; background: var(--c, var(--brand)); flex: 0 0 auto; }

/* ---------- Table ---------- */
.tbl-wrap { overflow-x: auto; border-radius: var(--r-md); }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.tbl th, .tbl td { padding: 9px var(--s3); text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 700; background: var(--surface-2); position: sticky; top: 0; }
.tbl tbody tr:hover { background: var(--surface-hover); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .wrap { white-space: normal; min-width: 180px; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.field .hint { font-size: var(--fs-xs); color: var(--text-3); }
.inp, .sel, textarea.inp {
  width: 100%; padding: 9px 12px; min-height: 40px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  font-size: var(--fs-base); transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  appearance: none; -webkit-appearance: none;
}
textarea.inp { min-height: 84px; resize: vertical; line-height: 1.5; }
.inp:focus, .sel:focus, textarea.inp:focus { outline: none; border-color: var(--brand); box-shadow: var(--ring); }
.inp::placeholder { color: var(--text-3); }
.sel {
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  padding-right: 34px; cursor: pointer;
}
input[type="color"].inp { padding: 3px; height: 40px; cursor: pointer; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s4); }
.form-grid .full { grid-column: 1 / -1; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: var(--fs-base); }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track {
  width: 40px; height: 23px; border-radius: 99px; background: var(--line-strong);
  position: relative; transition: background var(--dur) var(--ease); flex: 0 0 auto;
}
.switch .track::after {
  content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 18px; height: 18px;
  background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.28);
  transition: transform var(--dur) var(--ease);
}
.switch input:checked + .track { background: var(--brand); }
.switch input:checked + .track::after { transform: translateX(17px); }
.switch input:focus-visible + .track { box-shadow: var(--ring); }
.check { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; font-size: var(--fs-base); }
.check input[type="checkbox"], .check input[type="radio"] { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--brand); flex: 0 0 auto; cursor: pointer; }

.opt-grid { display: flex; flex-wrap: wrap; gap: var(--s2); }
.opt {
  padding: 7px 13px; border-radius: var(--r-full); cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface);
  font-size: var(--fs-sm); font-weight: 550; color: var(--text-2);
  display: inline-flex; align-items: center; gap: 6px;
  transition: all var(--dur) var(--ease);
}
.opt:hover { background: var(--surface-hover); }
.opt.is-on { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 50%, transparent); color: var(--brand-text); font-weight: 650; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }

.color-grid { display: flex; flex-wrap: wrap; gap: var(--s2); }
.color-dot {
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
  background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); position: relative;
}
.color-dot.is-on { border-color: var(--text); box-shadow: inset 0 0 0 2px var(--surface); }

.adv-toggle {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; background: none; border: 0;
  color: var(--brand-text); font-weight: 600; font-size: var(--fs-sm); padding: 6px 0;
}
.adv-toggle svg { width: 15px; height: 15px; transition: transform var(--dur) var(--ease); }
.adv-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.adv-body { display: none; padding-top: var(--s2); }
.adv-body.is-open { display: block; animation: fadeup 160ms var(--ease); }

/* ---------- Modal / sheet ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 100;
  background: color-mix(in srgb, #16130E 46%, transparent);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: var(--s5);
  animation: fadein 160ms var(--ease);
  overflow-y: auto;
}
@keyframes fadein { from { opacity: 0; } }
.modal {
  background: var(--surface); border-radius: var(--r-xl);
  box-shadow: var(--shadow-3); border: 1px solid var(--line);
  width: min(640px, 100%); max-height: min(88vh, 900px);
  display: flex; flex-direction: column; overflow: hidden;
  animation: modalin 240ms var(--ease); margin: auto;
}
@keyframes modalin { from { opacity: 0; transform: translateY(14px) scale(.985); } }
.modal-sm { width: min(440px, 100%); }
.modal-lg { width: min(880px, 100%); }
.modal-hd { display: flex; align-items: center; gap: var(--s3); padding: var(--s5) var(--s5) var(--s4); border-bottom: 1px solid var(--line); }
.modal-hd h2 { font-size: var(--fs-lg); }
.modal-hd .sub { font-size: var(--fs-xs); color: var(--text-3); }
.modal-bd { padding: var(--s5); overflow-y: auto; flex: 1 1 auto; }
.modal-ft {
  padding: var(--s4) var(--s5); border-top: 1px solid var(--line);
  display: flex; gap: var(--s2); align-items: center; background: var(--surface-2);
}
.modal-ft .spacer { flex: 1 1 auto; }

/* ---------- Toast ---------- */
.toasts { position: fixed; z-index: 200; bottom: var(--s5); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: var(--s2); align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast {
  pointer-events: auto;
  background: var(--text); color: var(--bg);
  padding: 11px 17px; border-radius: var(--r-full);
  font-size: var(--fs-sm); font-weight: 550; box-shadow: var(--shadow-3);
  display: flex; align-items: center; gap: 10px;
  animation: toastin 260ms var(--ease);
}
@keyframes toastin { from { opacity: 0; transform: translateY(10px) scale(.96); } }
.toast.out { animation: toastout 200ms var(--ease) forwards; }
@keyframes toastout { to { opacity: 0; transform: translateY(6px) scale(.97); } }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; padding: 0; }
.toast svg { width: 16px; height: 16px; }

/* ---------- Empty state ---------- */
.empty {
  text-align: center; padding: var(--s8) var(--s5);
  display: flex; flex-direction: column; align-items: center; gap: var(--s3);
}
.empty .ill {
  width: 62px; height: 62px; border-radius: var(--r-lg);
  background: var(--brand-softer); color: var(--brand);
  display: grid; place-items: center; border: 1px solid var(--brand-soft);
}
.empty .ill svg { width: 27px; height: 27px; }
.empty h3 { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; }
.empty p { color: var(--text-2); max-width: 44ch; font-size: var(--fs-base); }

/* ---------- Misc ---------- */
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.tnum { font-variant-numeric: tabular-nums; }
.tiny { font-size: var(--fs-xs); }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.divider { height: 1px; background: var(--line); }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.mt0 { margin-top: 0 !important; }

.callout {
  display: flex; gap: var(--s3); padding: var(--s4);
  border-radius: var(--r-md); background: var(--info-soft); color: var(--text);
  border: 1px solid color-mix(in srgb, var(--info) 22%, transparent);
  font-size: var(--fs-sm);
}
.callout svg { width: 18px; height: 18px; flex: 0 0 auto; color: var(--info-ink); margin-top: 1px; }
.callout.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
.callout.warn svg { color: var(--warn-ink); }
.callout.brand { background: var(--brand-softer); border-color: var(--brand-soft); }
.callout.brand svg { color: var(--brand); }

.menu {
  position: fixed; z-index: 150; min-width: 190px; padding: 5px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: var(--shadow-3); animation: fadeup 140ms var(--ease);
}
.menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 11px; border: 0; background: none; border-radius: 7px; cursor: pointer;
  font-size: var(--fs-sm); color: var(--text); font-weight: 500;
}
.menu button:hover { background: var(--surface-hover); }
.menu button svg { width: 16px; height: 16px; opacity: .7; }
.menu button.danger { color: var(--bad-ink); }
.menu .menu-sep { height: 1px; background: var(--line); margin: 5px 2px; }
.menu .menu-label { font-size: var(--fs-xs); color: var(--text-3); padding: 6px 11px 3px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }

/* status dots */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 600; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-planned { color: var(--text-3); }
.st-progress { color: var(--warn-ink); }
.st-complete { color: var(--good-ink); }
.st-skipped { color: var(--text-3); }
.st-resched { color: var(--info-ink); }


/* ===== 13-views.css ===== */
/* ============================================================
   View-specific
   ============================================================ */

/* ---------- Greeting hero ---------- */
.hero {
  background: linear-gradient(150deg, var(--brand-softer), var(--surface) 62%);
  border: 1px solid var(--line); border-radius: var(--r-xl);
  padding: var(--s6); margin-bottom: var(--s5);
  display: flex; gap: var(--s5); align-items: center; flex-wrap: wrap;
  box-shadow: var(--shadow-1); position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px;
  border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--brand) 12%, transparent), transparent 70%);
  pointer-events: none;
}
.hero .h-main { flex: 1 1 320px; min-width: 0; position: relative; }
.hero .h-date { font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 700; margin-bottom: 5px; }
.hero h1 { font-size: var(--fs-3xl); margin-bottom: 6px; }
.hero .h-sum { color: var(--text-2); font-size: var(--fs-md); max-width: 52ch; }
.hero .h-side { display: flex; gap: var(--s4); position: relative; }

/* ---------- Quick actions ---------- */
.qa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); }
.qa {
  display: flex; align-items: center; gap: 11px; padding: var(--s4);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  cursor: pointer; text-align: left; font-size: var(--fs-base); font-weight: 600; color: var(--text);
  box-shadow: var(--shadow-1);
  transition: transform 120ms var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.qa:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--line-strong); }
.qa .ic {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto;
  background: var(--brand-soft); color: var(--brand-text);
}
.qa .ic svg { width: 18px; height: 18px; }
.qa.a2 .ic { background: var(--accent-soft); color: var(--accent-text); }
.qa.a3 .ic { background: var(--warm-soft); color: var(--warm-text); }
.qa.a4 .ic { background: var(--good-soft); color: var(--good); }
.qa.a5 .ic { background: var(--info-soft); color: var(--info); }

/* ---------- Lesson rows (Today) ---------- */
.tl { display: flex; flex-direction: column; }
.tl-group-hd {
  display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s5);
  background: var(--surface-2); border-bottom: 1px solid var(--line);
  position: sticky; top: var(--header-h); z-index: 5;
}
.tl-group-hd .nm { font-weight: 650; font-size: var(--fs-base); }
.tl-group-hd .ct { font-size: var(--fs-xs); color: var(--text-3); margin-left: auto; font-variant-numeric: tabular-nums; }

.lrow {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s5) var(--s3) var(--s4);
  border-bottom: 1px solid var(--line); min-width: 0;
  transition: background var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.lrow:last-child { border-bottom: 0; }
.lrow:hover { background: var(--surface-hover); }
.lrow.is-done { opacity: .62; }
.lrow.is-done .l-title { text-decoration: line-through; }
.lrow.is-skipped { opacity: .5; }
.lrow.is-skipped .l-title { text-decoration: line-through; }
.l-time {
  width: 62px; flex: 0 0 auto; text-align: right; font-size: var(--fs-sm);
  color: var(--text-2); font-variant-numeric: tabular-nums; font-weight: 600; line-height: 1.3;
  white-space: nowrap;
}
.l-time small { display: block; font-size: 10px; color: var(--text-3); font-weight: 500; }
.l-main { flex: 1 1 auto; min-width: 0; }
.l-title { font-weight: 600; font-size: var(--fs-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-meta { display: flex; gap: 8px; align-items: center; font-size: var(--fs-xs); color: var(--text-3); margin-top: 1px; flex-wrap: wrap; }
.l-meta .sub { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--text-2); }
.l-act { display: flex; gap: 5px; align-items: center; flex: 0 0 auto; }

.done-btn {
  width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
  border: 1.75px solid var(--line-strong); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: transparent;
  transition: all 160ms var(--ease);
}
.done-btn svg { width: 17px; height: 17px; }
.done-btn:hover { border-color: var(--good); color: color-mix(in srgb, var(--good) 45%, transparent); background: var(--good-soft); }
.done-btn.is-on { background: var(--good); border-color: var(--good); color: #fff; }
.done-btn.is-on:hover { background: var(--good); }
.done-btn:active { transform: scale(.9); }

/* ---------- Attendance strip ---------- */
.att-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; min-width: 0; }
.att-name { font-weight: 600; min-width: 74px; flex: 0 0 auto; }
.att-opts { display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
.att-opts .opt { padding: 6px 11px; }
@media (max-width: 720px) {
  .att-opts { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .att-opts::-webkit-scrollbar { display: none; }
  .att-name { min-width: 0; }
}

/* ---------- Calendar: week ---------- */
.cal-toolbar { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s4); }
.cal-nav { display: flex; align-items: center; gap: 4px; }
.cal-title { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; min-width: 190px; }

.week {
  display: grid; grid-template-columns: repeat(var(--cols, 7), minmax(0, 1fr));
  gap: 0; border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; background: var(--surface); box-shadow: var(--shadow-1);
}
.week-col { border-right: 1px solid var(--line); min-height: 300px; display: flex; flex-direction: column; }
.week-col:last-child { border-right: 0; }
.week-col.is-off { background: var(--bg-sunken); }
.week-col.is-today { background: color-mix(in srgb, var(--brand-softer) 60%, var(--surface)); }
.week-col.drag-over { background: var(--brand-soft); }
.wk-hd {
  padding: 9px var(--s3); border-bottom: 1px solid var(--line); text-align: center;
  background: var(--surface);
}
.week-col.is-off .wk-hd { background: var(--bg-sunken); }
.week-col.is-today .wk-hd { background: color-mix(in srgb, var(--brand-softer) 60%, var(--surface)); }
.wk-hd .dow { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 700; }
.wk-hd .dnum { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; line-height: 1.2; }
.week-col.is-today .wk-hd .dnum { color: var(--brand); }
.wk-hd .off-tag { font-size: 10px; color: var(--text-3); }
.wk-body { padding: 7px; display: flex; flex-direction: column; gap: 5px; flex: 1 1 auto; }
.wk-add {
  border: 1px dashed var(--line-strong); background: none; border-radius: 7px;
  color: var(--text-3); font-size: var(--fs-xs); padding: 5px; cursor: pointer;
  opacity: 0; transition: opacity var(--dur) var(--ease); margin-top: auto;
}
.week-col:hover .wk-add, .wk-add:focus-visible { opacity: 1; }

.ev {
  --c: var(--brand);
  border-left: 3px solid var(--c);
  background: color-mix(in srgb, var(--c) 9%, var(--surface));
  border-radius: 6px; padding: 5px 7px; cursor: pointer; min-width: 0;
  font-size: var(--fs-xs); position: relative;
  transition: transform 100ms var(--ease), box-shadow var(--dur) var(--ease);
}
.ev:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
.ev .ev-t { font-weight: 650; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .ev-m { color: var(--text-2); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.is-done { opacity: .55; }
.ev.is-done .ev-t { text-decoration: line-through; }
.ev.dragging { opacity: .4; }
.ev[draggable="true"] { cursor: grab; }
.ev-kind { position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); opacity: .55; }

/* ---------- Calendar: month ---------- */
.month {
  display: grid; grid-template-columns: repeat(7, minmax(0,1fr));
  border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
  background: var(--surface); box-shadow: var(--shadow-1);
}
.month .mo-dow {
  padding: 8px; text-align: center; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-3); font-weight: 700; background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.mo-cell {
  min-height: 104px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 5px; display: flex; flex-direction: column; gap: 3px; cursor: pointer;
}
.mo-cell:nth-child(7n+7) { border-right: 0; }
.mo-cell.is-out { background: var(--bg-sunken); }
.mo-cell.is-out .mo-n { color: var(--text-3); opacity: .5; }
.mo-cell.is-off { background: color-mix(in srgb, var(--bg-sunken) 70%, var(--surface)); }
.mo-cell:hover { background: var(--surface-hover); }
.mo-n { font-size: var(--fs-sm); font-weight: 650; font-variant-numeric: tabular-nums; padding: 1px 3px; }
.mo-cell.is-today .mo-n {
  background: var(--brand); color: var(--text-inv); border-radius: 50%;
  width: 23px; height: 23px; display: grid; place-items: center; padding: 0;
}
.mo-ev { font-size: 10.5px; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, var(--c, var(--brand)) 13%, var(--surface)); color: var(--text); border-left: 2px solid var(--c, var(--brand)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mo-more { font-size: 10px; color: var(--text-3); font-weight: 600; padding-left: 4px; }

/* ---------- Agenda ---------- */
.agenda-day { display: flex; gap: var(--s4); padding: var(--s4) 0; border-bottom: 1px solid var(--line); }
.agenda-day:last-child { border-bottom: 0; }
.ag-date { width: 92px; flex: 0 0 auto; text-align: right; }
.ag-date .d { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 600; line-height: 1; }
.ag-date .w { font-size: var(--fs-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.ag-date.is-today .d { color: var(--brand); }
.ag-items { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

/* ---------- Students ---------- */
.stu-card {
  display: flex; flex-direction: column; gap: var(--s4); padding: var(--s5);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-1); cursor: pointer; position: relative; overflow: hidden;
  transition: transform 140ms var(--ease), box-shadow var(--dur) var(--ease);
}
.stu-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.stu-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--tint, var(--brand)); }
.stu-card-add::before { display: none; }
.stu-hd { display: flex; align-items: center; gap: var(--s3); }
.stu-hd .nm { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; }
.stu-hd .gr { font-size: var(--fs-xs); color: var(--text-3); }
.stu-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); text-align: center; }
.stu-stats .s .v { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; line-height: 1.1; }
.stu-stats .s .k { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }

.stu-switch { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.stu-switch::-webkit-scrollbar { display: none; }
.stu-pill {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px 4px 4px;
  border-radius: var(--r-full); border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); white-space: nowrap;
  transition: all var(--dur) var(--ease);
}
.stu-pill.is-on { border-color: color-mix(in srgb, var(--tint, var(--brand)) 55%, transparent); background: color-mix(in srgb, var(--tint, var(--brand)) 11%, var(--surface)); color: var(--text); }
.stu-pill:hover { background: var(--surface-hover); }
.stu-pill .avatar { --sz: 24px; }
.stu-pill.all { padding-left: 12px; }

/* Student detail header */
.stu-banner {
  display: flex; gap: var(--s5); align-items: center; padding: var(--s5);
  border-radius: var(--r-xl); border: 1px solid var(--line); box-shadow: var(--shadow-1);
  background: linear-gradient(140deg, color-mix(in srgb, var(--tint, var(--brand)) 14%, var(--surface)), var(--surface) 70%);
  flex-wrap: wrap; margin-bottom: var(--s5);
}
.stu-banner .who { flex: 1 1 240px; min-width: 0; }
.stu-banner h1 { font-size: var(--fs-2xl); }

/* ---------- Gradebook ---------- */
.gb-subject { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.gb-subject + .gb-subject { margin-top: var(--s3); }
.gb-hd { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); background: var(--surface-2); cursor: pointer; }
.gb-hd .g { margin-left: auto; font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; }
.grade-badge {
  min-width: 40px; text-align: center; padding: 3px 9px; border-radius: var(--r-sm);
  font-weight: 700; font-size: var(--fs-sm); background: var(--brand-soft); color: var(--brand-text);
}

/* ---------- Portfolio gallery ---------- */
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--s4); }
.gal-item {
  border-radius: var(--r-md); overflow: hidden; background: var(--surface);
  border: 1px solid var(--line); cursor: pointer; box-shadow: var(--shadow-1);
  transition: transform 140ms var(--ease), box-shadow var(--dur) var(--ease);
  display: flex; flex-direction: column;
}
.gal-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.gal-thumb {
  aspect-ratio: 4 / 3; background: var(--bg-sunken); display: grid; place-items: center;
  color: var(--text-3); position: relative; overflow: hidden;
}
.gal-thumb img { width: 100%; height: 100%; object-fit: cover; }
.gal-thumb svg { width: 30px; height: 30px; }
.gal-meta { padding: 10px var(--s3) var(--s3); min-width: 0; }
.gal-meta .t { font-weight: 650; font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gal-meta .m { font-size: var(--fs-xs); color: var(--text-3); }

/* ---------- Reading ---------- */
.book {
  display: flex; gap: var(--s3); padding: var(--s3) var(--s4); align-items: center;
  border-bottom: 1px solid var(--line);
}
.book:last-child { border-bottom: 0; }
.book-spine {
  width: 38px; height: 52px; border-radius: 3px 6px 6px 3px; flex: 0 0 auto;
  background: linear-gradient(135deg, var(--c, var(--brand)), color-mix(in srgb, var(--c, var(--brand)) 65%, #000));
  box-shadow: var(--shadow-1); position: relative; display: grid; place-items: center;
  color: #fff; font-size: 9px; font-weight: 700; text-align: center; padding: 3px; overflow: hidden;
}
.book-spine::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.25); }
.stars { display: inline-flex; gap: 1px; color: var(--warn); }
.stars svg { width: 13px; height: 13px; }
.stars .off { color: var(--line-strong); }

/* ---------- Quick add sheet ---------- */
.qa-sheet { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); }
.qa-sheet button {
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: var(--s4) var(--s2);
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); cursor: pointer;
  font-size: var(--fs-sm); font-weight: 600; color: var(--text); text-align: center;
  transition: all 130ms var(--ease);
}
.qa-sheet button:hover { background: var(--brand-softer); border-color: color-mix(in srgb, var(--brand) 40%, transparent); transform: translateY(-2px); }
.qa-sheet .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-text); display: grid; place-items: center; }
.qa-sheet .ic svg { width: 17px; height: 17px; }

/* ---------- Search palette ---------- */
.palette-scrim { align-items: flex-start; padding-top: 11vh; }
.palette { width: min(620px, 100%); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3); border: 1px solid var(--line); overflow: hidden; animation: modalin 200ms var(--ease); }
.palette-inp { display: flex; align-items: center; gap: 10px; padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); }
.palette-inp svg { width: 19px; height: 19px; color: var(--text-3); }
.palette-inp input { flex: 1 1 auto; border: 0; background: none; outline: none; font-size: var(--fs-lg); }
.palette-inp input::placeholder { color: var(--text-3); }
.palette-res { max-height: 56vh; overflow-y: auto; padding: 6px; }
.pres {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--r-sm);
  cursor: pointer; width: 100%; border: 0; background: none; text-align: left;
}
.pres:hover, .pres.is-sel { background: var(--brand-softer); }
.pres .pi { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); flex: 0 0 auto; }
.pres .pi svg { width: 15px; height: 15px; }
.pres .pt { font-weight: 600; font-size: var(--fs-base); }
.pres .ps { font-size: var(--fs-xs); color: var(--text-3); }
.pres .pk { margin-left: auto; font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.palette-ft { padding: 8px var(--s5); border-top: 1px solid var(--line); background: var(--surface-2); font-size: var(--fs-xs); color: var(--text-3); display: flex; gap: var(--s4); }
kbd {
  font-family: var(--font-ui); font-size: 10px; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--line-strong); background: var(--surface); box-shadow: 0 1px 0 var(--line-strong); font-weight: 600;
}

/* ---------- Onboarding ---------- */
.onb-scrim { padding: 0; align-items: stretch; background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; overflow-y: auto; }
.onb { width: 100%; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
.onb-inner { max-width: 620px; margin: auto; padding: var(--s8) var(--s5) var(--s9); width: 100%; }
.onb-steps { display: flex; gap: 6px; margin-bottom: var(--s6); }
.onb-steps i { height: 3px; flex: 1 1 0; border-radius: 99px; background: var(--line); transition: background var(--dur) var(--ease); }
.onb-steps i.on { background: var(--brand); }
.onb h1 { font-size: var(--fs-3xl); margin-bottom: var(--s2); }
.onb .lede { color: var(--text-2); font-size: var(--fs-md); margin-bottom: var(--s6); max-width: 48ch; }
.onb-ft { display: flex; gap: var(--s3); align-items: center; margin-top: var(--s7); }
.onb-logo { display: flex; align-items: center; gap: 10px; margin-bottom: var(--s7); }
.value-row { display: flex; gap: 11px; padding: var(--s3) 0; align-items: flex-start; }
.value-row .vi { width: 32px; height: 32px; border-radius: 9px; background: var(--brand-soft); color: var(--brand-text); display: grid; place-items: center; flex: 0 0 auto; }
.value-row .vi svg { width: 16px; height: 16px; }
.value-row .vt { font-weight: 650; font-size: var(--fs-base); }
.value-row .vs { font-size: var(--fs-sm); color: var(--text-2); }

/* ---------- Reports ---------- */
.rep-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: var(--s3); }
.rep-card {
  padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface);
  cursor: pointer; display: flex; gap: 11px; align-items: flex-start; text-align: left; box-shadow: var(--shadow-1);
  transition: all 130ms var(--ease);
}
.rep-card:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow-2); }
.rep-card.is-on { border-color: var(--brand); background: var(--brand-softer); }
.rep-card .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2); color: var(--brand); display: grid; place-items: center; flex: 0 0 auto; }
.rep-card .ic svg { width: 16px; height: 16px; }
.rep-card > span:last-child { min-width: 0; }
.rep-card .t { display: block; font-weight: 650; font-size: var(--fs-base); line-height: 1.3; }
.rep-card .d { display: block; font-size: var(--fs-xs); color: var(--text-3); margin-top: 2px; }

.doc {
  background: #fff; color: #1c1a17; border-radius: var(--r-md);
  padding: 46px 48px; box-shadow: var(--shadow-2); border: 1px solid var(--line);
  font-size: 13.5px; line-height: 1.55; max-width: 850px; margin: 0 auto;
  overflow-wrap: anywhere;
}
.doc h1, .doc h2, .doc h3 { color: #1c1a17; }
.doc-hd { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; border-bottom: 2px solid #1c1a17; padding-bottom: 14px; margin-bottom: 22px; }
.doc-hd .dh-main { flex: 1 1 auto; min-width: 0; }
.doc-hd h1 { font-family: var(--font-display); font-size: 25px; margin-bottom: 2px; overflow-wrap: anywhere; }
.doc-hd .sub { font-size: 12px; color: #6a6255; overflow-wrap: anywhere; }
.doc-hd .fam { text-align: right; font-size: 11px; color: #6a6255; line-height: 1.5; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.doc section { margin-bottom: 26px; break-inside: avoid; }
.doc h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; font-family: var(--font-ui); font-weight: 700; color: #6a6255; border-bottom: 1px solid #ddd6c8; padding-bottom: 5px; margin-bottom: 11px; }
.doc table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.doc th, .doc td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #e6e0d4; }
.doc th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #6a6255; }
.doc td.num, .doc th.num { text-align: right; font-variant-numeric: tabular-nums; }
.doc .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; }
.doc .kv .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #6a6255; font-weight: 700; }
.doc .kv .v { font-size: 17px; font-family: var(--font-display); font-weight: 600; }
.doc .sig { margin-top: 40px; display: flex; gap: 40px; }
.doc .sig div { flex: 1 1 0; border-top: 1px solid #1c1a17; padding-top: 6px; font-size: 11px; color: #6a6255; }
.doc .doc-ft { margin-top: 28px; padding-top: 12px; border-top: 1px solid #ddd6c8; font-size: 10.5px; color: #8a8272; }
.doc .bar { background: #eae5d9; }
.doc .bar > i { background: #6a6255; }

/* ---------- Year at a glance ---------- */
.yr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: var(--s4); }
.yr-month { min-width: 0; }
.yr-hd { display: flex; justify-content: space-between; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); margin-bottom: 5px; }
.yr-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.yr-cell { aspect-ratio: 1; border-radius: 3px; background: transparent; }
.yr-cell.on { background: color-mix(in srgb, var(--brand) 62%, var(--surface)); }
.yr-cell.brk { background: color-mix(in srgb, var(--accent) 48%, var(--surface)); }
.yr-cell.off { background: var(--bg-sunken); }
.yr-dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.yr-dot.on { background: color-mix(in srgb, var(--brand) 62%, var(--surface)); }
.yr-dot.brk { background: color-mix(in srgb, var(--accent) 48%, var(--surface)); }
.yr-dot.off { background: var(--bg-sunken); border: 1px solid var(--line); }

/* ---------- Storage meter ---------- */
.meter { height: 8px; border-radius: 99px; background: var(--bg-sunken); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }

/* ---------- Checklist ---------- */
.cl-item { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.cl-item:last-child { border-bottom: 0; }
.cl-item.done span { text-decoration: line-through; color: var(--text-3); }
.cl-item input { accent-color: var(--brand); width: 16px; height: 16px; }

/* ---------- Drag ---------- */
.drop-hint { outline: 2px dashed var(--brand); outline-offset: -4px; }

/* ---------- Archived students ---------- */
.archived-students summary { display: flex; align-items: center; gap: 8px; padding: 8px 4px; list-style: none; cursor: pointer; }
.archived-students summary::-webkit-details-marker { display: none; }
.archived-students summary svg { width: 16px; height: 16px; }
.archived-students[open] summary { margin-bottom: 4px; }


/* ===== 14-responsive.css ===== */
/* ============================================================
   Responsive — tablet & phone
   ============================================================ */

@media (max-width: 1080px) {
  :root { --sidebar-w: 68px; }
  .sidebar { padding: var(--s4) 10px; align-items: center; }
  .sidebar .nav-label, .brand-text, .nav-item span, .nav-badge, .sidebar-foot .lbl-txt { display: none; }
  .brand { padding: var(--s2) 0 var(--s5); justify-content: center; }
  .nav-item { justify-content: center; padding: 11px 0; }
  .nav-item svg { width: 20px; height: 20px; }
  .page { padding: var(--s6) var(--s5) var(--s9); }
  .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (max-width: 860px) {
  .g3, .g2 { grid-template-columns: minmax(0,1fr); }
  .form-grid { grid-template-columns: 1fr; }
  .hero { padding: var(--s5); }
  .hero h1 { font-size: var(--fs-2xl); }
}

/* ---------- Phone ---------- */
@media (max-width: 720px) {
  :root { --header-h: 56px; }

  .sidebar { display: none; }
  .topbar { display: none; }

  .app-shell { display: block; }
  .main-col { display: block; }

  .mobile-topbar {
    display: flex; align-items: center; gap: var(--s2);
    position: sticky; top: 0; z-index: 40; height: var(--header-h);
    padding: 0 var(--s4);
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .mobile-topbar .mt-title { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mobile-topbar .mt-actions { margin-left: auto; display: flex; gap: 4px; align-items: center; }

  .page { padding: var(--s5) var(--s4) calc(84px + env(safe-area-inset-bottom, 0px)); max-width: 100%; }
  .page-head { margin-bottom: var(--s5); }
  .page-head h1 { font-size: var(--fs-xl); }
  .hero { padding: var(--s5) var(--s4); border-radius: var(--r-lg); }
  .hero h1 { font-size: var(--fs-xl); }
  .hero .h-side { display: none; }
  .hero .btn { flex: 1 1 auto; }

  .callout { flex-wrap: wrap; }
  .callout > div { flex: 1 1 100%; }
  .callout .btn { width: 100%; }

  .qa-grid { grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .qa { padding: var(--s3); font-size: var(--fs-sm); gap: 9px; }
  .qa .ic { width: 30px; height: 30px; border-radius: 9px; }
  .qa .ic svg { width: 16px; height: 16px; }

  .mobile-nav {
    display: flex; position: fixed; z-index: 60; bottom: 0; left: 0; right: 0;
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: saturate(1.5) blur(16px); -webkit-backdrop-filter: saturate(1.5) blur(16px);
    border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .mobile-nav a, .mobile-nav button {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 5px 2px; border: 0; background: none; cursor: pointer;
    color: var(--text-3); font-size: 10px; font-weight: 600; text-decoration: none;
    border-radius: var(--r-sm); min-height: 48px; justify-content: center;
  }
  .mobile-nav svg { width: 21px; height: 21px; }
  .mobile-nav .is-active { color: var(--brand); }
  .mobile-nav .is-active svg { stroke-width: 2.1; }

  .fab {
    display: grid; place-items: center; position: fixed; z-index: 61;
    right: var(--s4); bottom: calc(74px + env(safe-area-inset-bottom, 0px));
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--brand); color: var(--text-inv); border: 0;
    box-shadow: var(--shadow-3); cursor: pointer;
  }
  .fab svg { width: 25px; height: 25px; }
  .fab:active { transform: scale(.94); }

  /* Modals become bottom sheets — but NOT the full-screen onboarding scrim,
     which must stay top-aligned and scrollable (flex-end clips + freezes its
     top on phones where the content is taller than the visible viewport). */
  .scrim:not(.onb-scrim) { padding: 0; align-items: flex-end; }
  .onb-scrim { align-items: stretch; -webkit-overflow-scrolling: touch; }
  .onb { min-height: 100%; }
  .modal {
    width: 100%; max-width: 100%; max-height: 92vh; max-height: 92dvh;
    border-radius: var(--r-xl) var(--r-xl) 0 0; margin: 0;
    animation: sheetin 260ms var(--ease);
  }
  @keyframes sheetin { from { transform: translateY(24px); opacity: .6; } }
  .modal-bd { padding: var(--s4); }
  .modal-hd { padding: var(--s4); }
  .modal-ft { padding: var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom, 0px)); }
  .modal-ft .btn { flex: 1 1 auto; }
  .modal-ft .btn-ghost { flex: 0 0 auto; }

  .palette-scrim { align-items: flex-start; padding-top: 0; }
  .palette { border-radius: 0; max-height: 100vh; min-height: 100dvh; }
  .palette-res { max-height: none; }

  /* Week view scrolls horizontally as day columns */
  .week { --cols: 7; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
  .week-col { min-width: 78vw; scroll-snap-align: start; }
  .wk-hd { position: static; }
  .tl-group-hd { top: var(--header-h); }

  .mo-cell { min-height: 62px; padding: 3px; }
  .mo-ev { font-size: 9px; padding: 1px 3px; }
  .month .mo-dow { font-size: 9px; padding: 5px 2px; }

  .qa-sheet { grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
  .qa-sheet button { padding: var(--s3) 4px; font-size: 11px; }

  .stat .v { font-size: var(--fs-xl); }
  .list-row, .lrow { padding-left: var(--s4); padding-right: var(--s4); }
  .card-hd, .card-bd { padding: var(--s4); }
  .doc { padding: var(--s5) var(--s4); }
  .cal-toolbar { gap: var(--s2); }
  .cal-toolbar > .btn-primary { display: none; }
  .cal-title { order: -1; width: 100%; min-width: 0; font-size: var(--fs-lg); }
  .cal-toolbar .seg { flex: 1 1 auto; }
  .cal-toolbar .seg button { flex: 1 1 0; padding: 7px 6px; }
  .g-auto, .g-auto-lg { grid-template-columns: minmax(0,1fr); }
  .gal { grid-template-columns: repeat(2, 1fr); gap: var(--s3); }
  .toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .pill-tabs { display: flex; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; max-width: 100%; }
  .pill-tabs::-webkit-scrollbar { display: none; }
  .ag-date { width: 62px; }
  .l-time { width: 58px; font-size: var(--fs-xs); }

  /* Onboarding footer: stack the CTAs full-width instead of overflowing the screen */
  .onb-ft { flex-wrap: wrap; }
  .onb-ft .btn { flex: 1 1 100%; }
  .onb-ft .spacer { display: none; }
}

@media (max-width: 400px) {
  .qa-sheet { grid-template-columns: repeat(2, 1fr); }
  .gal { grid-template-columns: 1fr; }
}

/* Touch targets */
@media (pointer: coarse) {
  .btn-sm { min-height: 36px; }
  .done-btn { width: 38px; height: 38px; }
  .wk-add { opacity: 1; }
}


/* ===== 15-print.css ===== */
/* ============================================================
   Print — reports only
   ============================================================ */
@media print {
  @page { margin: 14mm; size: portrait; }

  html, body {
    background: #fff !important; color: #000 !important;
    font-size: 11.5pt;
  }
  .sidebar, .topbar, .mobile-nav, .mobile-topbar, .fab, .toasts,
  .no-print, .page-head, .rep-pick, .pill-tabs, .cal-toolbar { display: none !important; }

  .app-shell { display: block !important; }
  .page { padding: 0 !important; max-width: 100% !important; animation: none !important; }

  .scrim { position: static !important; background: none !important; padding: 0 !important; backdrop-filter: none !important; display: block !important; }
  .modal { box-shadow: none !important; border: 0 !important; max-height: none !important; width: 100% !important; }
  .modal-hd, .modal-ft { display: none !important; }
  .modal-bd { overflow: visible !important; padding: 0 !important; }

  .doc {
    box-shadow: none !important; border: 0 !important; padding: 0 !important;
    max-width: 100% !important; background: #fff !important; color: #000 !important;
    font-size: 10.5pt;
  }
  .doc section { break-inside: avoid; page-break-inside: avoid; }
  .doc table { break-inside: auto; }
  .doc tr { break-inside: avoid; page-break-inside: avoid; }
  .doc thead { display: table-header-group; }
  .doc .page-break { break-before: page; page-break-before: always; }

  a { text-decoration: none; color: #000 !important; }
  .card { box-shadow: none !important; border-color: #ccc !important; }
}

<script>
"use strict";
/* ===== 30-util.js ===== */
/* ============================================================
   Utilities
   ============================================================ */
const APP = { name: "Homeschool Command Center", short: "Command Center", version: "1.0.0" };

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const uid = (p = "") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const attr = s => esc(s);

function icon(name, cls = "") {
  return `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
}

/* ---------- Dates (local, no timezone drift) ---------- */
function iso(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseISO(s) {
  if (!s) return null;
  const [y, m, d] = String(s).split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}
const todayISO = () => iso(new Date());
function addDays(dateOrIso, n) {
  const d = typeof dateOrIso === "string" ? parseISO(dateOrIso) : new Date(dateOrIso);
  d.setDate(d.getDate() + n);
  return d;
}
function addDaysISO(s, n) { return iso(addDays(s, n)); }
function addMonths(d, n) { const x = new Date(d); x.setMonth(x.getMonth() + n, 1); return x; }
function diffDays(a, b) { // b - a in days
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}
function startOfWeek(dateOrIso, weekStart = 0) {
  const d = typeof dateOrIso === "string" ? parseISO(dateOrIso) : new Date(dateOrIso);
  const delta = (d.getDay() - weekStart + 7) % 7;
  d.setDate(d.getDate() - delta);
  return d;
}
const DOW_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const DOW_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const MON_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function fmtDate(s, style = "med") {
  const d = parseISO(s); if (!d) return "";
  if (style === "med") return `${MON_SHORT[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  if (style === "short") return `${MON_SHORT[d.getMonth()]} ${d.getDate()}`;
  if (style === "long") return `${DOW_LONG[d.getDay()]}, ${MON_LONG[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  if (style === "dow") return `${DOW_SHORT[d.getDay()]}, ${MON_SHORT[d.getMonth()]} ${d.getDate()}`;
  return s;
}
function relDay(s) {
  const t = todayISO();
  const n = diffDays(t, s);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  if (n > 1 && n < 7) return DOW_LONG[parseISO(s).getDay()];
  if (n < 0) return `${Math.abs(n)} day${Math.abs(n) === 1 ? "" : "s"} ago`;
  return fmtDate(s, "short");
}
function fmtTime(t) {
  if (!t) return "";
  const [hRaw, m] = t.split(":").map(Number);
  const ampm = hRaw >= 12 ? "PM" : "AM";
  const h = hRaw % 12 === 0 ? 12 : hRaw % 12;
  return `${h}:${String(m).padStart(2, "0")} ${ampm}`;
}
function fmtDuration(min) {
  if (min === null || min === undefined || min === "") return "";

  if (n < 60) return `${n} min`;
  const h = Math.floor(n / 60), r = n % 60;
  return r ? `${h}h ${r}m` : `${h}h`;
}
function fmtHours(mins) {
  const h = mins / 60;
  return (Math.round(h * 10) / 10).toLocaleString();
}
function fmtMoney(n, cur = "$") {
  const v = Number(n) || 0;
  return cur + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const plural = (n, s, p) => `${n} ${n === 1 ? s : (p || s + "s")}`;

/* ---------- Misc ---------- */
function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
/* Sorts by one or more keys. Prefix a key with "-" to reverse it.
   Blank values always sort to the end, whichever direction is used —
   an assignment with no due date belongs below the ones that have one. */
function sortBy(arr, ...keys) {
  const blank = v => v === undefined || v === null || v === "";
  return [...arr].sort((a, b) => {
    for (const k of keys) {
      const dir = k.startsWith("-") ? -1 : 1;
      const key = k.replace(/^-/, "");
      const av = a[key], bv = b[key];
      if (blank(av) && blank(bv)) continue;
      if (blank(av)) return 1;
      if (blank(bv)) return -1;
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
    }
    return 0;
  });
}
const PRIORITY_RANK = { high: 0, normal: 1, low: 2 };
const byPriority = (a, b) => (PRIORITY_RANK[a.priority] ?? 1) - (PRIORITY_RANK[b.priority] ?? 1);

/* Only let through link schemes that are safe to click. */
function safeUrl(u) {
  const s = String(u || "").trim();
  if (!s) return "";
  if (/^(https?:|mailto:|tel:)/i.test(s)) return s;
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return "";   // javascript:, data:, file: …
  return "https://" + s;                            // bare domain typed by hand
}
function groupBy(arr, fn) {
  const m = new Map();
  for (const x of arr) { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;
}
const sum = (arr, fn = x => x) => arr.reduce((a, b) => a + (Number(fn(b)) || 0), 0);
function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
}
function download(filename, content, mime = "application/json") {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
function pickFile(accept, cb, multiple = false) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = accept; inp.multiple = multiple;
  inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = () => { cb(multiple ? Array.from(inp.files) : inp.files[0]); inp.remove(); };
  inp.click();
}
function readFileText(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); });
}
function readFileDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
/* Downscale images so local storage stays small */
async function compressImage(file, maxDim = 1400, quality = 0.82) {
  const dataUrl = await readFileDataURL(file);
  if (!/^image\/(png|jpe?g|webp)/i.test(file.type)) return dataUrl;
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      try { res(c.toDataURL("image/jpeg", quality)); } catch (e) { res(dataUrl); }
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

/* ---------- CSV ---------- */
function toCSV(rows) {
  if (!rows.length) return "";
  const cols = Object.keys(rows[0]);
  const cell = v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return [cols.join(","), ...rows.map(r => cols.map(c => cell(r[c])).join(","))].join("\r\n");
}
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  const t = text.replace(/^﻿/, "");
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c === "\r") { /* skip */ }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(v => String(v).trim() !== ""))
    .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
}

const DB = {
  state: blankState(),
  dirty: false,

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        this.state = Object.assign(blankState(), parsed);
        this.state.settings = Object.assign(blankState().settings, parsed.settings || {});
        this.state.schoolYear = Object.assign(blankState().schoolYear, parsed.schoolYear || {});
        this.state.ui = Object.assign({ scope: "all" }, parsed.ui || {});
      }
    } catch (e) {
      console.warn("Could not read saved data", e);
    }
    return this.state;
  },

  _write() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      this.dirty = false;
      setSaveState("saved");
      return true;
    } catch (e) {
      setSaveState("error");
      toast("Storage is full — export a backup and remove some portfolio images.", { icon: "alert", ms: 8000 });
      return false;
    }
  },

  save: null, // assigned below (debounced)

  touch(rerender = true) {
    this.dirty = true;
    setSaveState("saving");
    this.save();
    if (rerender) scheduleRender();
  },

  /* generic collection ops */
  all(c) { return this.state[c] || []; },
  get(c, id) { return (this.state[c] || []).find(x => x.id === id) || null; },
  add(c, obj, rerender = true) {
    const row = Object.assign({ id: uid(c[0]), createdAt: Date.now() }, obj);
    this.state[c].push(row);
    this.touch(rerender);
    return row;
  },
  update(c, id, patch, rerender = true) {
    const row = this.get(c, id);
    if (!row) return null;
    Object.assign(row, patch, { updatedAt: Date.now() });
    this.touch(rerender);
    return row;
  },
  remove(c, id, rerender = true) {
    const i = this.state[c].findIndex(x => x.id === id);
    if (i < 0) return null;
    const [row] = this.state[c].splice(i, 1);
    this.touch(rerender);
    return row;
  },
  restore(c, row) { this.state[c].push(row); this.touch(); },
  replaceAll(next) {
    this.state = Object.assign(blankState(), next);
    this.state.settings = Object.assign(blankState().settings, next.settings || {});
    this.touch();
  },
};
DB.save = debounce(() => DB._write(), 320);
