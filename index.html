                    <td class="num">${esc(r.score)}/${esc(r.max)}</td><td class="num">${p === null ? "—" : p + "%"}</td>
                    <td class="num"><button class="btn btn-ghost btn-icon btn-sm" data-act="edit-grade" data-id="${r.id}" aria-label="Edit">${icon("edit")}</button></td></tr>`;

              </div>

        </div>` : `<div class="card-bd tiny dim">No grades recorded for ${esc(s.name.split(" ")[0])} yet.</div>`}

ACT["add-grade"] = () => Forms.grade();
ACT["add-grade-for"] = (el, d) => Forms.grade(null, { studentId: d.id });
ACT["edit-grade"] = (el, d) => Forms.grade(DB.get("grades", d.id));
ACT["toggle-gb"] = (el, d) => {
  const box = document.getElementById("gb-" + d.id);

};

/* ---------- Goals ---------- */
function acGoals() {
  let rows = DB.state.goals.filter(g => !g.studentId || S.inScope(g.studentId));
  if (FILTER.goalScope) rows = rows.filter(g => g.scope === FILTER.goalScope);
  return `

        const color = g.studentId ? S.studentColor(g.studentId) : "var(--brand)";

              </div>
              <button class="btn btn-ghost btn-icon btn-sm" data-act="edit-goal" data-id="${g.id}" aria-label="Edit">${icon("edit")}</button>
            </div>
            <div class="bar-row" style="margin:14px 0 8px">${bar(g.progress, g.target, color)}<span class="val">${p}%</span></div>
            <div class="row">
              <span class="tiny dim tnum">${g.progress || 0} / ${g.target || 0} ${esc(g.unit || "")}</span>
              <div class="spacer"></div>
              <button class="btn btn-sm btn-ghost" data-act="goal-step" data-id="${g.id}" data-n="-1" aria-label="Decrease">−</button>
              <button class="btn btn-sm" data-act="goal-step" data-id="${g.id}" data-n="1">${icon("plus")}Progress</button>

              ${ms.map((m, i) => `<div class="cl-item ${m.done ? "done" : ""}">

      "“Read 30 books this year.” “Finish Book 4A by March.” Simple goals keep the year pointed somewhere.",

ACT["add-goal"] = () => Forms.goal();
ACT["goal-step"] = (el, d) => {
  const g = DB.get("goals", d.id);
  if (!g) return;
  const next = clamp((Number(g.progress) || 0) + Number(d.n), 0, 99999);
  DB.update("goals", g.id, { progress: next });

  const el = e.target.closest('[data-act="goal-ms"]');
  if (!el) return;
  const g = DB.get("goals", el.dataset.id);
  if (!g) return;

/* ===== 71-records.js ===== */
/* ============================================================
   Records — attendance, reading, portfolio, journal, budget
   ============================================================ */
let ATT_MONTH = todayISO().slice(0, 7);

VIEWS.records = (route) => {
  const tab = route.sub || "attendance";
  const inner = ({
    attendance: recAttendance, reading: recReading, portfolio: recPortfolio,
    journal: recJournal, budget: recBudget,
  }[tab] || recAttendance)();
  const [t, l] = PAGE_TITLES.records;
  return pageHead(t, l) + subnavHTML("records", tab) + inner;
};

/* ---------- Attendance ---------- */
function recAttendance() {
  const studs = S.scopeStudents();
  const [yy, mm] = ATT_MONTH.split("-").map(Number);
  const first = new Date(yy, mm - 1, 1);
  const days = new Date(yy, mm, 0).getDate();
  const sy = DB.state.schoolYear;

  const rows = [];
  for (let i = 1; i <= days; i++) {
    const d = new Date(yy, mm - 1, i), dISO = iso(d);
    const school = S.isSchoolDay(dISO);
    const brk = S.breakOn(dISO);
    rows.push(`<tr class="${dISO === todayISO() ? "" : ""}" style="${school ? "" : "opacity:.6"}">
      <td class="nowrap" style="font-weight:${dISO === todayISO() ? 700 : 500}">
        ${DOW_SHORT[d.getDay()]} ${i}${dISO === todayISO() ? ' <span class="chip brand">today</span>' : ""}
        ${brk ? `<div class="tiny dim">${esc(brk.name)}</div>` : ""}
      </td>
      ${studs.map(s => {
        const rec = S.attendanceFor(s.id, dISO);
        const st = rec ? ATT_STATUS.find(x => x.id === rec.status) : null;
        return `<td><button class="chip chip-btn" style="${st ? `background:color-mix(in srgb, ${st.color} 18%, transparent);color:${st.color};border-color:transparent` : ""}"
          data-act="att-pick" data-student="${s.id}" data-date="${dISO}">${st ? esc(st.label) : "—"}</button></td>`;
      }).join("")}
    </tr>`);
  }

  return `
    <div class="section-head"><h2>Attendance</h2>
      <div class="sh-actions">
        <button class="btn btn-sm" data-act="att-month" data-n="-1" aria-label="Previous month">${icon("chev-l")}</button>
        <span class="chip plain" style="min-width:130px;justify-content:center">${MON_LONG[mm - 1]} ${yy}</span>
        <button class="btn btn-sm" data-act="att-month" data-n="1" aria-label="Next month">${icon("chev-r")}</button>
        <button class="btn btn-primary btn-sm" data-act="add-attendance">${icon("plus")}Log a day</button>
      </div></div>

    <div class="grid g-auto" style="margin-bottom:var(--s5)">
      ${studs.map(s => {
        const st = S.attendanceStats(s.id);
        const reqD = sy.requiredDays || 0, reqH = sy.requiredHours || 0;
        return `<div class="card card-pad">
          <div class="row" style="margin-bottom:10px">${avatar(s, "avatar-sm")}<strong>${esc(s.name)}</strong></div>
          <div class="row" style="gap:var(--s5)">
            <div><div class="eyebrow">Days</div><div style="font-family:var(--font-display);font-size:var(--fs-xl)">${st.days}${reqD ? `<span class="dim" style="font-size:var(--fs-sm)">/${reqD}</span>` : ""}</div></div>
            <div><div class="eyebrow">Hours</div><div style="font-family:var(--font-display);font-size:var(--fs-xl)">${fmtHours(st.hours * 60)}${reqH ? `<span class="dim" style="font-size:var(--fs-sm)">/${reqH}</span>` : ""}</div></div>
          </div>
          ${reqD ? `<div style="margin-top:10px">${bar(st.days, reqD, s.color)}</div>` : ""}
        </div>`;
      }).join("")}
    </div>

    ${studs.length ? `<div class="card">
      <div class="card-hd"><h3>${MON_LONG[mm - 1]} ${yy}</h3>
        <div class="hd-actions"><button class="btn btn-sm btn-soft" data-act="att-month-fill">${icon("check")}Fill school days present</button></div>
      </div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Day</th>${studs.map(s => `<th>${esc(s.name.split(" ")[0])}</th>`).join("")}</tr></thead>
          <tbody>${rows.join("")}</tbody>
        </table>
      </div>
    </div>` : emptyState("users", "Add a student first", "Attendance is tracked per child.", "Add student", 'data-act="add-student"')}

    <div class="callout" style="margin-top:var(--s5)">${icon("info")}
      <div><strong>Your requirements, your rules.</strong> Set the day and hour targets that apply to you in
      <button class="btn btn-sm btn-ghost" data-act="goto" data-path="settings/year" style="padding:0 4px;min-height:auto">School Year settings</button>.
      Homeschool regulations vary by country, state and district — this planner keeps the records you ask it to keep and is not legal or compliance advice.</div>
    </div>
  `;
}
ACT["att-month"] = (el, d) => {
  const [y, m] = ATT_MONTH.split("-").map(Number);
  const nd = new Date(y, m - 1 + Number(d.n), 1);
  ATT_MONTH = `${nd.getFullYear()}-${String(nd.getMonth() + 1).padStart(2, "0")}`;
  scheduleRender();
};
ACT["att-pick"] = (el, d) => {
  const rec = S.attendanceFor(d.student, d.date);
  contextMenu(el, [
    { label: `${S.studentName(d.student)} · ${fmtDate(d.date, "short")}`, header: true },
    ...ATT_STATUS.map(s => ({
      label: (rec && rec.status === s.id ? "✓ " : "") + s.label,
      run: () => {
        if (rec) DB.update("attendance", rec.id, { status: s.id });
        else DB.add("attendance", { studentId: d.student, date: d.date, status: s.id, hours: DB.state.settings.hoursPerDay });
      }
    })),
    ...(rec ? [{ sep: true }, { label: "Edit hours & notes", icon: "edit", run: () => Forms.attendance(rec) },
      { label: "Clear", icon: "x", danger: true, run: () => DB.remove("attendance", rec.id) }] : []),
  ]);
};
ACT["add-attendance"] = () => Forms.attendance();
ACT["att-month-fill"] = () => {
  const [yy, mm] = ATT_MONTH.split("-").map(Number);
  const days = new Date(yy, mm, 0).getDate();
  const studs = S.scopeStudents();
  let n = 0;
  for (let i = 1; i <= days; i++) {
    const dISO = iso(new Date(yy, mm - 1, i));
    if (!S.isSchoolDay(dISO)) continue;
    if (dISO > todayISO()) continue;
    studs.forEach(s => {
      if (!S.attendanceFor(s.id, dISO)) {
        DB.state.attendance.push({ id: uid("a"), studentId: s.id, date: dISO, status: "present", hours: DB.state.settings.hoursPerDay });
        n++;
      }
    });
  }
  DB.touch();
  toast(n ? `${plural(n, "day")} marked present` : "Nothing left to fill", { icon: "check" });
};

/* ---------- Reading ---------- */
function recReading() {
  let rows = DB.state.reading.filter(b => S.inScope(b.studentId));
  const finished = rows.filter(b => b.finished);
  if (FILTERS.reading === "reading") rows = rows.filter(b => !b.finished);
  else if (FILTERS.reading === "finished") rows = rows.filter(b => b.finished);
  else if (FILTERS.reading === "fav") rows = rows.filter(b => b.favorite);
  rows = sortBy(rows, "-finished", "-started");
  const pages = sum(finished, b => b.pages);
  const readingGoals = DB.state.goals.filter(g => /book|read|page/i.test(g.title) && (!g.studentId || S.inScope(g.studentId)));

  return `
    <div class="section-head"><h2>Reading log</h2>
      <div class="sh-actions"><button class="btn btn-primary" data-act="add-reading">${icon("plus")}Add book</button></div></div>

    <div class="grid g4" style="margin-bottom:var(--s5)">
      <div class="stat"><span class="k">Finished</span><span class="v">${finished.length}</span><span class="m">books this year</span></div>
      <div class="stat"><span class="k">In progress</span><span class="v">${DB.state.reading.filter(b => !b.finished && S.inScope(b.studentId)).length}</span><span class="m">on the go</span></div>
      <div class="stat"><span class="k">Pages</span><span class="v">${pages.toLocaleString()}</span><span class="m">read</span></div>
      <div class="stat"><span class="k">Favourites</span><span class="v">${DB.state.reading.filter(b => b.favorite && S.inScope(b.studentId)).length}</span><span class="m">loved books</span></div>
    </div>

    ${readingGoals.length ? `<div class="card card-pad" style="margin-bottom:var(--s5)">
      ${readingGoals.map(g => `<div style="padding:5px 0">
        <div class="row"><strong style="flex:1 1 auto">${esc(g.title)}</strong><span class="tiny dim tnum">${g.progress || 0}/${g.target}</span></div>
        <div style="margin-top:6px">${bar(g.progress, g.target, g.studentId ? S.studentColor(g.studentId) : "var(--brand)")}</div>
      </div>`).join("")}
    </div>` : ""}

    ${filterBar(`<div class="pill-tabs">
      ${[["all", "All"], ["reading", "Reading now"], ["finished", "Finished"], ["fav", "Favourites"]]
        .map(([v, l]) => `<button class="pill-tab ${FILTERS.reading === v ? "is-active" : ""}" data-act="set-filter" data-k="reading" data-v="${v}">${l}</button>`).join("")}
    </div>`)}

    <div class="card">
      ${rows.length ? rows.map(b => {
        const s = S.student(b.studentId);
        return `<div class="book">
          <div class="book-spine" style="--c:${s ? s.color : "var(--brand)"}">${esc((b.title || "").slice(0, 18))}</div>
          <div style="flex:1 1 auto;min-width:0;cursor:pointer" data-act="edit-reading" data-id="${b.id}">
            <div class="row" style="gap:7px"><span style="font-weight:650" class="ellip">${esc(b.title)}</span>${b.favorite ? `<span style="color:var(--bad-ink)">${icon("heart")}</span>` : ""}</div>
            <div class="tiny dim ellip">${esc([b.author, s ? s.name : "", b.pages ? `${b.pages} pages` : ""].filter(Boolean).join(" · "))}</div>
            <div class="row" style="gap:10px;margin-top:4px">
              ${b.rating ? stars(b.rating) : ""}
              <span class="tiny dim">${b.finished ? `Finished ${esc(fmtDate(b.finished, "short"))}` : b.started ? `Started ${esc(fmtDate(b.started, "short"))}` : ""}</span>
            </div>
          </div>
          <div class="l-act">
            ${!b.finished ? `<button class="btn btn-sm btn-soft" data-act="book-finish" data-id="${b.id}">${icon("check")}Finished</button>` : ""}
            <button class="btn btn-ghost btn-icon btn-sm" data-act="edit-reading" data-id="${b.id}" aria-label="Edit">${icon("edit")}</button>
          </div>
        </div>`;
      }).join("") : emptyState("book", "No books logged yet",
        "Every book read — aloud, alone or on audio — builds a lovely record of the year.",
        "Add the first book", 'data-act="add-reading"')}
    </div>`;
}
ACT["add-reading"] = () => Forms.reading();
ACT["edit-reading"] = (el, d) => Forms.reading(DB.get("reading", d.id));
ACT["book-finish"] = (el, d) => {
  DB.update("reading", d.id, { finished: todayISO() });
  const b = DB.get("reading", d.id);
  DB.state.goals.filter(g => /book/i.test(g.title) && (!g.studentId || g.studentId === b.studentId))
    .forEach(g => g.progress = (Number(g.progress) || 0) + 1);
  DB.touch();
  toast("Book finished — added to the log", { icon: "check" });
};
ACT["set-filter"] = (el, d) => { FILTERS[d.k] = d.v; scheduleRender(); };

/* ---------- Portfolio ---------- */
function galItem(p) {
  const file = (p.files || [])[0];
  const th = file ? Blobs.thumb(file.id) : null;
  return `<div class="gal-item" data-act="open-portfolio" data-id="${p.id}">
    <div class="gal-thumb">${th ? `<img src="${th}" alt="${attr(p.title)}" loading="lazy">` : icon(file ? "file-text" : "image")}</div>
    <div class="gal-meta">
      <div class="t">${esc(p.title)}</div>
      <div class="m">${esc([fmtDate(p.date, "short"), S.subject(p.subjectId) ? S.subjectName(p.subjectId) : ""].filter(Boolean).join(" · "))}</div>
    </div>
  </div>`;
}

function recPortfolio() {
  let rows = DB.state.portfolio.filter(p => S.inScope(p.studentId));
  if (FILTERS.portfolioSubject) rows = rows.filter(p => p.subjectId === FILTERS.portfolioSubject);

  return `

ACT["add-portfolio"] = () => Forms.portfolio();
ACT["open-portfolio"] = async (el, d) => {
  const p = DB.get("portfolio", d.id);
  if (!p) return;
  const files = p.files || [];
  const ctl = openModal({
    title: p.title, subtitle: [fmtDate(p.date, "long"), S.studentName(p.studentId), S.subject(p.subjectId) ? S.subjectName(p.subjectId) : ""].filter(Boolean).join(" · "),
    size: "modal-lg",
    body: `<div id="pf-body" class="col">
        ${files.length ? `<div class="col" id="pf-files"><div class="tiny dim">Loading…</div></div>` : ""}
        ${p.description ? `<p>${esc(p.description)}</p>` : ""}
        ${(p.tags || []).length ? `<div class="row row-wrap">${p.tags.map(t => `<span class="chip">${icon("tag")}${esc(t)}</span>`).join("")}</div>` : ""}
      </div>`,
    footer: `<button class="btn btn-danger btn-sm" data-pf-del>${icon("trash")}Delete</button><div class="spacer"></div>
      <button class="btn" data-pf-edit>${icon("edit")}Edit</button>`,
    onMount(c) {
      c.modal.querySelector("[data-pf-edit]").onclick = () => { c.close(); Forms.portfolio(p); };
      c.modal.querySelector("[data-pf-del]").onclick = () => {
        c.close();
        confirmDialog({
          title: "Delete this work sample?", danger: true, confirmLabel: "Delete",
          body: "The attached files will be removed from this device too.",
          onConfirm() { files.forEach(f => Blobs.del(f.id)); DB.remove("portfolio", p.id); toast("Deleted"); }
        });
      };
    }
  });
  if (files.length) {
    const box = $("#pf-files", ctl.modal);
    const parts = [];
    for (const f of files) {
      const data = await Blobs.get(f.id);
      if (data && /^data:image\//.test(data)) parts.push(`<img src="${data}" alt="${attr(f.name)}" style="border-radius:var(--r-md);border:1px solid var(--line)">`);
      else if (data && /^data:application\/pdf/.test(data)) parts.push(`<a class="btn" href="${data}" target="_blank" rel="noopener">${icon("file-text")}Open ${esc(f.name)}</a>`);
      else parts.push(`<span class="chip">${icon("paperclip")}${esc(f.name)}</span>`);
    }
    box.innerHTML = parts.join("");
  }
};

/* ---------- Budget ---------- */
function recBudget() {
  const cur = DB.state.settings.currency;
  let rows = DB.state.expenses.filter(e => !e.studentId || S.inScope(e.studentId));
  if (FILTERS.expenseCat) rows = rows.filter(e => e.category === FILTERS.expenseCat);
  rows = sortBy(rows, "-date");
  const all = DB.state.expenses.filter(e => !e.studentId || S.inScope(e.studentId));
  const total = sum(all, e => e.amount);
  const byCat = EXPENSE_CATS.map(c => ({ cat: c, amt: sum(all.filter(e => e.category === c), e => e.amount) })).filter(x => x.amt > 0);
  const byStu = S.students().map(s => ({ s, amt: sum(all.filter(e => e.studentId === s.id), e => e.amount) })).filter(x => x.amt > 0);
  const maxCat = Math.max(1, ...byCat.map(c => c.amt));

  return `
    <div class="section-head"><h2>Homeschool budget</h2>
      <div class="sh-actions"><button class="btn btn-primary" data-act="add-expense">${icon("plus")}Add expense</button></div></div>

    <div class="grid g3" style="margin-bottom:var(--s5)">
      <div class="stat"><span class="k">Total spent</span><span class="v">${esc(fmtMoney(total, cur))}</span><span class="m">${plural(all.length, "entry", "entries")}</span></div>
      <div class="stat"><span class="k">Curriculum</span><span class="v">${esc(fmtMoney(sum(all.filter(e => e.category === "Curriculum"), e => e.amount), cur))}</span><span class="m">largest category is ${esc((byCat.sort((a, b) => b.amt - a.amt)[0] || {}).cat || "—")}</span></div>
      <div class="stat"><span class="k">Per student</span><span class="v">${esc(fmtMoney(S.students().length ? total / S.students().length : 0, cur))}</span><span class="m">average across ${plural(S.students().length, "child", "children")}</span></div>
    </div>

    ${byCat.length ? `<div class="grid g2" style="margin-bottom:var(--s5);align-items:start">
      <div class="card"><div class="card-hd"><h3>By category</h3></div><div class="card-bd">
        ${byCat.map(c => `<div style="padding:6px 0">
          <div class="row"><span style="flex:1 1 auto">${esc(c.cat)}</span><span class="tnum" style="font-weight:600">${esc(fmtMoney(c.amt, cur))}</span></div>
          <div style="margin-top:5px">${bar(c.amt, maxCat, "var(--brand)")}</div>
        </div>`).join("")}
      </div></div>
      ${byStu.length ? `<div class="card"><div class="card-hd"><h3>By student</h3></div><div class="card-bd">
        ${byStu.map(x => `<div style="padding:6px 0">
          <div class="row">${avatar(x.s, "avatar-xs")}<span style="flex:1 1 auto">${esc(x.s.name)}</span><span class="tnum" style="font-weight:600">${esc(fmtMoney(x.amt, cur))}</span></div>
          <div style="margin-top:5px">${bar(x.amt, Math.max(1, ...byStu.map(y => y.amt)), x.s.color)}</div>
        </div>`).join("")}
      </div></div>` : ""}
    </div>` : ""}

    ${filterBar(selectFilter("filter-generic", FILTERS.expenseCat, [{ value: "", label: "All categories" },
      ...EXPENSE_CATS.map(c => ({ value: c, label: c }))], "Filter by category").replace("data-act=", 'data-k="expenseCat" data-act='))}

    <div class="card">
      ${rows.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Student</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody>${rows.map(e => `<tr>
          <td>${esc(fmtDate(e.date, "short"))}</td>
          <td class="wrap">${esc(e.description)}</td>
          <td>${esc(e.category || "")}</td>
          <td>${e.studentId ? esc(S.studentName(e.studentId)) : "<span class='dim'>Family</span>"}</td>
          <td class="num">${esc(fmtMoney(e.amount, cur))}</td>
          <td class="num"><button class="btn btn-ghost btn-icon btn-sm" data-act="edit-expense" data-id="${e.id}" aria-label="Edit">${icon("edit")}</button></td>
        </tr>`).join("")}</tbody>
        <tfoot><tr><th colspan="4">Total</th><th class="num">${esc(fmtMoney(sum(rows, e => e.amount), cur))}</th><th></th></tr></tfoot>
      </table></div>`
        : emptyState("wallet", "No expenses recorded",
          "Curriculum, books, supplies, activities — a light record now makes tax time and next year's planning much easier.",
          "Add the first expense", 'data-act="add-expense"')}
    </div>`;
}

/* ---------- Field trips ---------- */
function acTrips() {
  const t = todayISO();
  const all = DB.state.trips.filter(x => S.scope() === "all" || !x.studentIds || !x.studentIds.length || x.studentIds.includes(S.scope()));
  const upcoming = sortBy(all.filter(x => x.date >= t), "date");
  const past = sortBy(all.filter(x => x.date < t), "-date");

  const card = x => {
    const list = x.checklist || [];
    const doneN = list.filter(i => i.done).length;
    return `<div class="card">
      <div class="card-bd">
        <div class="row" style="align-items:flex-start;margin-bottom:8px">
          <span class="avatar" style="--tint:var(--info);background:var(--info-soft);color:var(--info)">${icon("bus")}</span>
          <div style="flex:1 1 auto;min-width:0">
            <div style="font-weight:650;font-size:var(--fs-md)" class="ellip">${esc(x.title)}</div>
            <div class="tiny dim">${esc(fmtDate(x.date, "dow"))}${x.time ? " · " + esc(fmtTime(x.time)) : ""}</div>
          </div>
          <button class="btn btn-ghost btn-icon btn-sm" data-act="edit-trip" data-id="${x.id}" aria-label="Edit">${icon("edit")}</button>
        </div>
        ${x.objectives ? `<p class="tiny" style="color:var(--text-2)">${esc(x.objectives)}</p>` : ""}
        <div class="row row-wrap" style="gap:6px;margin:8px 0">
          ${(x.studentIds || []).map(id => { const s = S.student(id); return s ? avatar(s, "avatar-xs") : ""; }).join("")}
          ${x.cost ? `<span class="chip">${esc(fmtMoney(x.cost, DB.state.settings.currency))}</span>` : ""}
          ${x.transport ? `<span class="chip">${esc(x.transport)}</span>` : ""}
        </div>
        ${list.length ? `<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px">
          <div class="row tiny dim" style="margin-bottom:4px"><span>Checklist</span><div class="spacer"></div><span>${doneN}/${list.length}</span></div>
          ${list.map((i, idx) => `<div class="cl-item ${i.done ? "done" : ""}">
            <input type="checkbox" ${i.done ? "checked" : ""} data-act="trip-check" data-id="${x.id}" data-i="${idx}" aria-label="${attr(i.text)}">
            <span>${esc(i.text)}</span></div>`).join("")}
        </div>` : ""}
        ${x.followUp ? `<div class="card-int" style="margin-top:10px"><div class="eyebrow">Follow-up</div><div class="tiny">${esc(x.followUp)}</div></div>` : ""}
      </div>
    </div>`;
  };

  return `
    <div class="section-head"><h2>Field trips</h2>
      <div class="sh-actions"><button class="btn btn-primary" data-act="add-trip">${icon("plus")}Plan a trip</button></div></div>
    ${all.length ? `
      ${upcoming.length ? `<div class="grid g-auto-lg" style="margin-bottom:var(--s6)">${upcoming.map(card).join("")}</div>` : ""}
      ${past.length ? `<div class="section-head"><h2>Been there</h2></div>
        <div class="grid g-auto-lg">${past.map(card).join("")}</div>` : ""}`
      : emptyState("bus", "No field trips planned",
        "Museums, farms, factories, forests. Plan the objectives and packing list once and the day runs itself.",
        "Plan your first trip", 'data-act="add-trip"')}`;
}
ACT["add-trip"] = () => Forms.trip();
document.addEventListener("change", e => {
  const el = e.target.closest('[data-act="trip-check"]');
  if (!el) return;
  const x = DB.get("trips", el.dataset.id);
  if (!x) return;
  x.checklist[+el.dataset.i].done = el.checked;

ACT["edit-activity"] = (el, d) => Forms.activity(DB.get("activities", d.id));

      </div>`).join("")}
    </div>` : emptyState("library", RES_Q || FILTERS.resourceType ? "Nothing matches" : "Your library is empty",
      RES_Q || FILTERS.resourceType ? "Try a different search or filter." : "Save the websites, videos, books and printables you keep coming back to — with your own notes attached.",
      "Save your first resource", 'data-act="add-resource"')}

    <div class="callout" style="margin-top:var(--s5)">${icon("info")}
      <div><strong>Saved information vs. files.</strong> Titles, notes and tags are stored on this device and work offline.
      Links point out to the internet, so opening one needs a connection. For anything you must have offline, keep the file itself on your computer and note where it lives.</div></div>
  `;
};
ACT["add-resource"] = () => Forms.resource();
ACT["edit-resource"] = (el, d) => Forms.resource(DB.get("resources", d.id));
ACT["res-fav"] = (el, d, e) => {
  e.stopPropagation();
  const r = DB.get("resources", d.id);
  DB.update("resources", r.id, { favorite: !r.favorite });
};
document.addEventListener("input", e => {
  const el = e.target.closest('[data-act="res-search"]');
  if (!el) return;
  RES_Q = el.value;
  const pos = el.selectionStart;
  scheduleRender();
  requestAnimationFrame(() => {
    const again = $('[data-act="res-search"]');
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  });
});


/* ===== 81-reports.js ===== */
/* ============================================================
   Reports — printable records
   ============================================================ */
const REP = {
  type: "progress",
  studentId: "",
  from: "",
  to: "",
};

const REPORT_TYPES = [
  { id: "progress", label: "Progress report", desc: "Subjects, completion, grades and goals", icon: "trend" },
  { id: "card", label: "Report card", desc: "Formal grades with signature lines", icon: "award" },
  { id: "attendance", label: "Attendance summary", desc: "Days, hours and monthly totals", icon: "check-circle" },
  { id: "subject", label: "Subject summary", desc: "Lessons taught in each subject", icon: "layers" },
  { id: "student", label: "Student summary", desc: "One page covering everything", icon: "user" },
  { id: "reading", label: "Reading report", desc: "Every book read, with ratings", icon: "book" },
  { id: "portfolio", label: "Portfolio summary", desc: "Work samples with dates and notes", icon: "image" },
];

VIEWS.reports = () => {
  if (!REP.from) { REP.from = DB.state.schoolYear.start; REP.to = DB.state.schoolYear.end; }
  if (!REP.studentId || !S.student(REP.studentId)) REP.studentId = (S.students()[0] || {}).id || "";
  const needsStudent = REP.type !== "subject";

  return `
    ${pageHead("Reports", "Professional, printable records — ready for your files, a portfolio review or a curious grandparent.",
      `<button class="btn btn-primary no-print" data-act="print-report">${icon("printer")}Print / Save as PDF</button>`)}

    <div class="rep-pick no-print" style="margin-bottom:var(--s5)">
      ${REPORT_TYPES.map(r => `<button class="rep-card ${REP.type === r.id ? "is-on" : ""}" data-act="rep-type" data-v="${r.id}">
        <span class="ic">${icon(r.icon)}</span>
        <span><span class="t">${esc(r.label)}</span><span class="d">${esc(r.desc)}</span></span>
      </button>`).join("")}
    </div>

    <div class="card card-pad no-print" style="margin-bottom:var(--s5)">
      <div class="row row-wrap" style="gap:var(--s4)">
        ${needsStudent ? `<div class="field" style="min-width:200px"><label for="rep-stu">Student</label>
          <select class="sel" id="rep-stu" data-act="rep-student">
            ${S.students().map(s => `<option value="${s.id}" ${REP.studentId === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}
          </select></div>` : ""}
        <div class="field" style="min-width:150px"><label for="rep-from">From</label>
          <input class="inp" type="date" id="rep-from" value="${attr(REP.from)}" data-act="rep-from"></div>
        <div class="field" style="min-width:150px"><label for="rep-to">To</label>
          <input class="inp" type="date" id="rep-to" value="${attr(REP.to)}" data-act="rep-to"></div>
        <div class="field" style="justify-content:flex-end">
          <button class="btn" data-act="rep-range" data-v="year">School year</button>
        </div>
      </div>
    </div>

    <div id="report-doc">${renderReport()}</div>
  `;
};

function docShell(title, subtitle, inner) {
  const f = DB.state.family.name ? DB.state.family.name + (/family$/i.test(DB.state.family.name) ? "" : " Family") : "Home School";
  return `<div class="doc">
    <div class="doc-hd">
      <div class="dh-main">
        <h1>${esc(title)}</h1>
        <div class="sub">${esc(subtitle)}</div>
      </div>
      <div class="fam">
        <strong>${esc(f)}</strong><br>
        ${esc(DB.state.schoolYear.name)}<br>
        Generated ${esc(fmtDate(todayISO(), "med"))}
      </div>
    </div>
    ${inner}
    <div class="doc-ft">Prepared with ${esc(APP.name)}. Records are maintained by the parent/guardian named above. Homeschool requirements vary by location; this document is a record of work completed, not a statement of legal compliance.</div>
  </div>`;
}

function inRange(d) { return d && d >= REP.from && d <= REP.to; }

function renderReport() {
  const s = S.student(REP.studentId);
  const range = `${fmtDate(REP.from, "med")} – ${fmtDate(REP.to, "med")}`;
  if (REP.type !== "subject" && !s) {
    return `<div class="card card-pad">${emptyState("users", "Add a student first", "Reports are generated per child.", "Add student", 'data-act="add-student"')}</div>`;
  }
  switch (REP.type) {
    case "progress": return repProgress(s, range);
    case "card": return repCard(s, range);
    case "attendance": return repAttendance(s, range);
    case "subject": return repSubject(range);
    case "student": return repStudent(s, range);
    case "reading": return repReading(s, range);
    case "portfolio": return repPortfolio(s, range);
    default: return "";
  }
}

function kv(pairs) {
  return `<div class="kv">${pairs.map(([k, v]) => `<div><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`).join("")}</div>`;
}

function repProgress(s, range) {
  const lessons = DB.state.lessons.filter(l => l.studentId === s.id && inRange(l.date));
  const done = lessons.filter(l => l.status === "complete");
  const att = S.attendanceStats(s.id, REP.from, REP.to);
  const subs = DB.state.subjects.filter(sub => lessons.some(l => l.subjectId === sub.id));
  const goals = DB.state.goals.filter(g => g.studentId === s.id);
  const grading = DB.state.settings.grading;
  return docShell("Progress Report", `${s.name}${s.grade ? " · " + s.grade : ""} · ${range}`, `
    <section>${kv([
      ["Lessons completed", `${done.length} / ${lessons.length}`],
      ["Completion", `${pct(done.length, lessons.length)}%`],
      ["Days attended", att.days],
      ["Instructional hours", fmtHours(att.hours * 60)],
    ])}</section>

    <section>
      <h2>Progress by subject</h2>
      <table><thead><tr><th>Subject</th><th class="num">Lessons</th><th class="num">Complete</th><th class="num">%</th>${grading ? '<th class="num">Grade</th>' : ""}</tr></thead>
      <tbody>${subs.map(sub => {
        const ls = lessons.filter(l => l.subjectId === sub.id);
        const dn = ls.filter(l => l.status === "complete").length;
        const g = grading ? S.subjectGrade(s.id, sub.id) : null;
        return `<tr><td>${esc(sub.name)}</td><td class="num">${ls.length}</td><td class="num">${dn}</td><td class="num">${pct(dn, ls.length)}%</td>
          ${grading ? `<td class="num">${g === null ? "—" : g + "% (" + S.gradeLetter(g) + ")"}</td>` : ""}</tr>`;
      }).join("") + (() => {
        const none = lessons.filter(l => !S.subject(l.subjectId));
        if (!none.length) return "";
        return `<tr><td><em>No subject assigned</em></td><td class="num">${none.length}</td>
          <td class="num">${none.filter(l => l.status === "complete").length}</td>
          <td class="num">${pct(none.filter(l => l.status === "complete").length, none.length)}%</td>${grading ? '<td class="num">—</td>' : ""}</tr>`;
      })() || `<tr><td colspan="5">No lessons recorded in this period.</td></tr>`}</tbody></table>
    </section>

    ${goals.length ? `<section><h2>Goals</h2>
      <table><thead><tr><th>Goal</th><th>Timeframe</th><th class="num">Progress</th></tr></thead>
      <tbody>${goals.map(g => `<tr><td>${esc(g.title)}</td><td>${esc(g.scope || "")}</td>
        <td class="num">${g.progress || 0} / ${g.target || 0} ${esc(g.unit || "")} (${pct(g.progress, g.target)}%)</td></tr>`).join("")}</tbody></table>
    </section>` : ""}

    ${(() => {
      const notes = DB.state.journal.filter(j => inRange(j.date) && (!j.studentId || j.studentId === s.id) && (j.wentWell || j.next)).slice(-3);
      return notes.length ? `<section><h2>Teacher observations</h2>
        ${notes.map(j => `<p><strong>${esc(fmtDate(j.date, "med"))} — </strong>${esc([j.wentWell, j.next].filter(Boolean).join(" "))}</p>`).join("")}
      </section>` : "";
    })()}

    <div class="sig"><div>Parent / Teacher signature</div><div>Date</div></div>
  `);
}

function repCard(s, range) {
  const subs = DB.state.subjects.filter(sub => DB.state.grades.some(g => g.studentId === s.id && g.subjectId === sub.id));
  const avg = S.studentAverage(s.id);
  if (!DB.state.settings.grading) {
    return docShell("Report Card", `${s.name} · ${range}`, `<section><p>Grading is currently switched off for this family. Turn it on in Settings → Grading to produce a report card, or use the Progress Report instead — many homeschools prefer it.</p></section>`);
  }
  return docShell("Report Card", `${s.name}${s.grade ? " · " + s.grade : ""} · ${range}`, `
    <section>${kv([
      ["Student", esc(s.name)], ["Grade level", esc(s.grade || "—")],
      ["Overall average", avg === null ? "—" : `${avg}% (${S.gradeLetter(avg)})`],
      ["Days attended", S.attendanceStats(s.id, REP.from, REP.to).days],
    ])}</section>
    <section>
      <h2>Grades</h2>
      <table><thead><tr><th>Subject</th><th class="num">Assessments</th><th class="num">Percent</th><th class="num">Letter</th></tr></thead>
      <tbody>${subs.map(sub => {
        const rows = DB.state.grades.filter(g => g.studentId === s.id && g.subjectId === sub.id);
        const g = S.subjectGrade(s.id, sub.id);
        return `<tr><td>${esc(sub.name)}</td><td class="num">${rows.length}</td>
          <td class="num">${g === null ? "—" : g + "%"}</td><td class="num"><strong>${g === null ? "—" : S.gradeLetter(g)}</strong></td></tr>`;
      }).join("") || `<tr><td colspan="4">No grades recorded.</td></tr>`}</tbody></table>
    </section>
    <section><h2>Grading scale</h2>
      <p>${esc(DB.state.gradeScale.map(g => `${g.letter} ≥ ${g.min}%`).join(" · "))}</p>
      <p style="font-size:11px;color:#6a6255">Weighted by category: ${esc(DB.state.gradeCategories.map(c => `${c.name} ${c.weight}%`).join(", "))}.</p>
    </section>
    <div class="sig"><div>Parent / Teacher signature</div><div>Date</div></div>
  `);
}

function repAttendance(s, range) {
  const sy = DB.state.schoolYear;
  const rows = DB.state.attendance.filter(a => a.studentId === s.id && inRange(a.date));
  const counting = rows.filter(r => (ATT_STATUS.find(x => x.id === r.status) || {}).counts);
  const hours = sum(counting, r => (r.hours ? r.hours : DB.state.settings.hoursPerDay));
  const byMonth = groupBy(sortBy(rows, "date"), r => r.date.slice(0, 7));
  const byStatus = ATT_STATUS.map(st => ({ st, n: rows.filter(r => r.status === st.id).length })).filter(x => x.n);

  return docShell("Attendance Summary", `${s.name} · ${range}`, `
    <section>${kv([
      ["Days attended", counting.length],
      ["Instructional hours", fmtHours(hours * 60)],
      ["Required days", sy.requiredDays || "Not set"],
      ["Required hours", sy.requiredHours || "Not set"],
    ])}</section>
    ${sy.requiredDays ? `<section><h2>Toward your target</h2>
      <div class="bar bar-lg"><i style="width:${Math.min(100, pct(counting.length, sy.requiredDays))}%"></i></div>
      <p style="margin-top:6px">${counting.length} of ${sy.requiredDays} days (${pct(counting.length, sy.requiredDays)}%).
      ${counting.length >= sy.requiredDays ? "Target met." : `${sy.requiredDays - counting.length} days remaining.`}</p></section>` : ""}
    <section><h2>By month</h2>
      <table><thead><tr><th>Month</th><th class="num">Days attended</th><th class="num">Hours</th></tr></thead>
      <tbody>${[...byMonth.entries()].map(([m, list]) => {
        const c = list.filter(r => (ATT_STATUS.find(x => x.id === r.status) || {}).counts);
        return `<tr><td>${esc(MON_LONG[Number(m.slice(5, 7)) - 1])} ${esc(m.slice(0, 4))}</td>
          <td class="num">${c.length}</td><td class="num">${fmtHours(sum(c, r => (r.hours || DB.state.settings.hoursPerDay)) * 60)}</td></tr>`;
      }).join("") || `<tr><td colspan="3">No attendance recorded in this period.</td></tr>`}</tbody></table>
    </section>
    ${byStatus.length ? `<section><h2>By status</h2>
      <table><thead><tr><th>Status</th><th class="num">Days</th></tr></thead>
      <tbody>${byStatus.map(x => `<tr><td>${esc(x.st.label)}</td><td class="num">${x.n}</td></tr>`).join("")}</tbody></table></section>` : ""}
    <div class="sig"><div>Parent / Teacher signature</div><div>Date</div></div>
  `);
}

function repSubject(range) {
  const subs = DB.state.subjects;
  return docShell("Subject Summary", `All students · ${range}`, `
    ${subs.map(sub => {
      const ls = DB.state.lessons.filter(l => l.subjectId === sub.id && inRange(l.date));
      if (!ls.length) return "";
      const done = ls.filter(l => l.status === "complete");
      const curr = DB.state.curricula.filter(c => c.subjectId === sub.id);
      return `<section>
        <h2>${esc(sub.name)}</h2>
        <p>${done.length} of ${ls.length} lessons completed (${pct(done.length, ls.length)}%).
        ${curr.length ? `Curriculum: ${curr.map(c => `${esc(c.name)} — ${pct(c.completedUnits, c.totalUnits)}%`).join("; ")}.` : ""}</p>
        <table><thead><tr><th>Date</th><th>Lesson</th><th>Student</th><th>Status</th></tr></thead>
        <tbody>${sortBy(ls, "date").slice(0, 60).map(l => `<tr><td>${esc(fmtDate(l.date, "short"))}</td><td>${esc(l.title)}</td>
          <td>${esc(S.studentName(l.studentId))}</td><td>${esc((LESSON_STATUS.find(x => x.id === l.status) || {}).label || "")}</td></tr>`).join("")}</tbody></table>
        ${ls.length > 60 ? `<p style="font-size:11px;color:#6a6255">Showing the first 60 of ${ls.length} lessons.</p>` : ""}
      </section>`;
    }).join("") || `<section><p>No lessons recorded in this period.</p></section>`}
  `);
}

function repStudent(s, range) {
  const lessons = DB.state.lessons.filter(l => l.studentId === s.id && inRange(l.date));
  const done = lessons.filter(l => l.status === "complete").length;
  const att = S.attendanceStats(s.id, REP.from, REP.to);
  const books = DB.state.reading.filter(b => b.studentId === s.id && (inRange(b.finished) || inRange(b.started)));
  const port = DB.state.portfolio.filter(p => p.studentId === s.id && inRange(p.date));
  const trips = DB.state.trips.filter(t => (t.studentIds || []).includes(s.id) && inRange(t.date));
  const acts = DB.state.activities.filter(a => a.studentId === s.id);
  const goals = DB.state.goals.filter(g => g.studentId === s.id);
  return docShell("Student Summary", `${s.name}${s.grade ? " · " + s.grade : ""} · ${range}`, `
    <section>${kv([
      ["Lessons completed", `${done} / ${lessons.length}`],
      ["Days attended", att.days],
      ["Hours", fmtHours(att.hours * 60)],
      ["Books read", books.filter(b => b.finished).length],
      ["Work samples", port.length],
      ["Field trips", trips.length],
    ])}</section>
    <section><h2>Subjects studied</h2>
      <table><thead><tr><th>Subject</th><th class="num">Lessons</th><th class="num">Complete</th>${DB.state.settings.grading ? '<th class="num">Grade</th>' : ""}</tr></thead>
      <tbody>${DB.state.subjects.filter(sub => lessons.some(l => l.subjectId === sub.id)).map(sub => {
        const ls = lessons.filter(l => l.subjectId === sub.id);
        const g = DB.state.settings.grading ? S.subjectGrade(s.id, sub.id) : null;
        return `<tr><td>${esc(sub.name)}</td><td class="num">${ls.length}</td><td class="num">${ls.filter(l => l.status === "complete").length}</td>
          ${DB.state.settings.grading ? `<td class="num">${g === null ? "—" : g + "%"}</td>` : ""}</tr>`;
      }).join("") + (() => {
        const none = lessons.filter(l => !S.subject(l.subjectId));
        if (!none.length) return "";
        return `<tr><td><em>No subject assigned</em></td><td class="num">${none.length}</td>
          <td class="num">${none.filter(l => l.status === "complete").length}</td>${DB.state.settings.grading ? '<td class="num">—</td>' : ""}</tr>`;
      })() || `<tr><td colspan="4">No lessons recorded.</td></tr>`}</tbody></table></section>
    ${goals.length ? `<section><h2>Goals</h2><ul>${goals.map(g => `<li>${esc(g.title)} — ${g.progress || 0}/${g.target || 0} ${esc(g.unit || "")}</li>`).join("")}</ul></section>` : ""}
    ${acts.length ? `<section><h2>Extracurricular activities</h2><ul>${acts.map(a => `<li>${esc(a.name)}${a.schedule ? ` (${esc(a.schedule)})` : ""}${a.hours ? ` — ${a.hours} hours` : ""}</li>`).join("")}</ul></section>` : ""}
    ${trips.length ? `<section><h2>Field trips</h2><ul>${trips.map(t => `<li>${esc(fmtDate(t.date, "med"))} — ${esc(t.title)}${t.objectives ? `: ${esc(t.objectives)}` : ""}</li>`).join("")}</ul></section>` : ""}
    <div class="sig"><div>Parent / Teacher signature</div><div>Date</div></div>
  `);
}

function repReading(s, range) {
  const rows = sortBy(DB.state.reading.filter(b => b.studentId === s.id && (inRange(b.finished) || inRange(b.started))), "finished");
  const fin = rows.filter(b => b.finished);
  return docShell("Reading Report", `${s.name} · ${range}`, `
    <section>${kv([
      ["Books finished", fin.length],
      ["In progress", rows.length - fin.length],
      ["Pages read", sum(fin, b => b.pages).toLocaleString()],
      ["Average rating", fin.filter(b => b.rating).length ? (sum(fin.filter(b => b.rating), b => b.rating) / fin.filter(b => b.rating).length).toFixed(1) + " / 5" : "—"],
    ])}</section>
    <section><h2>Books</h2>
      <table><thead><tr><th>Title</th><th>Author</th><th>Started</th><th>Finished</th><th class="num">Pages</th><th class="num">Rating</th></tr></thead>
      <tbody>${rows.map(b => `<tr><td>${esc(b.title)}${b.favorite ? " ★" : ""}</td><td>${esc(b.author || "")}</td>
        <td>${esc(b.started ? fmtDate(b.started, "short") : "")}</td><td>${esc(b.finished ? fmtDate(b.finished, "short") : "—")}</td>
        <td class="num">${esc(b.pages || "")}</td><td class="num">${b.rating ? b.rating + "/5" : ""}</td></tr>`).join("")
        || `<tr><td colspan="6">No books recorded in this period.</td></tr>`}</tbody></table></section>
  `);
}

function repPortfolio(s, range) {
  const rows = sortBy(DB.state.portfolio.filter(p => p.studentId === s.id && inRange(p.date)), "date");
  return docShell("Portfolio Summary", `${s.name} · ${range}`, `
    <section><p>${plural(rows.length, "work sample")} recorded in this period. Attachments are stored on the family's own device; this summary lists each item for review.</p></section>
    <section><h2>Work samples</h2>
      <table><thead><tr><th>Date</th><th>Title</th><th>Subject</th><th>Description</th><th class="num">Files</th></tr></thead>
      <tbody>${rows.map(p => `<tr><td>${esc(fmtDate(p.date, "short"))}</td><td>${esc(p.title)}</td>
        <td>${esc(S.subject(p.subjectId) ? S.subjectName(p.subjectId) : "")}</td><td>${esc(p.description || "")}</td>
        <td class="num">${(p.files || []).length}</td></tr>`).join("") || `<tr><td colspan="5">Nothing recorded in this period.</td></tr>`}</tbody></table></section>
    <div class="sig"><div>Parent / Teacher signature</div><div>Date</div></div>
  `);
}

/* ---------- Report actions ---------- */
ACT["rep-type"] = (el, d) => { REP.type = d.v; scheduleRender(); };
ACT["rep-range"] = () => { REP.from = DB.state.schoolYear.start; REP.to = DB.state.schoolYear.end; scheduleRender(); };
ACT["print-report"] = () => {
  toast("Choose “Save as PDF” in the print dialog to keep a copy", { icon: "printer", ms: 4200 });
  setTimeout(() => window.print(), 260);
};

  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "rep-student") { REP.studentId = el.value; scheduleRender(); }
  if (el.dataset.act === "rep-from") { REP.from = el.value; scheduleRender(); }
  if (el.dataset.act === "rep-to") { REP.to = el.value; scheduleRender(); }
});

/* ============================================================
   Settings — general, school year, grading, data, about
   ============================================================ */

const THEMES = [
  { id: "academia", name: "Quiet Academia", desc: "Ivory, sage and charcoal", dots: ["#F7F4ED", "#5E7358", "#7189A3", "#B4714F"] },
  { id: "dusk", name: "Dusk", desc: "Cool blues and soft plum", dots: ["#F4F5F8", "#52708F", "#7C6B93", "#A9705C"] },
  { id: "terracotta", name: "Terracotta", desc: "Warm clay and olive", dots: ["#FBF5F0", "#A5614A", "#6E7C58", "#B08A3E"] },
];

VIEWS.settings = (route) => {
  const tab = route.sub || "general";
  const inner = ({ general: setGeneral, year: setYear, grading: setGrading, data: setData, about: setAbout }[tab] || setGeneral)();
  const [t, l] = PAGE_TITLES.settings;
  return pageHead(t, l) + subnavHTML("settings", tab) + inner;
};

function settingRow(label, hint, control) {
  return `<div class="list-row" style="padding:var(--s4) var(--s5);align-items:flex-start;flex-wrap:wrap;gap:var(--s4)">
    <div class="lr-main" style="flex:1 1 240px">
      <div style="font-weight:600">${esc(label)}</div>
      ${hint ? `<div class="tiny dim" style="white-space:normal">${hint}</div>` : ""}
    </div>
    <div style="flex:0 0 auto">${control}</div>
  </div>`;
}

/* ---------- General ---------- */

/* generic settings binding */
document.addEventListener("change", e => {
  const el = e.target.closest("[data-set]");
  if (!el) return;
  const path = el.dataset.set.split(".");
  let val;
  if (el.type === "checkbox") {
    val = el.dataset.checkedValue !== undefined ? (el.checked ? el.dataset.checkedValue : el.dataset.uncheckedValue) : el.checked;
  } else if (el.type === "number") val = el.value === "" ? null : Number(el.value);
  else if (el.tagName === "SELECT" && el.value === "") val = null;
  else if (el.tagName === "SELECT" && !isNaN(Number(el.value)) && el.value !== "") val = Number(el.value);
  else val = el.value;
  let obj = DB.state;
  for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]];
  obj[path[path.length - 1]] = val;
  applyTheme();
  DB.touch(false);
  setSaveState("saving");
  if (path[0] === "schoolYear" || path.includes("grading") || path.includes("motion")
      || path.includes("hoursPerDay") || path.includes("currency") || path.includes("weekStart")) scheduleRender();
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-set]");
  if (!el || el.type === "checkbox" || el.tagName === "SELECT") return;
  const path = el.dataset.set.split(".");
  let obj = DB.state;
  for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]];
  obj[path[path.length - 1]] = el.type === "number" ? (el.value === "" ? null : Number(el.value)) : el.value;
  DB.dirty = true; setSaveState("saving"); DB.save();
});

      <div class="list">

          `<input class="inp" type="number" style="width:110px" min="0" max="400" value="${attr(sy.requiredDays)}" data-set="schoolYear.requiredDays">`)}
        ${settingRow("Required hours per year", "Some families track hours instead of days.",
          `<input class="inp" type="number" style="width:110px" min="0" max="3000" value="${attr(sy.requiredHours)}" data-set="schoolYear.requiredHours">`)}
      </div>

        <div class="hd-actions row tiny dim" style="gap:var(--s3)">
          <span class="row" style="gap:5px"><span class="yr-dot on"></span>School day</span>
          <span class="row" style="gap:5px"><span class="yr-dot brk"></span>Break</span>
          <span class="row" style="gap:5px"><span class="yr-dot off"></span>Off</span>
        </div>
      </div>
      <div class="card-bd"><div class="yr-grid">${yearOverview()}</div></div>
    </div>

    <div class="card">
      <div class="card-hd"><h3>Breaks & holidays</h3>
        <div class="hd-actions"><button class="btn btn-sm btn-primary" data-act="add-break">${icon("plus")}Add break</button></div></div>

            <div class="lr-sub">${esc(fmtDate(b.start, "med"))} – ${esc(fmtDate(b.end, "med"))} · ${esc(plural(diffDays(b.start, b.end) + 1, "day"))}</div></div>
          <span class="chip">${esc(b.type || "break")}</span>
        </div>`).join("")}
      </div>` : `<div class="card-bd">${emptyState("leaf", "No breaks yet", "Add winter break, holidays and vacations so they're excluded from school days and repeating lessons.", "Add a break", 'data-act="add-break"')}</div>`}
    </div>`;
}
function yearOverview() {
  const sy = DB.state.schoolYear;
  const start = parseISO(sy.start), end = parseISO(sy.end);
  if (!start || !end || end < start) return `<p class="tiny dim">Set a start and end date to see the year.</p>`;
  const out = [];
  let cur = new Date(start.getFullYear(), start.getMonth(), 1);
  let guard = 0;
  while (cur <= end && guard++ < 24) {
    const y = cur.getFullYear(), m = cur.getMonth();
    const days = new Date(y, m + 1, 0).getDate();
    const lead = (new Date(y, m, 1).getDay() - DB.state.settings.weekStart + 7) % 7;
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(`<span class="yr-cell"></span>`);
    let schoolCount = 0;
    for (let d = 1; d <= days; d++) {
      const dISO = iso(new Date(y, m, d));
      const brk = S.breakOn(dISO);
      const school = S.isSchoolDay(dISO);
      if (school) schoolCount++;
      const cls = school ? "on" : brk ? "brk" : "off";
      cells.push(`<span class="yr-cell ${cls}" title="${esc(fmtDate(dISO, "med"))}${brk ? " · " + esc(brk.name) : ""}"></span>`);
    }
    out.push(`<div class="yr-month">
      <div class="yr-hd"><span>${MON_SHORT[m]} ${String(y).slice(2)}</span><span class="dim tnum">${schoolCount}</span></div>
      <div class="yr-days">${cells.join("")}</div>
    </div>`);
    cur = addMonths(cur, 1);
  }
  return out.join("");
}

ACT["backup-now"] = async () => {
  const blobs = await Blobs.exportAll();
  const payload = {
    app: "homeschool-command-center", schema: SCHEMA, exportedAt: new Date().toISOString(),
    state: DB.state, files: blobs,
  };
  const name = `homeschool-backup-${todayISO()}.json`;
  download(name, JSON.stringify(payload), "application/json");
  DB.state.settings.lastBackupAt = new Date().toISOString();
  DB.touch();
  toast("Backup saved to your downloads", { icon: "check", ms: 4500 });
};

ACT.restore = () => {
  pickFile(".json,application/json", async file => {
    if (!file) return;
    let data;
    try { data = JSON.parse(await readFileText(file)); }
    catch (e) { toast("That file isn't a valid backup", { icon: "alert" }); return; }
    const st = data.state || data;
    if (!st || !Array.isArray(st.students)) { toast("That file isn't a Homeschool Command Center backup", { icon: "alert" }); return; }

/* Small hand-drawn-looking placeholder images so the sample
   portfolio looks like a real one. Generated locally — no files
   are downloaded, nothing leaves the device. */
function sampleArt(kind, seed = 1) {
  const W = 900, H = 680;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const rnd = (n => () => (n = (n * 16807) % 2147483647) / 2147483647)(kind.length * 7919 + seed * 104729 + 13);

  // paper
  x.fillStyle = "#FBF7EF"; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) {
    x.fillStyle = `rgba(120,105,80,${0.012 + rnd() * 0.02})`;
    x.fillRect(rnd() * W, rnd() * H, 2, 2);
  }

  const wash = (cx, cy, r, col, a) => {
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `rgba(${col},${a})`);
    g.addColorStop(1, `rgba(${col},0)`);
    x.fillStyle = g;
    x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  };

  if (kind === "watercolour") {
    const cols = ["176,113,79", "150,120,60", "120,140,90", "170,90,70", "110,130,140"];
    for (let i = 0; i < 22; i++) {
      wash(120 + rnd() * (W - 240), 100 + rnd() * (H - 200), 70 + rnd() * 150, cols[Math.floor(rnd() * cols.length)], 0.20 + rnd() * 0.2);
    }
    // a few leaf strokes
    x.strokeStyle = "rgba(90,70,45,.26)"; x.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const cx = 170 + rnd() * (W - 340), cy = 170 + rnd() * (H - 340), s = 46 + rnd() * 46;
      const tilt = (rnd() - 0.5) * 0.9;
      x.save(); x.translate(cx, cy); x.rotate(tilt);
      x.beginPath();
      x.moveTo(-s, 0);
      x.quadraticCurveTo(0, -s * 0.62, s, 0);
      x.quadraticCurveTo(0, s * 0.62, -s, 0);
      x.stroke();
      x.beginPath(); x.moveTo(-s, 0); x.lineTo(s * 0.72, 0); x.stroke();
      x.restore();
    }
  } else if (kind === "writing") {
    x.strokeStyle = "rgba(120,140,165,.45)"; x.lineWidth = 1.4;
    for (let y = 110; y < H - 60; y += 54) {
      x.beginPath(); x.moveTo(70, y); x.lineTo(W - 70, y); x.stroke();
    }
    x.strokeStyle = "rgba(180,110,100,.5)";
    x.beginPath(); x.moveTo(120, 60); x.lineTo(120, H - 50); x.stroke();
    // handwriting squiggles
    x.strokeStyle = "rgba(52,58,74,.72)"; x.lineWidth = 2.6; x.lineCap = "round";
    let line = 0;
    for (let y = 106; y < H - 80; y += 54) {
      let px = 140 + (line === 0 ? 40 : 0);
      const limit = W - 110 - rnd() * (line % 4 === 3 ? 320 : 90);
      x.beginPath(); x.moveTo(px, y);
      while (px < limit) {
        const w = 9 + rnd() * 16;
        x.quadraticCurveTo(px + w / 2, y - 14 - rnd() * 12, px + w, y - rnd() * 3);
        px += w + 3 + rnd() * 4;
      }
      x.stroke();
      line++;
    }
  } else if (kind === "diagram") {
    wash(W / 2, H / 2, 380, "120,150,170", 0.16);
    x.strokeStyle = "rgba(60,80,100,.72)"; x.lineWidth = 3; x.lineCap = "round";
    const nodes = [[240, 200], [660, 190], [700, 470], [250, 480]];
    nodes.forEach(([cx, cy], i) => {
      x.beginPath(); x.arc(cx, cy, 62, 0, Math.PI * 2); x.stroke();
      x.fillStyle = `rgba(${["150,120,60", "110,140,150", "120,140,90", "170,110,80"][i]},.28)`;
      x.fill();
    });
    x.setLineDash([10, 9]);
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i], b = nodes[(i + 1) % nodes.length];
      x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke();
    }
    x.setLineDash([]);
    x.strokeStyle = "rgba(60,70,80,.5)"; x.lineWidth = 2;
    nodes.forEach(([cx, cy]) => {
      for (let l = 0; l < 2; l++) {
        x.beginPath(); x.moveTo(cx - 34, cy + 82 + l * 16); x.lineTo(cx + 34 - rnd() * 26, cy + 82 + l * 16); x.stroke();
      }
    });
  } else { // timeline
    x.strokeStyle = "rgba(70,60,45,.7)"; x.lineWidth = 3;
    x.beginPath(); x.moveTo(90, H / 2); x.lineTo(W - 90, H / 2); x.stroke();
    for (let i = 0; i < 6; i++) {
      const px = 140 + i * ((W - 280) / 5);
      const up = i % 2 === 0;
      x.beginPath(); x.moveTo(px, H / 2); x.lineTo(px, H / 2 + (up ? -70 : 70)); x.stroke();
      x.fillStyle = `rgba(${["150,120,60", "120,140,90", "170,110,80", "110,130,150", "140,110,130", "120,120,90"][i]},.35)`;
      x.fillRect(px - 58, H / 2 + (up ? -170 : 70), 116, 96);
      x.strokeStyle = "rgba(70,60,45,.5)"; x.lineWidth = 2;
      for (let l = 0; l < 3; l++) {
        const ly = H / 2 + (up ? -152 : 92) + l * 22;
        x.beginPath(); x.moveTo(px - 44, ly); x.lineTo(px + 44 - rnd() * 34, ly); x.stroke();
      }
      x.strokeStyle = "rgba(70,60,45,.7)"; x.lineWidth = 3;
    }
  }

  // soft vignette so it reads like a photograph of paper
  const v = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(60,50,35,.10)");
  x.fillStyle = v; x.fillRect(0, 0, W, H);

  try { return c.toDataURL("image/jpeg", 0.82); } catch (e) { return null; }
}

/* ===== 84-onboarding.js ===== */
/* ============================================================
   Onboarding — short, skippable, friendly
   ============================================================ */
function startOnboarding(force) {
  if (DB.state.onboarded && !force) return null;

  const existing = DB.state.students.filter(s => !s.archived);
  const st = {
    step: 0,
    family: DB.state.family.name || "",
    students: existing.length
      ? existing.map(s => ({ id: s.id, name: s.name, grade: s.grade || "" }))
      : [{ name: "", grade: "" }],
    start: DB.state.schoolYear.start,
    end: DB.state.schoolYear.end,
    days: [...DB.state.schoolYear.schoolDays],
    subjects: DB.state.subjects.length
      ? DB.state.subjects.map(s => s.name)
      : ["Math", "Language Arts", "Science", "History", "Art"],
  };
  const TOTAL = 5;

  const ctl = openModal({
    title: undefined, closeOnScrim: false, scrimClass: "onb-scrim", className: "onb", body: "",
    onMount(c) {
      c.modal.classList.remove("modal");
      c.modal.classList.add("onb");
      c.modal.addEventListener("keydown", e => {
        if (e.key !== "Enter" || st.step === 0 || st.step >= TOTAL) return;
        if (e.target.tagName === "TEXTAREA") return;
        e.preventDefault();
        next();
      });
      draw();

      function draw() {
        c.modal.innerHTML = `<div class="onb-inner">
          <div class="onb-logo">
            <span class="brand-mark">${icon("cap")}</span>
            <span><span class="brand-name" style="display:block">Homeschool</span><span class="brand-sub">Command Center</span></span>
          </div>
          ${st.step > 0 ? `<div class="onb-steps">${Array.from({ length: TOTAL }, (_, i) => `<i class="${i < st.step ? "on" : ""}"></i>`).join("")}</div>` : ""}
          ${body()}
        </div>`;
        bind();
        // Don't auto-focus on the welcome screen (step 0) — it's a landing
        // screen, and focusing a lower CTA scrolls its headline off the top on
        // short phones. Focus form fields on later steps, and always start each
        // step scrolled to the top.
        const f = st.step === 0 ? null : c.modal.querySelector("input,select,button.btn-primary");
        setTimeout(() => {
          if (f) f.focus({ preventScroll: true });
          if (c.scrim) c.scrim.scrollTop = 0;
        }, 60);
      }

      function body() {
        switch (st.step) {
          case 0: return `
            <h1>A calm home for your homeschool.</h1>
            <p class="lede">Plan lessons, keep records and print reports — without spreadsheets, subscriptions or an account. Setup takes about a minute.</p>
            <div style="margin:var(--s5) 0">
              ${[["sun", "Today, first", "Open it in the morning and see exactly what today holds."],
                 ["users", "Built for several children", "Switch between the whole family and one child instantly."],
                 ["lock", "Private and offline", "Everything stays on this device. No account, no cloud, no tracking."]]
                .map(([ic, t, d]) => `<div class="value-row"><div class="vi">${icon(ic)}</div><div><div class="vt">${t}</div><div class="vs">${d}</div></div></div>`).join("")}
            </div>
            <div class="onb-ft">
              <button class="btn btn-primary btn-lg" data-next>${icon("arrow-r")}Set up my homeschool</button>
              <button class="btn btn-lg" data-demo>${icon("sparkle")}Explore with sample family</button>
              <div class="spacer"></div>
              <button class="btn btn-ghost" data-skip>Skip</button>
            </div>`;

          case 1: return `
            <h1>What shall we call your homeschool?</h1>
            <p class="lede">This appears on your dashboard and at the top of printed reports. A first name or surname is plenty.</p>
            <div class="field"><label for="onb-fam">Family name</label>
              <input class="inp" id="onb-fam" value="${attr(st.family)}" placeholder="e.g. The Bennetts" data-f="family"></div>
            ${footer("Continue")}`;

          case 2: return `
            <h1>Who are we planning for?</h1>
            <p class="lede">Add each child. Only a name is needed — grades, photos and everything else can wait.</p>
            <div id="onb-students" class="col">
              ${st.students.map((s, i) => `<div class="row" style="gap:8px">
                <input class="inp" placeholder="Name" value="${attr(s.name)}" data-stu-name="${i}" style="flex:2 1 160px">
                <input class="inp" placeholder="Grade (optional)" value="${attr(s.grade)}" data-stu-grade="${i}" style="flex:1 1 130px">
                ${st.students.length > 1 ? `<button class="btn btn-ghost btn-icon" data-stu-del="${i}" aria-label="Remove">${icon("x")}</button>` : ""}
              </div>`).join("")}
            </div>
            <button class="btn btn-sm" style="margin-top:12px" data-stu-add>${icon("plus")}Add another child</button>
            ${footer("Continue")}`;

          case 3: return `
            <h1>When does your year run?</h1>
            <p class="lede">Used for attendance totals and to keep repeating lessons inside the year. You can change all of this later.</p>
            <div class="form-grid">
              <div class="field"><label for="onb-start">First day</label><input class="inp" type="date" id="onb-start" value="${attr(st.start)}" data-f="start"></div>
              <div class="field"><label for="onb-end">Last day</label><input class="inp" type="date" id="onb-end" value="${attr(st.end)}" data-f="end"></div>
              <div class="field full"><label>Which days are school days?</label>
                <div class="opt-grid">${DOW_SHORT.map((d, i) => `<button type="button" class="opt ${st.days.includes(i) ? "is-on" : ""}" data-day="${i}">${d}</button>`).join("")}</div>
              </div>
            </div>
            ${footer("Continue")}`;

          case 4: return `
            <h1>Pick your subjects.</h1>
            <p class="lede">Tap the ones you'll teach. You can add your own — including anything unusual — at any time.</p>
            <div class="opt-grid">
              ${DEFAULT_SUBJECTS.map(s => `<button type="button" class="opt ${st.subjects.includes(s.name) ? "is-on" : ""}" data-subj="${attr(s.name)}">${icon(s.icon)}${esc(s.name)}</button>`).join("")}
            </div>
            ${footer("Finish setup")}`;

          default: return `
            <h1>You're ready. Let's plan today.</h1>
            <p class="lede">Everything autosaves as you go. When you have a moment, export a backup from Settings — it's the one habit worth having.</p>
            <div class="onb-ft"><button class="btn btn-primary btn-lg" data-done>${icon("sun")}Open Today</button></div>`;
        }
      }

      function footer(label) {
        return `<div class="onb-ft">
          <button class="btn btn-ghost" data-back>${icon("chev-l")}Back</button>
          <div class="spacer"></div>
          <button class="btn btn-ghost" data-skip>Skip setup</button>
          <button class="btn btn-primary btn-lg" data-next>${esc(label)}</button>
        </div>`;
      }

      function bind() {
        const m = c.modal;
        const q = sel => $$(sel, m);
        q("[data-f]").forEach(i => i.addEventListener("input", () => { st[i.dataset.f] = i.value; }));
        q("[data-stu-name]").forEach(i => i.addEventListener("input", () => { st.students[+i.dataset.stuName].name = i.value; }));
        q("[data-stu-grade]").forEach(i => i.addEventListener("input", () => { st.students[+i.dataset.stuGrade].grade = i.value; }));
        q("[data-stu-del]").forEach(b => b.onclick = () => { st.students.splice(+b.dataset.stuDel, 1); draw(); });
        const addBtn = m.querySelector("[data-stu-add]");
        if (addBtn) addBtn.onclick = () => { st.students.push({ name: "", grade: "" }); draw(); };
        q("[data-day]").forEach(b => b.onclick = () => {
          const n = +b.dataset.day, i = st.days.indexOf(n);
          i >= 0 ? st.days.splice(i, 1) : st.days.push(n);
          b.classList.toggle("is-on");
        });
        q("[data-subj]").forEach(b => b.onclick = () => {
          const n = b.dataset.subj, i = st.subjects.indexOf(n);
          i >= 0 ? st.subjects.splice(i, 1) : st.subjects.push(n);
          b.classList.toggle("is-on");
        });
        const nx = m.querySelector("[data-next]"); if (nx) nx.onclick = next;
        const bk = m.querySelector("[data-back]"); if (bk) bk.onclick = () => { st.step = Math.max(0, st.step - 1); draw(); };
        const sk = m.querySelector("[data-skip]"); if (sk) sk.onclick = () => { finish(false); };
        const dm = m.querySelector("[data-demo]"); if (dm) dm.onclick = () => { c.close(); DB.state.onboarded = true; loadDemo(); };
        const dn = m.querySelector("[data-done]"); if (dn) dn.onclick = () => { c.close(); go("today"); };
      }

      function next() {
        if (st.step === 2) {
          st.students = st.students.filter(s => s.name.trim());
          if (!st.students.length) { toast("Add at least one child's name, or skip setup", { icon: "alert" }); st.students = [{ name: "", grade: "" }]; draw(); return; }
        }
        if (st.step === 3 && st.end < st.start) { toast("The last day can't come before the first", { icon: "alert" }); return; }
        st.step++;
        if (st.step >= TOTAL) { finish(true); return; }
        draw();
      }

      function finish(apply) {
        if (apply) {
          DB.state.family.name = st.family.trim();
          st.students.filter(s => s.name.trim()).forEach(s => {
            const found = s.id && DB.get("students", s.id);
            if (found) { found.name = s.name.trim(); found.grade = s.grade.trim(); return; }
            const used = DB.state.students.map(x => x.color);
            DB.state.students.push({
              id: uid("s"), createdAt: Date.now(), name: s.name.trim(), grade: s.grade.trim(),
              color: PALETTE.find(c => !used.includes(c)) || PALETTE[DB.state.students.length % PALETTE.length],
              prefDuration: DB.state.settings.defaultDuration,
            });
          });
          DB.state.schoolYear.start = st.start;
          DB.state.schoolYear.end = st.end;
          DB.state.schoolYear.schoolDays = st.days.sort();
          const have = new Set(DB.state.subjects.map(x => x.name.trim().toLowerCase()));
          st.subjects.forEach(name => {
            if (have.has(name.trim().toLowerCase())) return;
            have.add(name.trim().toLowerCase());
            const def = DEFAULT_SUBJECTS.find(d => d.name === name) || { icon: "book-open", color: PALETTE[0] };
            DB.state.subjects.push({ id: uid("sub"), createdAt: Date.now(), name, icon: def.icon, color: def.color, studentIds: [] });
          });
        }
        DB.state.onboarded = true;
        DB.touch();
        if (apply) { st.step = TOTAL; draw(); }
        else { c.close(); scheduleRender(); }
      }
    }
  });
  return ctl;
}


/* ===== 90-boot.js ===== */
/* ============================================================
   Boot
   ============================================================ */
async function boot() {
  DB.load();

  // new day? reset the Today view and keep the greeting honest
  if (DB.state.settings.lastSeenDate !== todayISO()) {
    DB.state.settings.lastSeenDate = todayISO();
    TODAY_DATE = todayISO();
    CAL.anchor = todayISO();
  }

  applyTheme();
  renderShell();

  if (!location.hash) location.hash = "#/home";
  renderRoute();

  window.addEventListener("hashchange", renderRoute);

  // flush pending writes before the tab closes
  window.addEventListener("beforeunload", () => { if (DB.dirty) DB._write(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && DB.dirty) DB._write(); });

  // portfolio thumbnails & student photos
  await Blobs.loadThumbs();
  if (Blobs.thumbs.size) scheduleRender();

  if (!DB.state.onboarded) {
    startOnboarding();
  } else if (S.needsBackup() && ROUTE.section !== "settings") {
    const d = S.daysSinceBackup();
    setTimeout(() => {
      toast(d === null ? "Tip: export a backup to keep your records safe" : `Last backup was ${plural(d, "day")} ago`, {
        icon: "shield", ms: 7000, action: "Back up", onAction: () => ACT["backup-now"]()
      });
    }, 1800);
  }

  console.log(`%c${APP.name} ${APP.version}`, "font-weight:bold", "— your data stays on this device.");
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

</script>
